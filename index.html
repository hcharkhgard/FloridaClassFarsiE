کتابچه (بخش ۹.۶)، یک خط زرد تنها لبه چپ جاده‌های جداشده و خیابان‌های یک‌طرفه را مشخص می‌کند؛ پس اگر خط زرد در سمت چپ شماست، ترافیک مقابل در سمت شما نیست. منطقه پارک ممنوع با تابلو یا علامت رسمی مشخص می‌شود، نه با خط لبه. خط دوچرخه با تابلو یا نماد دوچرخه و فلش علامت‌گذاری می‌شود. منطقه مدرسه با تابلوی پنج‌ضلعی و تابلوی سرعت اعلام می‌شود.", "sg": null}, {"t": "signals", "s": ["H9.6"], "q": ["You are in a lane marked with a curved arrow and the word ONLY. You must:", "در خطی هستید که روی آن یک فلش خمیده و کلمه ONLY نوشته شده است. باید:"], "o": [["Go straight or turn, as you choose", "به انتخاب خودتان مستقیم بروید یا بپیچید"], ["Use this lane only for passing", "از این خط فقط برای سبقت استفاده کنید"], ["Turn in the direction of the arrow", "در جهت فلش بپیچید"], ["Stop before the arrow and wait for a green light", "قبل از فلش بایستید و منتظر چراغ سبز بمانید"]], "a": 2, "x": "کتابچه (بخش ۹.۶) می‌گوید اگر در خطی با فلش خمیده و کلمه ONLY هستید، باید در جهت فلش بپیچید. کلمه ONLY یعنی «فقط»، پس انتخاب مستقیم رفتن وجود ندارد. این علامت ربطی به سبقت ندارد و فقط جهت حرکت را تعیین می‌کند. فلش روی آسفالت هم فرمان توقف نیست؛ توقف را چراغ یا تابلو تعیین می‌کند.", "sg": null}, {"t": "signals", "s": ["H9.2"], "q": ["A pedestrian is already in the crosswalk when the DON'T WALK (raised hand) signal starts flashing. The pedestrian should:", "عابری داخل خط عابر است که علامت DON'T WALK (دست بالا) شروع به چشمک زدن می‌کند. این عابر باید:"], "o": [["Go back to the curb where they started", "به جدولی که از آن شروع کرده برگردد"], ["Finish crossing the street", "عبور از خیابان را تمام کند"], ["Stop and wait in the middle of the street", "وسط خیابان بایستد و منتظر بماند"], ["Wait for a driver to wave them across", "صبر کند تا راننده‌ای با دست به او علامت عبور بدهد"]], "a": 1, "x": "طبق کتابچه (بخش ۹.۲)، عابری که هنگام شروع چشمک زدن DON'T WALK داخل خط عابر است باید عبور را تمام کند. چشمک زدن فقط یعنی عبور تازه را شروع نکنید، نه اینکه برگردید. ایستادن وسط خیابان عابر را در معرض خطر قرار می‌دهد. علامت دادن راننده جایگزین چراغ عابر نیست. رانندگان هم باید به عابری که در حال تمام کردن عبور است راه بدهند.", "sg": null}, {"t": "signals", "s": ["H9.2"], "q": ["What does a steady DON'T WALK or raised-hand pedestrian signal mean?", "علامت ثابت DON'T WALK یا «دست بالا» برای عابران به چه معناست؟"], "o": [["Pedestrians may start crossing if they hurry", "عابران اگر عجله کنند می‌توانند عبور را شروع کنند"], ["All drivers must stop, even on green", "همه رانندگان باید بایستند، حتی با چراغ سبز"], ["The signal is broken and should be ignored", "چراغ خراب است و باید نادیده گرفته شود"], ["A pedestrian may not begin crossing", "عابر نباید عبور را شروع کند"]], "a": 3, "x": "کتابچه (بخش ۹.۲) می‌گوید علامت DON'T WALK یا دست بالا یعنی عابر نباید عبور را شروع کند. عجله کردن این حکم را تغییر نمی‌دهد. این علامت برای عابران است و رانندگانِ دارای چراغ سبز را متوقف نمی‌کند؛ البته رانندگان همیشه باید به عابرانی که هنوز در خیابان هستند راه بدهند. این علامت یک حالت عادی چراغ است، نه نشانه خرابی.", "sg": null}, {"t": "signals", "s": ["H9.4"], "q": ["A traffic signal on a freeway entrance ramp is showing red. You must:", "چراغ راهنمایی روی رمپ ورودی آزادراه قرمز است. باید:"], "o": [["Wait for the green signal before entering the freeway", "پیش از ورود به آزادراه منتظر چراغ سبز بمانید"], ["Yield, then enter when there is a gap", "حق تقدم بدهید و در اولین فاصله وارد شوید"], ["Ignore it if freeway traffic is light", "اگر ترافیک آزادراه کم است آن را نادیده بگیرید"], ["Drive around it on the shoulder", "از روی شانه جاده آن را دور بزنید"]], "a": 0, "x": "طبق کتابچه (بخش ۹.۴)، چراغ رمپ نرخ ورود خودروها به آزادراه را کنترل می‌کند و راننده باید پیش از ورود منتظر چراغ سبز بماند. این چراغ وسیله رسمی کنترل ترافیک است و نافرمانی از آن طبق بند 316.074 جریمه دارد. پس نه «حق تقدم و ورود» مجاز است و نه نادیده گرفتن آن به دلیل ترافیک کم. رانندگی روی شانه برای دور زدن چراغ هم غیرقانونی و خطرناک است.", "sg": null}, {"t": "safe", "s": ["316.157"], "q": ["A driver extends the left hand and arm straight out horizontally. This hand signal means:", "راننده‌ای دست و بازوی چپ خود را به‌صورت افقی و صاف بیرون می‌برد. این علامت دستی یعنی:"], "o": [["Stop or slow down", "توقف یا کاهش سرعت"], ["Right turn", "گردش به راست"], ["Left turn", "گردش به چپ"], ["It is safe for you to pass", "سبقت گرفتن برای شما امن است"]], "a": 2, "x": "طبق بند 316.157 قوانین فلوریدا، دست و بازوی افقی یعنی گردش به چپ. توقف یا کاهش سرعت با دست رو به پایین نشان داده می‌شود. گردش به راست با دست رو به بالا نشان داده می‌شود. هیچ علامت دستی قانونی به معنای «سبقت بگیر» وجود ندارد و تصمیم سبقت با خود شماست.", "sg": null}, {"t": "safe", "s": ["316.157"], "q": ["A driver's left hand and arm are extended UPWARD. This means the driver is about to:", "دست و بازوی چپ راننده رو به «بالا» است. یعنی راننده قصد دارد:"], "o": [["Turn left", "به چپ بپیچد"], ["Turn right", "به راست بپیچد"], ["Stop", "توقف کند"], ["Back up", "دنده‌عقب برود"]], "a": 1, "x": "بند 316.157 می‌گوید دست و بازوی رو به بالا یعنی گردش به راست (دوچرخه‌سوار می‌تواند دست راست را افقی به راست بگیرد). دست افقی علامت گردش به چپ است. دست رو به پایین علامت توقف یا کاهش سرعت است. برای دنده‌عقب هیچ علامت دستی رسمی تعریف نشده است.", "sg": null}, {"t": "license", "s": ["H4.3"], "q": ["You receive a red-light violation recorded by a traffic camera (traffic infraction detector). How does it affect your driving record?", "برای عبور از چراغ قرمز که با دوربین (traffic infraction detector) ثبت شده، جریمه می‌شوید. این تخلف چه اثری بر سابقه رانندگی شما دارد؟"], "o": [["It adds 4 points", "۴ امتیاز منفی اضافه می‌کند"], ["It adds 6 points", "۶ امتیاز منفی اضافه می‌کند"], ["It automatically suspends your license for 30 days", "گواهینامه را خودکار ۳۰ روز تعلیق می‌کند"], ["It does not put points on your record", "امتیاز منفی به سابقه شما اضافه نمی‌کند"]], "a": 3, "x": "کتابچه (بخش ۴.۳) می‌گوید تخلف چراغ قرمزِ ثبت‌شده با دوربین به سابقه راننده امتیاز منفی اضافه نمی‌کند. ۴ امتیاز مربوط به زمانی است که افسر پلیس برای چراغ قرمز به شما برگه جریمه بدهد، نه دوربین. ۶ امتیاز برای تخلفات سنگین‌تری مثل ترک صحنه تصادف است. تعلیق خودکار ۳۰ روزه هم برای این تخلف تعیین نشده است.", "sg": null}, {"t": "special", "s": ["322.27"], "q": ["Unlawfully driving through a railroad-highway grade crossing (for example, going around a lowered gate) adds how many points to your record?", "رانندگی غیرقانونی از تقاطع راه‌آهن (مثلاً دور زدن راهبند پایین‌آمده) چند امتیاز منفی به سابقه شما اضافه می‌کند؟"], "o": [["6 points", "۶ امتیاز"], ["2 points", "۲ امتیاز"], ["3 points", "۳ امتیاز"], ["4 points", "۴ امتیاز"]], "a": 0, "x": "بند 322.27 قوانین فلوریدا برای رانندگی غیرقانونی از تقاطع راه‌آهن ۶ امتیاز تعیین کرده است. این از امتیاز بیشتر تخلفات حرکتی بالاتر است، چون خطر برخورد با قطار مرگبار است. ۳ امتیاز برای «سایر تخلفات حرکتی» و ۴ امتیاز برای تخلفاتی مانند عبور از چراغ قرمز است. ۲ امتیاز فقط امتیاز اضافی برای استفاده غیرقانونی از تلفن در منطقه مدرسه است.", "sg": null}, {"t": "emergency", "s": ["H5.32"], "q": ["Your car breaks down on the highway. You should park it where it can be seen from at least how far in each direction?", "خودروی شما در جاده خراب می‌شود. آن را باید جایی پارک کنید که از هر دو جهت دست‌کم از چه فاصله‌ای دیده شود؟"], "o": [["50 feet", "۵۰ فوت"], ["100 feet", "۱۰۰ فوت"], ["200 feet", "۲۰۰ فوت"], ["500 feet", "۵۰۰ فوت"]], "a": 2, "x": "کتابچه (بخش ۵.۳۲) می‌گوید خودروی ازکارافتاده را جایی پارک کنید که از هر جهت از ۲۰۰ فوتی دیده شود، و خودرو را طوری جابه‌جا کنید که هر چهار چرخ بیرون از خطوط عبور باشد. ۵۰ و ۱۰۰ فوت فاصله کمی است و به رانندگان دیگر وقت کافی برای واکنش نمی‌دهد. ۵۰۰ فوت عدد مربوط به کم کردن نور بالا برای خودروی روبه‌رو است، نه این قانون.", "sg": null}, {"t": "emergency", "s": ["H5.32"], "q": ["A small fire starts in your vehicle and you have a portable extinguisher. If the fire keeps getting larger, you should:", "آتش کوچکی در خودروی شما شروع می‌شود و کپسول آتش‌نشانی دستی دارید. اگر آتش بزرگ‌تر شود، باید:"], "o": [["Keep driving to the nearest gas station", "به رانندگی تا نزدیک‌ترین پمپ بنزین ادامه دهید"], ["Get away from the vehicle", "از خودرو دور شوید"], ["Open the hood all the way to let the smoke out", "کاپوت را کاملاً باز کنید تا دود خارج شود"], ["Stay inside and keep using the extinguisher", "داخل خودرو بمانید و به استفاده از کپسول ادامه دهید"]], "a": 1, "x": "طبق کتابچه (بخش ۵.۳۲)، اگر آتش کوچک است و کپسول دارید، سعی کنید آن را خاموش کنید؛ اما اگر بزرگ‌تر شد، از خودرو دور شوید. ادامه رانندگی با خودروی در حال سوختن جان شما و دیگران را به خطر می‌اندازد، و پمپ بنزین بدترین مقصد ممکن است. باز کردن کامل کاپوت به آتش هوای بیشتر می‌رساند. ماندن داخل خودرو هنگام بزرگ شدن آتش بسیار خطرناک است.", "sg": null}, {"t": "emergency", "s": ["H5.32"], "q": ["Your vehicle goes into deep water and begins to sink. According to the handbook, you should:", "خودروی شما در آب عمیق می‌افتد و در حال فرو رفتن است. طبق کتابچه باید:"], "o": [["Keep your seat belt on until the car reaches the bottom", "کمربند را تا رسیدن خودرو به کف نگه دارید"], ["Wait for the car to fill with water before doing anything", "قبل از هر کاری صبر کنید تا خودرو پر از آب شود"], ["Call 911 and stay in your seat until help arrives", "با ۹۱۱ تماس بگیرید و تا رسیدن کمک روی صندلی بمانید"], ["Stay calm, remove your seat belt, lower the window, and climb onto the top of the vehicle", "آرام بمانید، کمربند را باز کنید، شیشه را پایین بکشید و روی سقف خودرو بروید"]], "a": 3, "x": "کتابچه (بخش ۵.۳۲) می‌گوید: آرام بمانید و وضعیت را بسنجید، کمربند را باز کنید، شیشه را پایین بکشید و روی سقف خودرو بروید. بسته ماندن کمربند شما را در خودروی در حال غرق شدن گیر می‌اندازد. صبر کردن تا پر شدن خودرو فرصت فرار را از بین می‌برد. نشستن و منتظر کمک ماندن هم وقت حیاتی را هدر می‌دهد؛ اول باید خودتان خارج شوید.", "sg": null}, {"t": "emergency", "s": ["H5.3"], "q": ["A crash cannot be avoided. According to the handbook, which is the BEST thing to hit?", "تصادف اجتناب‌ناپذیر است. طبق کتابچه، برخورد با کدام گزینه «بهتر» است؟"], "o": [["A row of bushes", "یک ردیف بوته"], ["A tree", "یک درخت"], ["A utility pole", "یک تیر برق"], ["A vehicle coming toward you", "خودرویی که به سمت شما می‌آید"]], "a": 0, "x": "کتابچه (بخش ۵.۳) می‌گوید برخورد با یک ردیف بوته بهتر از برخورد با درخت، تیر یا هر جسم سخت دیگر است، چون بوته ضربه را جذب می‌کند. درخت و تیر برق اجسام سخت و ثابت‌اند و آسیب بسیار بیشتری می‌زنند. برخورد با خودرویی که به سمت شما می‌آید (شاخ‌به‌شاخ) خطرناک‌ترین حالت است؛ کتابچه می‌گوید حتی برخورد با جسمی که حرکت نمی‌کند از آن بهتر است.", "sg": null}, {"t": "safe", "s": ["H5.12"], "q": ["A police officer signals you to pull over at night. After pulling off to the extreme right, clear of traffic, you should turn off your engine and:", "شب هنگام، مأمور پلیس به شما علامت می‌دهد که کنار بزنید. پس از رفتن به منتهاالیه سمت راست و بیرون از ترافیک، موتور را خاموش کنید و:"], "o": [["Get out and walk back to the officer's car", "پیاده شوید و به سمت خودروی مأمور بروید"], ["Leave your high beams on so the officer can see", "نور بالا را روشن بگذارید تا مأمور بهتر ببیند"], ["Switch your headlights to the parking-light position and sit calmly", "چراغ‌های جلو را روی حالت چراغ پارک بگذارید و آرام بنشینید"], ["Start looking for your documents under the seats", "شروع به گشتن زیر صندلی‌ها برای یافتن مدارک کنید"]], "a": 2, "x": "طبق کتابچه (بخش ۵.۱۲)، فوراً به منتهاالیه راست بروید، موتور را خاموش کنید، شب چراغ‌ها را روی حالت چراغ پارک بگذارید، آرام بنشینید و از دستورات مأمور پیروی کنید. پیاده شدن و رفتن به سمت خودروی پلیس بدون دستور می‌تواند برای شما و مأمور خطرناک باشد. نور بالا دید مأمور را مختل می‌کند. گشتن ناگهانی زیر صندلی‌ها ممکن است حرکتی مشکوک به نظر برسد؛ منتظر دستور مأمور بمانید.", "sg": null}, {"t": "lights", "s": ["H5.27"], "q": ["At night, what lights must be on for a vehicle parked on a roadway or shoulder outside cities and towns?", "شب هنگام، برای خودرویی که روی جاده یا شانه جاده بیرون از شهرها پارک شده، کدام چراغ‌ها باید روشن باشند؟"], "o": [["High-beam headlights", "نور بالای چراغ‌های جلو"], ["Parking lights", "چراغ‌های پارک"], ["No lights are needed", "هیچ چراغی لازم نیست"], ["Only the interior dome light", "فقط چراغ سقف داخل خودرو"]], "a": 1, "x": "کتابچه (بخش ۵.۲۷) می‌گوید شب‌ها برای هر خودرویی که روی جاده یا شانه آن بیرون از شهرها پارک شده، باید از چراغ‌های پارک استفاده شود. نور بالا رانندگان روبه‌رو را کور می‌کند و برای خودروی پارک‌شده مناسب نیست. خاموش گذاشتن همه چراغ‌ها خودرو را در تاریکی جاده نامرئی می‌کند. چراغ سقف داخل خودرو از بیرون دیده نمی‌شود و جایگزین چراغ پارک نیست.", "sg": null}, {"t": "special", "s": ["H6.4"], "q": ["What does Florida require to operate a moped on a public road?", "برای راندن موپد در جاده عمومی، فلوریدا چه چیزی الزامی می‌داند؟"], "o": [["Age 14 or older; no license is needed", "حداقل ۱۴ سال؛ گواهینامه لازم نیست"], ["Age 18 or older and a motorcycle endorsement", "حداقل ۱۸ سال و تأییدیه موتورسیکلت (endorsement)"], ["Age 21 or older and a commercial license", "حداقل ۲۱ سال و گواهینامه تجاری"], ["Age 16 or older and at least a Class E license; no motorcycle endorsement needed", "حداقل ۱۶ سال و دست‌کم گواهینامه کلاس E؛ تأییدیه موتورسیکلت لازم نیست"]], "a": 3, "x": "طبق کتابچه (بخش ۶.۴)، برای راندن موپد در جاده عمومی باید دست‌کم ۱۶ سال داشته باشید و حداقل گواهینامه کلاس E داشته باشید؛ تأییدیه موتورسیکلت لازم نیست. ۱۴ سال و بدون گواهینامه نادرست است. تأییدیه موتورسیکلت فقط برای موتورسیکلت لازم است، نه موپد. گواهینامه تجاری هم برای موپد لازم نیست.", "sg": null}, {"t": "special", "s": ["316.212"], "q": ["Under current Florida law, a person under 18 may drive a golf cart on a public road only if he or she:", "طبق قانون فعلی فلوریدا، فرد زیر ۱۸ سال فقط در چه صورتی می‌تواند در جاده عمومی گلف‌کارت براند؟"], "o": [["Is at least 14 years old; no license is needed", "دست‌کم ۱۴ سال داشته باشد؛ گواهینامه لازم نیست"], ["Holds a valid learner's license or driver license", "گواهینامه آموزشی (learner's license) یا گواهینامه رانندگی معتبر داشته باشد"], ["Holds a motorcycle endorsement", "تأییدیه موتورسیکلت داشته باشد"], ["Has a parent riding in the golf cart", "یکی از والدین در گلف‌کارت همراه او باشد"]], "a": 1, "x": "طبق بند 316.212 قوانین فلوریدا (اصلاح‌شده در سال ۲۰۲۳)، فرد زیر ۱۸ سال فقط با گواهینامه آموزشی یا گواهینامه رانندگی معتبر می‌تواند در جاده عمومی گلف‌کارت براند، و فرد ۱۸ سال به بالا باید کارت شناسایی عکس‌دار دولتی داشته باشد. قاعده قدیمی «حداقل ۱۴ سال» دیگر معتبر نیست. تأییدیه موتورسیکلت ربطی به گلف‌کارت ندارد و همراهی والدین جایگزین گواهینامه نمی‌شود.", "sg": null}, {"t": "safe", "s": ["316.228", "H7.7"], "q": ["A load extends 4 feet or more beyond the rear of your vehicle. In the daytime, it must be marked with:", "باری ۴ فوت یا بیشتر از عقب خودروی شما بیرون زده است. در روز باید با چه چیزی علامت‌گذاری شود؟"], "o": [["Red flags marking the ends of the load", "پرچم‌های قرمز در انتهای بار"], ["A white flag at least 6 inches square", "یک پرچم سفید دست‌کم ۶ در ۶ اینچ"], ["An orange slow-moving-vehicle triangle", "مثلث نارنجی خودروی کندرو"], ["Nothing, as long as your hazard lights are on", "هیچ؛ کافی است فلاشرها روشن باشد"]], "a": 0, "x": "طبق کتابچه (بخش ۷.۷) و بند (1)316.228، باری که ۴ فوت یا بیشتر از عقب خودرو بیرون زده باید در روز با پرچم‌های قرمز که انتهای بار را مشخص می‌کنند علامت‌گذاری شود و در شب با چراغ‌ها و بازتابنده‌های قرمز. پرچم سفید برای زنجیر یا طناب بکسل است، نه بار بیرون‌زده. مثلث نارنجی فقط برای خودروهای کندرو است. فلاشر جایگزین علامت‌گذاری الزامی بار نیست.", "sg": null}, {"t": "safe", "s": ["H7.5"], "q": ["When a chain, rope, or cable is used to tow another vehicle, Florida requires:", "وقتی برای بکسل کردن خودروی دیگر از زنجیر، طناب یا کابل استفاده می‌شود، فلوریدا چه چیزی را الزامی می‌داند؟"], "o": [["A red light on the chain at all times", "یک چراغ قرمز روی زنجیر در همه زمان‌ها"], ["An orange cone on the towed car's roof", "یک مخروط نارنجی روی سقف خودروی بکسل‌شده"], ["A white flag at least 12 inches square attached to it", "یک پرچم سفید دست‌کم ۱۲ در ۱۲ اینچ متصل به آن"], ["Nothing, if the connection is shorter than 30 feet", "اگر طول اتصال کمتر از ۳۰ فوت باشد، هیچ"]], "a": 2, "x": "کتابچه (بخش ۷.۵) می‌گوید اگر اتصال بکسل زنجیر، طناب یا کابل باشد، باید یک پرچم سفید دست‌کم ۱۲ در ۱۲ اینچ به آن وصل شود تا دیگران آن را ببینند. چراغ قرمز روی زنجیر یا مخروط روی سقف جزو الزامات نیست. همچنین کتابچه می‌گوید اتصال بکسل نباید بیش از ۱۵ فوت باشد (مگر برای بارهای غیرقابل‌تفکیک)، پس ۳۰ فوت نه‌تنها معافیت نمی‌آورد بلکه معمولاً غیرمجاز است.", "sg": null}, {"t": "dui", "s": ["H4.8"], "q": ["After an arrest for DUI, if you want to challenge the administrative suspension of your license, you must request a review hearing within:", "پس از بازداشت به اتهام DUI، اگر بخواهید به تعلیق اداری گواهینامه اعتراض کنید، باید درخواست جلسه بازبینی را ظرف چه مدت بدهید؟"], "o": [["3 days of your arrest", "۳ روز پس از بازداشت"], ["30 days of your arrest", "۳۰ روز پس از بازداشت"], ["90 days of your arrest", "۹۰ روز پس از بازداشت"], ["10 days (from the date the notice of suspension is issued, usually the arrest date)", "۱۰ روز (از تاریخ صدور اخطار تعلیق، معمولاً روز بازداشت)"]], "a": 3, "x": "طبق کتابچه (بخش ۴.۸)، اگر به دلیل سطح الکل خون/تنفس (BAL) برابر ۰.۰۸ یا بیشتر یا امتناع از آزمایش به‌طور اداری تعلیق شده‌اید، باید ظرف ۱۰ روز (طبق بند 322.2615، از تاریخ صدور اخطار تعلیق، که معمولاً همان روز بازداشت است) برای جلسه بازبینی رسمی یا غیررسمی درخواست دهید. ۳ روز کمتر از مهلت قانونی است. ۳۰ و ۹۰ روز خیلی دیر است و پس از ۱۰ روز حق درخواست جلسه از دست می‌رود.", "sg": null}, {"t": "crash", "s": ["H4.9"], "q": ["Under Florida's Financial Responsibility law (after a crash, not DUI-related), you may be required to show bodily-injury and property-damage liability of at least:", "طبق قانون مسئولیت مالی فلوریدا (پس از تصادف، غیر مرتبط با DUI)، ممکن است لازم باشد بیمه مسئولیت آسیب جسمی و خسارت مالی دست‌کم به چه میزان داشته باشید؟"], "o": [["$25,000 per person / $50,000 per crash / $25,000 property damage", "۲۵٬۰۰۰ دلار برای هر نفر / ۵۰٬۰۰۰ برای هر تصادف / ۲۵٬۰۰۰ خسارت مالی"], ["$10,000 per person / $20,000 for two or more persons / $10,000 property damage", "۱۰٬۰۰۰ دلار برای هر نفر / ۲۰٬۰۰۰ برای دو نفر یا بیشتر / ۱۰٬۰۰۰ خسارت مالی"], ["$100,000 per person / $300,000 for two or more persons / $50,000 property damage", "۱۰۰٬۰۰۰ دلار برای هر نفر / ۳۰۰٬۰۰۰ برای دو نفر یا بیشتر / ۵۰٬۰۰۰ خسارت مالی"], ["Only $10,000 of PIP", "فقط ۱۰٬۰۰۰ دلار PIP"]], "a": 1, "x": "کتابچه (بخش ۴.۹) می‌گوید طبق قانون مسئولیت مالی، در حالت عادی ۱۰٬۰۰۰ دلار مسئولیت آسیب جسمی برای یک نفر، ۲۰٬۰۰۰ دلار برای دو نفر یا بیشتر و ۱۰٬۰۰۰ دلار مسئولیت خسارت مالی لازم است. ارقام ۱۰۰٬۰۰۰/۳۰۰٬۰۰۰/۵۰٬۰۰۰ مخصوص پرونده‌های DUI است. ۲۵/۵۰/۲۵ حد فلوریدا نیست. PIP بیمه آسیب شخصی خودتان است و جای بیمه مسئولیت در برابر دیگران را نمی‌گیرد.", "sg": null}, {"t": "license", "s": ["H2.8"], "q": ["What vision meets Florida's standard for a driver license without referral to an eye specialist?", "کدام میزان بینایی بدون ارجاع به متخصص چشم، استاندارد فلوریدا برای گواهینامه را برآورده می‌کند؟"], "o": [["20/40 or better in each eye, with or without corrective lenses", "۲۰/۴۰ یا بهتر در هر چشم، با یا بدون عینک یا لنز"], ["20/70 in each eye", "۲۰/۷۰ در هر چشم"], ["20/100 in the better eye", "۲۰/۱۰۰ در چشم بهتر"], ["20/200 in each eye", "۲۰/۲۰۰ در هر چشم"]], "a": 0, "x": "طبق کتابچه (بخش ۲.۸)، بینایی ۲۰/۴۰ یا بهتر در هر چشم، با یا بدون عینک یا لنز، بدون ارجاع به متخصص چشم قابل قبول است. اگر یک چشم نابینا یا ۲۰/۲۰۰ و بدتر باشد، چشم دیگر باید ۲۰/۴۰ یا بهتر باشد. ۲۰/۷۰ فقط پس از ارجاع به متخصص چشم ممکن است پذیرفته شود، پس «بدون ارجاع» کافی نیست؛ ۲۰/۱۰۰ هم ضعیف‌تر از این حد است. ۲۰/۲۰۰ در هر دو چشم بسیار پایین‌تر از حد مجاز است.", "sg": null}, {"t": "special", "s": ["H6.2"], "q": ["When riding at night, a bicycle must have a front lamp with a white light visible from ___ and a rear red light visible from ___:", "هنگام دوچرخه‌سواری در شب، دوچرخه باید چراغ جلوی سفید قابل‌دیدن از ___ و چراغ قرمز عقب قابل‌دیدن از ___ داشته باشد:"], "o": [["100 feet / 200 feet", "۱۰۰ فوت / ۲۰۰ فوت"], ["1,000 feet / 1,000 feet", "۱۰۰۰ فوت / ۱۰۰۰ فوت"], ["500 feet / 600 feet", "۵۰۰ فوت / ۶۰۰ فوت"], ["Lights are optional if the bicycle has reflectors", "اگر دوچرخه بازتابنده دارد، چراغ اختیاری است"]], "a": 2, "x": "کتابچه (بخش ۶.۲) می‌گوید دوچرخه در شب باید چراغ جلو با نور سفید قابل‌دیدن از ۵ که بار پایین‌تر از لبه قسمت بار (دیواره اتاق بار) باشد"]], "a": 0, "x": "طبق کتابچه (بخش ۷.۶)، هنگام حمل بارهایی که ممکن است روی جاده بریزند یا با باد پخش شوند، مانند خاک، ماسه، سنگ آهک، شن، سیلیس و زباله، باید از پوشش محکم و مناسب استفاده کنید. بار نباید بتواند بیفتد، جابه‌جا شود یا نشت کند. پرچم قرمز برای باری است که از عقب بیرون زده، نه برای پوشاندن بار. محدودیت ۲۵ مایل در ساعت چنین قانونی نیست، و پایین بودن بار از لبه آن جایگزین پوشش نمی‌شود.", "sg": null}, {"t": "special", "s": ["H6.2"], "q": ["Florida requires bicycle riders and passengers of what age to wear a helmet that meets federal safety standards?", "فلوریدا دوچرخه‌سواران و سرنشینان دوچرخه در چه سنی را ملزم به پوشیدن کلاه ایمنی مطابق استانداردهای فدرال می‌کند؟"], "o": [["Under 12", "زیر ۱۲ سال"], ["Under 21", "زیر ۲۱ سال"], ["All ages", "همه سنین"], ["Under 16", "زیر ۱۶ سال"]], "a": 3, "x": "کتابچه (بخش ۶.۲) می‌گوید دوچرخه‌سواران و سرنشینان زیر ۱۶ سال باید کلاه ایمنی مطابق استانداردهای ایمنی فدرال بپوشند. زیر ۱۲ سال محدوده را کمتر از قانون نشان می‌دهد. زیر ۲۱ سال مربوط به قوانین الکل است، نه کلاه دوچرخه. قانون برای بزرگسالان ۱۶ سال به بالا کلاه را الزامی نکرده است، هرچند پوشیدن آن توصیه می‌شود.", "sg": null}, {"t": "safe", "s": ["H5.24"], "q": ["You notice you are driving in another vehicle's blind spot. You should:", "متوجه می‌شوید که در نقطه کور خودروی دیگری رانندگی می‌کنید. باید:"], "o": [["Stay there and match its speed", "همان‌جا بمانید و هم‌سرعت آن حرکت کنید"], ["Speed up or drop back so the other driver can see you", "سرعت را کم یا زیاد کنید تا راننده دیگر بتواند شما را ببیند"], ["Sound your horn until the driver sees you", "آن‌قدر بوق بزنید تا راننده شما را ببیند"], ["Turn on your high beams", "نور بالا را روشن کنید"]], "a": 1, "x": "کتابچه (بخش ۵.۲۴) می‌گوید در نقطه کور دیگران رانندگی نکنید و سرعت را زیاد یا کم کنید تا راننده دیگر شما را ببیند. نقاط کور نزدیک گوشه‌های عقب چپ و راست خودروست و در آینه دیده نمی‌شوند. هم‌سرعت ماندن در آنجا خطر برخورد هنگام تغییر خط را بالا می‌برد. بوق زدن مداوم و ن /* ---------- sign drawings (generic MUTCD-style shapes) ---------- */
function poly(n, r, cx, cy, rot){ const p=[]; for(let i=0;i<n;i++){const a=rot+i*2*Math.PI/n; p.push((cx+r*Math.cos(a)).toFixed(1)+","+(cy+r*Math.sin(a)).toFixed(1));} return p.join(" "); }
function txt(lines, y0, size, fill, gap){ return lines.map((l,i)=>`<text x="60" y="${y0+i*(gap||size*1.1)}" font-family="Overpass,Arial,sans-serif" font-weight="800" font-size="${size}" fill="${fill}" text-anchor="middle">${l}</text>`).join(""); }
function sign(s){
  if(!s) return "";

  else if(k==="diamond"){ const c=s.c==="orange"?"#F28C00":s.c==="fluoro"?"#C6E81A":"#F2B400"; b=`<polygon points="60,3 117,60 60,117 3,60" fill="${c}" stroke="#1a1a1a" stroke-width="3"/>`;
    if(s.sym==="curve") b+=`<path d="M48 88 L48 62 Q48 40 70 40 L70 32 L86 46 L70 60 L70 52 Q60 52 60 62 L60 88 Z" fill="#111"/>`;

    b=`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="6" fill="${s.bg}" stroke="${s.bg==="#fff"?"#1a1a1a":"#fff"}" stroke-width="3"/>`;
    if(lines.length){ const lh=size*1.25; const y0=60-((lines.length-1)*lh)/2+size*0.36; b+=txt(lines,y0,size,s.fg,lh); } }
  else if(k==="crossbuck"){ b=`<g transform="rotate(40 60 60)"><rect x="2" y="50" width="116" height="20" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="60" y="65" font-family="Overpass,Arial" font-weight="800" font-size="12" fill="#111" text-anchor="middle">RAILROAD</text></g><g transform="rotate(-40 60 60)"><rect x="2" y="50" width="116" height="20" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="60" y="65" font-family="Overpass,Arial" font-weight="800" font-size="12" fill="#111" text-anchor="middle">CROSSING</text></g>`; }

  else if(k==="hov"){ b=`<rect x="6" y="6" width="108" height="108" rx="6" fill="#fff" stroke="#1a1a1a" stroke-width="3"/><polygon points="60,16 92,60 60,104 28,60" fill="none" stroke="#111" stroke-width="7"/>`; }
  else if(k==="oneway"){ vb="0 0 140 70"; b=`<rect x="3" y="8" width="134" height="54" rx="4" fill="#111"/><polygon points="12,28 96,28 96,18 128,35 96,52 96,42 12,42" fill="#fff"/><text x="54" y="39.5" font-family="Overpass,Arial" font-weight="800" font-size="12" fill="#111" text-anchor="middle">ONE WAY</text>`; }

  return `<svg viewBox="${vb}" role="img" aria-label="Road sign illustration" xmlns="http://www.w3.org/2000/svg">${b}</svg>`;
}

function load(){ try{ const d=JSON.parse(localStorage.getItem(LS)||"null"); if(d){ S.englishOnly=!!d.englishOnly; S.history=d.history||{}; if(d.attempt && d.attempt.answers) S.attempt=d.attempt; } }catch(e){} }
function save(){ try{ localStorage.setItem(LS, JSON.stringify({englishOnly:S.englishOnly, history:S.history, attempt:S.attempt})); }catch(e){} }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function startTest(ti, shuffleQs){
  const qs = TESTS[ti].map((_,i)=>i);
  const order = shuffleQs ? shuffle(qs) : qs;
  S.attempt = { ti, order, perm: order.map(()=>shuffle([0,1,2,3])), answers: order.map(()=>null), cur:0, done:false };
  S.view="test"; save(); render(); scrollTop();
}
function scrollTop(){ try{ window.scrollTo({top:0}); }catch(e){ window.scrollTo(0,0); } }

/* ---------- views ---------- */
const app = document.getElementById("app");
function header(){
  const tab=(v,en)=>`<button data-go="${v}" aria-current="${S.view===v||(v==="home"&&S.view==="test")?"true":"false"}">${en}</button>`;
  return `<header class="sign-head${S.view==="test"?" compact":""}"><div class="route"><span class="shield">CLASS E</span><span class="shield">HILLSBOROUGH CO.</span></div>
  <h1>Florida Class E Practice</h1>
  <div class="sub">Six 50-question mock knowledge exams in English and Farsi, plus a Farsi study guide. Pass mark: 40 of 50.</div>
  <div class="sub fa">شش آزمون آزمایشی ۵۰ سؤالی به انگلیسی و فارسی، به‌همراه راهنمای مطالعه فارسی. حد قبولی: ۴۰ از ۵۰.</div>
  <nav class="tabs">${tab("home","Tests")}${tab("guide","Study guide · راهنمای مطالعه")}${tab("results","Last results")}${tab("sources","Sources")}${tab("about","Official vs practice")}</nav></header>`;
}

function homeView(){
  const a=S.attempt;
  const cards=TESTS.map((t,i)=>{
    const h=S.history[i]; const inprog = a && a.ti===i && !a.done;
    const cnt = inprog ? a.answers.filter(x=>x!==null).length : 0;
    return `<div class="panel test-card"><div class="eyebrow">Mock test</div><div class="big num">Test ${i+1}</div>
      <div class="meta">50 questions · ${new Set(t.map(q=>q.t)).size} topics</div>
      <div class="meta">${h?`Best score: <b class="num">${h.best}/50</b> · Last: <b class="num">${h.last}/50</b> ${h.last>=PASS?"(pass)":"(fail)"}`:"Not taken yet"}</div>
      ${inprog?`<div class="meta">In progress: <b class="num">${cnt}/50</b> answered</div>`:""}
      <div class="row">${inprog?`<button class="btn primary" data-resume>Resume</button><button class="btn ghost" data-start="${i}">Restart</button>`:`<button class="btn primary" data-start="${i}">Start test ${i+1}</button>`}</div></div>`;
  }).join("");
  return `<div class="stack">
  <div class="panel stack"><div class="eyebrow">The real exam · official facts (FLHSMV)</div>
    <div class="facts">
      <div class="fact"><b>50</b><span>multiple-choice questions</span></div>
      <div class="fact"><b>40</b><span>correct answers needed (80%)</span></div>
      <div class="fact"><b>EN</b><span>English only since Feb 6, 2026; no translators</span></div>
      <div class="fact"><b>&lt;18</b><span>only applicants under 18 may test online</span></div>
    </div>
    <div class="notice fa">از ۶ فوریه ۲۰۲۶ آزمون دانش و آزمون رانندگی در سراسر فلوریدا، از جمله دفاتر Tax Collector هیلزبورو، <b>فقط به زبان انگلیسی</b> برگزار می‌شود و دستگاه یا خدمات ترجمه مجاز نیست. از متن فارسی برای یادگیری استفاده کنید و قبل از آزمون واقعی، حالت «فقط انگلیسی» را امتحان کنید.</div>
    <label class="toggle" for="englishOnly"><input type="checkbox" id="englishOnly" ${S.englishOnly?"checked":""}><span><b>Exam simulation: English only.</b> Hides the Farsi text while you take the test. Farsi still appears in the review at the end.<br><span class="fa" style="display:block;color:var(--muted)">شبیه‌سازی آزمون واقعی: متن فارسی هنگام آزمون پنهان می‌شود ولی در مرور پایانی نمایش داده می‌شود.</span></span></label>
  </div>
  <div class="panel row" style="justify-content:space-between"><div><b>New: Farsi self-study guide</b><div class="fa" style="color:var(--muted)">راهنمای جامع مطالعه به فارسی: تابلوها، حق تقدم، سرعت، پارک، ترمز، چراغ‌ها، اتوبوس مدرسه، DUI، جدول اعداد و واژه‌نامه انگلیسی–فارسی.</div></div><button class="btn primary" data-go="guide">Open study guide</button></div>
  <h2>Choose a mock test <span class="fa" style="font-size:16px;color:var(--muted);font-weight:500">یک آزمون انتخاب کنید</span></h2>
  <div class="grid3">${cards}</div>
  <p class="lede">The six tests hold 300 different questions, 50 each, with no repeats between tests. Answer choices are shuffled every attempt. Correct answers stay hidden until you submit.</p>
  <div class="panel"><h3>Hillsborough County notes</h3>
  <ul style="margin:6px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px">
    <li>Knowledge exams are given at FLHSMV and Hillsborough County Tax Collector offices. Applicants under 18 may take the exam online through an approved provider with a parent proctoring form.</li>
    <li>Road tests are by appointment only and only for Hillsborough County residents, one attempt per day. Locations include Brandon (3030 N. Falkenburg Rd.), East Tampa (2814 E. Hillsborough Ave.) and Plant City (4706 Sydney Rd.).</li>
    <li>Teens must bring an adult (21+) to certify 50 hours of driving, 10 at night, or Form HSMV 71143.</li>
    <li>Tax Collector phone: <span class="num">813-635-5200</span>. Check hillstaxfl.gov before you go; locations and hours change.</li>
  </ul></div>
  </div>`;
}

function testView(){
  const a=S.attempt, ti=a.ti, qi=a.order[a.cur], q=TESTS[ti][qi], perm=a.perm[a.cur];
  const answered=a.answers.filter(x=>x!==null).length;
  const showFa=!S.englishOnly;
  const opts=perm.map((oi,pos)=>`<button class="opt" data-pick="${oi}" aria-pressed="${a.answers[a.cur]===oi}">
      <span class="letter">${LETTERS[pos]}</span><span><div class="t-en">${esc(q.o[oi][0])}</div>${showFa?`<div class="t-fa fa">${esc(q.o[oi][1])}</div>`:""}</span></button>`).join("");
  const dots=a.order.map((_,i)=>`<button class="dot ${a.answers[i]!==null?"done":""} ${i===a.cur?"cur":""}" data-jump="${i}" aria-label="Question ${i+1}">${i+1}</button>`).join("");
  return `<div class="progress"><div class="qhead"><span class="qnum">Test ${ti+1} · Question ${a.cur+1} of 50</span><span class="num" style="font-size:14px;color:var(--muted)">${answered}/50 answered</span></div><div class="bar"><i style="width:${answered*2}%"></i></div></div>
  <div class="panel">
    <div class="qhead"><span class="chip">${TOPICS[q.t][0]}${showFa?` · <span class="fa" style="display:inline">${TOPICS[q.t][1]}</span>`:""}</span></div>
    ${q.sg?`<div class="signbox">${sign(q.sg)}</div>`:""}
    <p class="q-en">${esc(q.q[0])}</p>
    ${showFa?`<p class="q-fa fa">${esc(q.q[1])}</p>`:""}
    <div class="opts">${opts}</div>
    <div class="navrow"><button class="btn ghost" data-prev ${a.cur===0?"disabled":""}>← Previous</button>
      ${a.cur<49?`<button class="btn primary" data-next>Next →</button>`:`<button class="btn warn" data-submit>Submit test</button>`}</div>
  </div>
  <div class="dots">${dots}</div>
  <div class="row" style="margin-top:14px;justify-content:space-between"><button class="btn ghost" data-home>Save & exit</button><button class="btn warn" data-submit>Submit test (${answered}/50)</button></div>
  <div id="confirm" class="confirm"></div>`;
}

function grade(a){
  let c=0; const wrong=[];
  a.order.forEach((qi,i)=>{ const q=TESTS[a.ti][qi]; if(a.answers[i]===q.a) c++; else wrong.push(i); });
  return {correct:c, wrong};
}

function srcLinks(q){
  return q.s.map(s=>{ if(/^https?:/.test(s)){ let h=s; try{ h=new URL(s).hostname.replace(/^www\./,""); }catch(e){} return `<a href="${s}" target="_blank" rel="noopener">${esc(h)}</a>`; }
    if(SOURCES[s]) return `<a href="${SOURCES[s].u}" target="_blank" rel="noopener">${esc(SOURCES[s].t)}</a>`;
    if(s[0]==="H") return `<a href="${handbookUrl(s)}" target="_blank" rel="noopener">Florida Driver Handbook §${s.slice(1)}</a>`;
    return `<a href="${statUrl(s)}" target="_blank" rel="noopener">Fla. Stat. §${s}</a>`; }).join(" · ");
}

function reviewCard(i, showAll){
  const a=S.attempt, qi=a.order[i], q=TESTS[a.ti][qi], perm=a.perm[i], pick=a.answers[i], ok=pick===q.a;
  const rows=perm.map((oi,pos)=>{ const cls = oi===q.a?"right":(oi===pick?"wrong":""); const tag = oi===q.a?`<span class="tag right">CORRECT · صحیح</span>`:(oi===pick?`<span class="tag wrong">YOUR ANSWER · پاسخ شما</span>`:"<span></span>");
    return `<div class="ro ${cls}"><span class="letter">${LETTERS[pos]}</span><span><div style="font-weight:600">${esc(q.o[oi][0])}</div><div class="fa" style="font-size:15px">${esc(q.o[oi][1])}</div></span>${tag}</div>`; }).join("");
  const pickPos = pick===null?-1:perm.indexOf(pick), rightPos=perm.indexOf(q.a);
  const why = pick===null
    ? `<span class="lbl fa">به این سؤال پاسخ ندادید و اشتباه حساب شد.</span>`
    : ok ? `<span class="lbl fa">پاسخ شما درست بود.</span>`
    : `<span class="lbl fa">پاسخ شما «${LETTERS[pickPos]}: ${esc(q.o[pick][1])}» نادرست است. پاسخ صحیح «${LETTERS[rightPos]}: ${esc(q.o[q.a][1])}» است.</span>`;
  return `<article class="miss"><div class="miss-h"><span class="num"><b>Question ${i+1}</b> · ${TOPICS[q.t][0]}</span><span>${ok?"✓ Correct":(pick===null?"Unanswered":"✗ Incorrect")}</span></div>
  <div class="miss-b">${q.sg?`<div class="signbox">${sign(q.sg)}</div>`:""}
    <div style="font-weight:700;font-size:17px">${esc(q.q[0])}</div><div class="fa" style="color:var(--muted)">${esc(q.q[1])}</div>
    ${rows}
    <div class="expl fa">${why}<b>توضیح:</b> ${esc(q.x)}</div>
    <div class="src">Practice question written for this site. Rule source: ${srcLinks(q)}</div></div></article>`;
}

let reviewAll=false;
function resultsView(){
  const a=S.attempt;
  if(!a || !a.done) return `<div class="panel"><h3>No finished test yet</h3><p class="lede">Submit a test to see your score, pass/fail result, and a Farsi explanation for every question you missed.</p><button class="btn primary" data-go="home">Go to tests</button></div>`;
  const g=grade(a), inc=50-g.correct, unans=a.answers.filter(x=>x===null).length, pass=g.correct>=PASS;
  const list=(reviewAll? a.order.map((_,i)=>i) : g.wrong).map(i=>reviewCard(i)).join("");
  return `<div class="stack"><div class="panel"><div class="scorebar"><div class="score">${g.correct}<small>/50</small></div>
    <div><span class="verdict ${pass?"pass":"fail"}">${pass?"PASS · قبول":"FAIL · مردود"}</span>
    <div class="counts"><span>Correct <b>${g.correct}</b></span><span>Incorrect <b>${inc}</b>${unans?` (incl. ${unans} unanswered)`:""}</span><span>Score <b>${g.correct*2}%</b></span></div>
    <div class="fa" style="margin-top:6px">${pass?`تبریک! با ${g.correct} پاسخ درست قبول شدید (حد قبولی ۴۰ است).`:`با ${inc} پاسخ نادرست مردود شدید؛ حداکثر ۱۰ اشتباه مجاز است. سؤالات زیر را مرور کنید.`}</div></div></div>
    <div class="row" style="margin-top:14px"><button class="btn primary" data-start="${a.ti}">Retake Test ${a.ti+1}</button>${a.ti<TESTS.length-1?`<button class="btn ghost" data-start="${a.ti+1}">Start Test ${a.ti+2}</button>`:""}<button class="btn ghost" data-toggleall>${reviewAll?"Show missed only":"Review all 50"}</button></div></div>
  <h2>${reviewAll?"All questions":"Questions you missed"} <span class="fa" style="font-size:16px;color:var(--muted);font-weight:500">${reviewAll?"همه سؤالات":"سؤالاتی که اشتباه پاسخ دادید"}</span></h2>
  ${list || `<div class="panel">No mistakes. Every answer was correct.</div>`}
  </div>`;
}

function sourcesView(){
  const items=Object.entries(SOURCES).map(([k,s])=>`<li><span class="kind ${s.kind}">${s.kind==="gov"?"Official state":s.kind==="county"?"Official county":"Secondary"}</span><b>${esc(s.t)}</b><br><a href="${s.u}" target="_blank" rel="noopener">${s.u}</a><div class="src" style="margin-top:4px">${esc(s.n)}</div></li>`).join("");
  const counts={}; TESTS.forEach((t,ti)=>t.forEach(q=>{counts[q.t]=counts[q.t]||TESTS.map(()=>0); counts[q.t][ti]++;}));
  const rows=Object.keys(TOPICS).map(k=>`<tr><td>${TOPICS[k][0]}<div class="fa" style="font-size:13px;color:var(--muted);text-align:left;direction:rtl">${TOPICS[k][1]}</div></td>${TESTS.map((_,i)=>`<td class="n">${counts[k]?counts[k][i]:0}</td>`).join("")}<td class="n"><b>${counts[k]?counts[k].reduce((x,y)=>x+y):0}</b></td></tr>`).join("");
  return `<div class="stack"><h2>Sources</h2><p class="lede">Every answer was checked against these pages. State statutes cited on individual questions link to the Florida Senate's 2025 statute text.</p>
  <ul class="srclist">${items}</ul>
  <h2>Topic coverage</h2><div class="panel tblwrap"><table class="cov"><thead><tr><th>Topic</th>${TESTS.map((_,i)=>`<th>T${i+1}</th>`).join("")}<th>Total</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}

function aboutView(){
  return `<div class="stack"><h2>Official material vs. practice questions</h2>
  <div class="panel stack">
   <div><h3>Official (from FLHSMV and Hillsborough County)</h3><p style="margin:0">The exam format (50 questions, 40 to pass, English only), and every rule, number and legal limit used in the answers. Each question links to the page or statute its answer comes from.</p></div>
   <div><h3>Practice (written for this site)</h3><p style="margin:0">All 300 questions, their wrong answer choices, the Farsi translations and the explanations. FLHSMV does not publish its real exam question bank, so no question here is copied from the actual test. The questions are modeled on the handbook topics the exam covers: traffic laws, signs and signals, right-of-way, speed, parking, alcohol and DUI, licensing, safe driving and emergencies.</p></div>
   <div class="fa notice">همه ۳۰۰ سؤال این برنامه «سؤالات تمرینی» هستند که برای این آزمون‌ها نوشته شده‌اند؛ FLHSMV بانک سؤالات آزمون واقعی را منتشر نمی‌کند. اما پاسخ هر سؤال از منابع رسمی (کتابچه رانندگی فلوریدا، صفحات FLHSMV و متن قوانین ایالتی) گرفته شده و پیوند منبع زیر هر سؤال در مرور پایانی آمده است.</div>
   <div><h3>Quality check</h3><p style="margin:0">On Sep 27, 2026 every question, answer, Farsi translation and explanation, and the study guide, were re-checked by independent reviewers against FLHSMV pages, the current Florida Statutes and the handbook text. Items that were wrong, outdated or ambiguous were corrected; where the handbook text and a newer statute disagree, the statute is followed.</p></div>
   <div><h3>Before your exam</h3><p style="margin:0">Laws change. Read the current Official Florida Driver License Handbook and check the FLHSMV and Hillsborough Tax Collector sites before your appointment. The road-sign pictures here are simplified drawings of standard U.S. sign shapes and colors.</p></div>
  </div></div>`;
}

function guideView(){
  const t=document.getElementById("guideTpl");
  return `<div class="row" style="margin-bottom:12px"><button class="btn ghost" data-go="home">← Back to tests</button></div>`+(t?t.innerHTML:"");
}
function render(){
  let body="";
  if(S.view==="guide"){ app.innerHTML=header()+guideView(); return; }
  if(S.view==="test" && S.attempt && !S.attempt.done) body=testView();
  else if(S.view==="results") body=resultsView();
  else if(S.view==="sources") body=sourcesView();
  else if(S.view==="about") body=aboutView();
  else { S.view="home"; body=homeView(); }
  app.innerHTML=header()+body;
}

function submit(force){
  const a=S.attempt; const un=a.answers.filter(x=>x===null).length;
  if(un && !force){ const c=document.getElementById("confirm");
    c.innerHTML=`<div class="notice"><b>${un} question${un>1?"s are":" is"} unanswered.</b> Unanswered questions count as wrong.<div class="fa">${un} سؤال بی‌پاسخ است و اشتباه حساب می‌شود.</div><div class="row" style="margin-top:10px"><button class="btn warn" data-forcesubmit>Submit anyway</button><button class="btn ghost" data-jump="${a.answers.indexOf(null)}">Go to first unanswered</button></div></div>`;
    c.scrollIntoView({behavior:"smooth",block:"center"}); return; }
  a.done=true; const g=grade(a); const h=S.history[a.ti]||{best:0,last:0,tries:0};
  S.history[a.ti]={best:Math.max(h.best,g.correct), last:g.correct, tries:(h.tries||0)+1};
  reviewAll=false; S.view="results"; save(); render(); scrollTop();
}

app.addEventListener("click",e=>{
  const t=e.target.closest("button"); if(!t) return;
  const a=S.attempt;
  if(t.dataset.go){ S.view=t.dataset.go; render(); scrollTop(); return; }
  if(t.dataset.start!==undefined){ startTest(+t.dataset.start, false); return; }
  if(t.hasAttribute("data-resume")){ S.view="test"; render(); scrollTop(); return; }
  if(t.hasAttribute("data-home")){ S.view="home"; save(); render(); scrollTop(); return; }
  if(t.hasAttribute("data-toggleall")){ reviewAll=!reviewAll; render(); return; }
  if(!a) return;
  if(t.dataset.pick!==undefined){ a.answers[a.cur]=+t.dataset.pick; save(); render(); return; }
  if(t.hasAttribute("data-next")){ a.cur=Math.min(49,a.cur+1); save(); render(); scrollTop(); return; }
  if(t.hasAttribute("data-prev")){ a.cur=Math.max(0,a.cur-1); save(); render(); scrollTop(); return; }
  if(t.dataset.jump!==undefined){ a.cur=+t.dataset.jump; S.view="test"; save(); render(); scrollTop(); return; }
  if(t.hasAttribute("data-submit")){ submit(false); return; }
  if(t.hasAttribute("data-forcesubmit")){ submit(true); return; }
});
app.addEventListener("change",e=>{ if(e.target.id==="englishOnly"){ S.englishOnly=e.target.checked; save(); } });
document.addEventListener("keydown",e=>{
  if(S.view!=="test"||!S.attempt||S.attempt.done) return; if(e.target.tagName==="INPUT") return;
  const k=e.key.toUpperCase(); const i=LETTERS.indexOf(k);
  if(i>=0){ S.attempt.answers[S.attempt.cur]=S.attempt.perm[S.attempt.cur][i]; save(); render(); }
  else if(e.key==="ArrowRight" && S.attempt.cur<49){ S.attempt.cur++; save(); render(); }
  else if(e.key==="ArrowLeft" && S.attempt.cur>0){ S.attempt.cur--; save(); render(); }
});
load(); if(S.attempt && S.attempt.done===false) S.view="home"; render();
</script>
</body>
</html>
