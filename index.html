nformation (guide signs)", "اطلاعات مسیر و مسافت (تابلوهای راهنما)"], ["Warnings about hazards", "هشدار درباره خطرات"], ["Motorist services", "خدمات راننده"], ["Parking regulations", "مقررات پارک"]], "a": 0, "x": "تابلوهای سبز «راهنما» هستند: نام شهرها، مسافت‌ها، خروجی‌های بزرگراه و جهت مسیر. هشدار خطر با لوزی زرد، خدمات راننده با تابلوی آبی و مقررات پارک با تابلوی مقرراتی سفید (معمولاً با نوشته قرمز یا سیاه) اعلام می‌شوند."}, {"t": "signs", "s": ["S2"], "sg": {"k": "noleft"}, "q": ["A red circle with a red slash through a symbol, like this one, means:", "دایره قرمز با خط مورب قرمز روی یک نماد، مانند این تابلو، به چه معناست؟"], "o": [["The action shown by the symbol is not allowed", "کاری که نماد نشان می‌دهد ممنوع است"], ["The action is allowed only at certain times", "آن کار فقط در ساعات خاصی مجاز است"], ["The action is dangerous but permitted", "آن کار خطرناک ولی مجاز است"], ["The road ahead is closed", "جاده جلو بسته است"]], "a": 0, "x": "دایره قرمز با خط مورب در همه تابلوها یعنی «ممنوع». این تابلو یعنی گردش به چپ ممنوع است. اگر ممنوعیت فقط در ساعات خاصی باشد، ساعت‌ها روی تابلوی کمکی زیر آن نوشته می‌شود. بسته بودن جاده با تابلوی جداگانه «ROAD CLOSED» اعلام می‌شود."}, {"t": "signs", "s": ["S2"], "sg": {"k": "dne"}, "q": ["What does this sign mean?", "این تابلو به چه معناست؟"], "o": [["Do not enter; you would be going against traffic", "وارد نشوید؛ در خلاف جهت ترافیک خواهید بود"], ["Road closed for construction", "جاده به دلیل کار عمرانی بسته است"], ["Stop, then enter when clear", "توقف کنید و وقتی راه باز شد وارد شوید"], ["One-way street ahead; enter slowly", "خیابان یک‌طرفه در پیش است؛ آرام وارد شوید"]], "a": 0, "x": "دایره قرمز با نوار افقی سفید روی زمینه مربع سفید و نوشته DO NOT ENTER یعنی «ورود ممنوع»: اگر وارد شوید، خلاف جهت ترافیک حرکت خواهید کرد (معمولاً در ابتدای خیابان یک‌طرفه یا رمپ خروجی بزرگراه). این تابلو به معنای توقف و سپس ورود نیست. تابلوی جاده بسته شکل متفاوتی دارد."}, {"t": "signs", "s": ["S2"], "sg": {"k": "rect", "bg": "#C1121F", "fg": "#fff", "lines": ["WRONG", "WAY"], "wide": true}, "q": ["If you see a red ‘WRONG WAY’ sign facing you, you should:", "اگر تابلوی قرمز «WRONG WAY» (مسیر اشتباه) را روبه‌روی خود ببینید، چه باید بکنید؟"], "o": [["Pull over safely and turn around; you are driving against traffic", "با احتیاط کنار بکشید و دور بزنید؛ در خلاف جهت ترافیک هستید"], ["Keep going to the next exit", "تا خروجی بعدی ادامه دهید"], ["Turn on your hazard lights and continue slowly", "فلاشر را روشن کنید و آرام ادامه دهید"], ["Move to the left lane", "به خط چپ بروید"]], "a": 0, "x": "تابلوی WRONG WAY یعنی شما در خلاف جهت ترافیک هستید، معمولاً پس از ورود اشتباه به رمپ خروجی بزرگراه. ادامه دادن حتی آرام، خطر تصادف رودررو را دارد. فوراً و با احتیاط به کنار بروید و وقتی امن شد دور بزنید. رفتن به خط چپ شما را مستقیم در مسیر خودروهای روبه‌رو قرار می‌دهد."}, {"t": "signs", "s": ["S2"], "sg": null, "q": ["Most warning signs are what shape?", "بیشتر تابلوهای هشدار چه شکلی دارند؟"], "o": [["Diamond", "لوزی"], ["Octagon", "هشت‌ضلعی"], ["Rectangle", "مستطیل"], ["Circle", "دایره"]], "a": 0, "x": "بیشتر تابلوهای هشدار «لوزی» شکل‌اند (زرد یا در منطقه کار، نارنجی). هشت‌ضلعی فقط برای ایست، مستطیل برای تابلوهای مقرراتی و راهنما، و دایره فقط برای پیش‌آگاهی راه‌آهن استفاده می‌شود. شناختن شکل تابلو به شما کمک می‌کند حتی از دور یا وقتی نوشته دیده نمی‌شود، معنای آن را بفهمید."}, {"t": "signs", "s": ["S2"], "sg": {"k": "diamond", "c": "yellow", "sym": "curve"}, "q": ["This yellow sign with a curved arrow means:", "این تابلوی زرد با فلش خمیده به چه معناست؟"], "o": [["The road curves ahead; slow down", "جاده در پیش رو پیچ دارد؛ سرعت را کم کنید"], ["Turn right at the next intersection", "در تقاطع بعدی به راست بپیچید"], ["The right lane must turn", "خط راست باید بپیچد"], ["A U-turn is permitted ahead", "در ادامه دور زدن مجاز است"]], "a": 0, "x": "لوزی زرد با فلش خمیده هشدار «پیچ جاده» است: قبل از پیچ سرعت را کم کنید (اغلب یک تابلوی سرعت توصیه‌ای زیر آن نصب می‌شود). این تابلو دستور گردش نیست. دستورهای گردش اجباری روی تابلوهای مقرراتی سفید نوشته می‌شوند. دور زدن با تابلوی جداگانه اعلام می‌شود."}, {"t": "signs", "s": ["S2", "316.183"], "sg": null, "q": ["A posted speed limit sign shows:", "تابلوی حداکثر سرعت نشان‌دهنده چیست؟"], "o": [["The maximum legal speed under ideal conditions", "حداکثر سرعت قانونی در شرایط ایده‌آل"], ["The speed you must drive regardless of conditions", "سرعتی که بدون توجه به شرایط باید با آن برانید"], ["The average speed of traffic", "میانگین سرعت ترافیک"], ["A suggested speed you may exceed by 5 mph", "سرعت پیشنهادی که می‌توانید ۵ مایل در ساعت از آن بیشتر برانید"]], "a": 0, "x": "عدد روی تابلو حداکثر سرعت قانونی در شرایط «ایده‌آل» (هوای خوب، ترافیک کم، دید کامل) است. اگر هوا بارانی یا ترافیک سنگین باشد، قانون فلوریدا شما را موظف می‌کند آهسته‌تر برانید. هیچ «حاشیه مجاز» ۵ مایل در ساعتی در قانون وجود ندارد و تابلو میانگین سرعت دیگران را هم نشان نمی‌دهد."}, {"t": "signs", "s": ["S2", "316.2225"], "sg": {"k": "smv"}, "q": ["An orange triangle with a red border on the back of a vehicle, like this one, means the vehicle:", "مثلث نارنجی با حاشیه قرمز در پشت یک وسیله نقلیه، مانند این، به چه معناست؟"], "o": [["Is a slow-moving vehicle, usually traveling less than 25 mph", "وسیله نقلیه کندرو است و معمولاً کمتر از ۲۵ مایل در ساعت حرکت می‌کند"], ["Carries hazardous materials", "مواد خطرناک حمل می‌کند"], ["Is an emergency vehicle", "خودروی امدادی است"], ["Is driven by a student driver", "راننده آن هنرجوی رانندگی است"]], "a": 0, "x": "این علامت «وسیله نقلیه کندرو» (SMV) است و روی تراکتور، ماشین‌آلات کشاورزی و ارابه‌ها نصب می‌شود که معمولاً کمتر از ۲۵ مایل در ساعت حرکت می‌کنند. وقتی آن را می‌بینید، زود سرعت را کم کنید چون خیلی سریع به آن می‌رسید. مواد خطرناک با پلاک لوزی شکل مخصوص (HazMat) مشخص می‌شوند و خودروهای امدادی چراغ و آژیر دارند."}, {"t": "signals", "s": ["S2", "316.075"], "sg": null, "q": ["A steady (not flashing) yellow light means:", "چراغ زرد «ثابت» (غیر چشمک‌زن) به چه معناست؟"], "o": [["The light is about to turn red; stop if you can do so safely", "چراغ به‌زودی قرمز می‌شود؛ اگر می‌توانید با خیال راحت بایستید، توقف کنید"], ["Speed up to beat the red light", "سرعت را زیاد کنید تا قبل از قرمز شدن رد شوید"], ["Proceed with caution; it will stay yellow", "با احتیاط عبور کنید؛ زرد باقی می‌ماند"], ["Yield to traffic from the right", "به ترافیک سمت راست حق تقدم بدهید"]], "a": 0, "x": "زرد ثابت هشدار می‌دهد که چراغ به‌زودی قرمز می‌شود. اگر بتوانید با ایمنی توقف کنید باید بایستید؛ اگر آن‌قدر نزدیک هستید که توقف ناامن است، با احتیاط از تقاطع رد شوید. افزایش سرعت برای «رسیدن» خطرناک است. «احتیاط و عبور» معنای زرد «چشمک‌زن» است."}, {"t": "signals", "s": ["S2", "316.075"], "sg": null, "q": ["A green arrow pointing left means:", "فلش سبز رو به چپ به چه معناست؟"], "o": [["You may turn left; oncoming traffic is stopped (a protected turn)", "می‌توانید به چپ بپیچید؛ ترافیک روبه‌رو متوقف است (گردش حمایت‌شده)"], ["The protected turn is ending; stop if you can", "گردش حمایت‌شده در حال پایان است؛ اگر می‌توانید بایستید"], ["Turn only after yielding to oncoming traffic, which also has a green light", "فقط پس از دادن حق تقدم به ترافیک روبه‌رو که آن هم سبز است، بپیچید"], ["Go straight only", "فقط مستقیم بروید"]], "a": 0, "x": "فلش سبز یعنی گردش «حمایت‌شده»: ترافیک مخالف چراغ قرمز دارد، پس می‌توانید در جهت فلش بپیچید (همچنان مراقب عابران و خودروهایی باشید که هنوز داخل تقاطع‌اند). «در حال پایان» معنای فلش «زرد» ثابت است. دادن حق تقدم به ترافیک روبه‌رو مربوط به چراغ سبز معمولی یا فلش زرد چشمک‌زن است."}, {"t": "signals", "s": ["S2", "316.075"], "sg": null, "q": ["In Florida, you may turn RIGHT on a red light:", "در فلوریدا، چه زمانی می‌توانید با چراغ قرمز به «راست» بپیچید؟"], "o": [["After a complete stop and yielding, unless a sign prohibits it", "پس از توقف کامل و دادن حق تقدم، مگر اینکه تابلویی آن را ممنوع کرده باشد"], ["Without stopping, if no one is coming", "بدون توقف، اگر کسی نمی‌آید"], ["Never", "هرگز"], ["Only when a green arrow is shown", "فقط وقتی فلش سبز روشن است"]], "a": 0, "x": "در فلوریدا گردش به راست با چراغ قرمز مجاز است به شرط «توقف کامل» و دادن حق تقدم به عابران و ترافیک، مگر تابلوی «NO TURN ON RED» نصب شده باشد. پیچیدن بدون توقف کامل تخلف است. «هرگز» درست نیست و منتظر فلش سبز ماندن هم الزامی نیست."}, {"t": "signals", "s": ["S2"], "sg": null, "q": ["Two solid yellow center lines mean:", "دو خط زرد ممتد در وسط جاده به چه معناست؟"], "o": [["No passing in either direction", "سبقت برای ترافیک هر دو جهت ممنوع است"], ["Passing is allowed from either side when clear", "در صورت خالی بودن، سبقت از هر دو طرف مجاز است"], ["A reversible lane", "خط برگشت‌پذیر"], ["A center left-turn lane", "خط گردش به چپ وسط جاده"]], "a": 0, "x": "دو خط زرد ممتد یعنی سبقت برای ترافیک «هر دو جهت» ممنوع است و نباید از روی آن‌ها عبور کنید (به‌جز برای گردش به چپ به داخل ورودی یا کوچه در صورت امن بودن). خط برگشت‌پذیر با دو خط زرد «منقطع» مشخص می‌شود و خط گردش به چپ وسط، ترکیبی از خط ممتد و منقطع با فلش گردش دارد."}, {"t": "signals", "s": ["H9.6"], "sg": null, "q": ["A center lane marked on both sides with a solid yellow line and a broken yellow line, with left-turn arrows, may be used:", "لاین (خط عبور) وسط جاده که در هر دو طرف با یک خط زرد ممتد و یک خط زرد منقطع و فلش‌های گردش به چپ مشخص شده، برای چه استفاده می‌شود؟"], "o": [["Only to begin or finish left turns, by traffic from both directions", "فقط برای شروع یا پایان گردش به چپ، توسط ترافیک هر دو جهت"], ["For passing slower traffic", "برای سبقت از خودروهای کندتر"], ["As a regular travel lane during rush hour", "به‌عنوان خط عبور معمولی در ساعت اوج ترافیک"], ["Only by emergency vehicles", "فقط توسط خودروهای امدادی"]], "a": 0, "x": "این «خط گردش به چپ دوطرفه» است و خودروهای هر دو جهت فقط برای آماده شدن برای گردش به چپ (یا هنگام ورود از یک ورودی) از آن استفاده می‌کنند. طبق کتابچه، این خط فقط برای کم کردن سرعت و انتظار خودروهای در حال گردش است و سبقت در آن ممنوع است؛ رانندگی طولانی در آن هم خطرناک است، چون ممکن است خودرویی از جهت مخالف وارد آن شود."}, {"t": "row", "s": ["S2", "316.121"], "sg": null, "q": ["At an intersection with no signs or signals, you must yield to:", "در تقاطعی بدون تابلو یا چراغ راهنمایی، به چه کسی باید حق تقدم بدهید؟"], "o": [["Vehicles already in the intersection and vehicles arriving at the same time from your right", "خودروهایی که داخل تقاطع‌اند و خودروهایی که هم‌زمان از سمت راست می‌رسند"], ["Only vehicles on your left", "فقط خودروهای سمت چپ"], ["No one; the first to reach the center goes first", "هیچ‌کس؛ هر که زودتر به وسط برسد اول است"], ["Only larger vehicles", "فقط خودروهای بزرگ‌تر"]], "a": 0, "x": "در تقاطع بدون کنترل، به خودروهایی که «از قبل» داخل تقاطع هستند راه بدهید؛ و اگر هم‌زمان با خودرویی می‌رسید، راننده سمت چپ به راننده «سمت راست» حق تقدم می‌دهد. مسابقه برای رسیدن به وسط تقاطع علت رایج تصادف است و اندازه خودرو حق تقدم ایجاد نمی‌کند."}, {"t": "row", "s": ["S2"], "sg": null, "q": ["Your light is green, but traffic ahead is backed up across the intersection. You should:", "چراغ شما سبز است، اما ترافیک جلویی تا داخل تقاطع صف کشیده است. چه باید بکنید؟"], "o": [["Wait before the intersection until there is room to get all the way through", "قبل از تقاطع صبر کنید تا جای کافی برای عبور کامل باز شود"], ["Enter the intersection because you have a green light", "وارد تقاطع شوید چون چراغ شما سبز است"], ["Go around the stopped traffic using the turn lane", "با استفاده از خط گردش، از کنار ترافیک متوقف رد شوید"], ["Honk until traffic moves", "بوق بزنید تا ترافیک حرکت کند"]], "a": 0, "x": "حتی با چراغ سبز، اگر نمی‌توانید کامل از تقاطع عبور کنید، نباید وارد آن شوید؛ در غیر این صورت وقتی چراغ عوض شود، تقاطع را برای ترافیک عرضی و عابران مسدود می‌کنید. استفاده از خط گردش برای دور زدن صف غیرقانونی است و بوق زدن هم مشکلی را حل نمی‌کند."}, {"t": "row", "s": ["S2", "316.130"], "sg": null, "q": ["A pedestrian is crossing in a crosswalk (marked or unmarked) at an intersection with no signal. You must:", "عابری در تقاطع بدون چراغ، روی خط عابر (خط‌کشی‌شده یا بدون خط‌کشی) در حال عبور است. چه باید بکنید؟"], "o": [["Yield to the pedestrian, slowing down or stopping as needed", "به عابر حق تقدم بدهید و در صورت لزوم سرعت را کم کنید یا توقف کنید"], ["Keep going; pedestrians must yield to cars", "ادامه دهید؛ عابران باید به خودروها راه بدهند"], ["Yield only if the crosswalk is painted", "فقط اگر خط عابر رنگ‌آمیزی شده باشد راه بدهید"], ["Honk and continue slowly", "بوق بزنید و آرام ادامه دهید"]], "a": 0, "x": "در تقاطع‌هایی که پیاده‌رو دارند، امتداد پیاده‌رو در عرض خیابان یک خط عابر «بدون خط‌کشی» محسوب می‌شود. طبق بند 316.130، وقتی چراغی وجود ندارد و عابر در خط عابر (با یا بدون خط‌کشی) است، باید با کم کردن سرعت یا در صورت لزوم توقف، به او حق تقدم بدهید. ادامه دادن، محدود کردن این قانون به خط عابر رنگ‌شده، یا بوق زدن و عبور آرام کنار عابر همگی نادرست‌اند."}, {"t": "row", "s": ["S2"], "sg": null, "q": ["When entering an expressway from an on-ramp, you should:", "هنگام ورود به بزرگراه از رمپ ورودی، چه باید بکنید؟"], "o": [["Use the acceleration lane to reach traffic speed and yield to vehicles already on the expressway", "از خط شتاب‌گیری برای رسیدن به سرعت ترافیک استفاده کنید و به خودروهای داخل بزرگراه حق تقدم بدهید"], ["Stop at the end of the ramp and wait for a large gap", "در انتهای رمپ بایستید و منتظر فاصله بزرگ بمانید"], ["Enter slowly; expressway traffic must let you in", "آهسته وارد شوید؛ ترافیک بزرگراه باید به شما راه بدهد"], ["Move directly to the far-left lane", "مستقیم به چپ‌ترین خط بروید"]], "a": 0, "x": "در رمپ ورودی و خط شتاب‌گیری، سرعت خود را به سرعت ترافیک بزرگراه نزدیک کنید، راهنما بزنید و در یک فاصله مناسب وارد شوید؛ خودروهای داخل بزرگراه حق تقدم دارند. توقف در انتهای رمپ (مگر در ضرورت) خطرناک است چون با سرعت کم نمی‌توانید با امنیت وارد شوید. عبور همزمان از چند خط هم خطرناک است."}, {"t": "row", "s": ["S2", "316.083"], "sg": null, "q": ["When another vehicle is passing you on a two-lane road, you should:", "وقتی خودروی دیگری در جاده دوخطه از شما سبقت می‌گیرد، چه باید بکنید؟"], "o": [["Stay in your lane and do not speed up", "در خط خود بمانید و سرعت را افزایش ندهید"], ["Speed up so the pass is shorter", "سرعت را زیاد کنید تا سبقت کوتاه‌تر شود"], ["Move left to block them", "به چپ بروید تا جلوی او را بگیرید"], ["Brake hard", "ترمز شدید بگیرید"]], "a": 0, "x": "قانون فلوریدا (بند 316.083) می‌گوید راننده‌ای که از او سبقت گرفته می‌شود باید به سمت راست راه بدهد و تا پایان سبقت سرعت خود را افزایش ندهد. افزایش سرعت، راننده سبقت‌گیرنده را در خط مقابل گیر می‌اندازد. بستن راه یا ترمز شدید هم باعث تصادف می‌شود. در صورت لزوم می‌توانید کمی از سرعت خود بکاهید تا سبقت ساده‌تر شود."}, {"t": "row", "s": ["316.2025"], "sg": null, "q": ["Unless you are on official business, you may not follow a fire truck that is responding to an alarm closer than:", "اگر مأموریت رسمی ندارید، نباید از چه فاصله‌ای نزدیک‌تر پشت ماشین آتش‌نشانی که در حال پاسخ به حادثه است حرکت کنید؟"], "o": [["100 feet", "۱۰۰ فوت"], ["250 feet", "۲۵۰ فوت"], ["500 feet", "۵۰۰ فوت"], ["1,000 feet", "۱۰۰۰ فوت"]], "a": 2, "x": "بند 316.2025 قانون فلوریدا: دنبال کردن ماشین آتش‌نشانی که در حال پاسخ به اعلام حریق است در فاصله کمتر از ۵۰۰ فوت ممنوع است؛ همچنین رانندگی به داخل یا پارک کردن در همان بلوکی (block) که ماشین آتش‌نشانی در آن توقف کرده، ممنوع است. ماشین آتش‌نشانی ممکن است ناگهان بایستد یا آتش‌نشانان پیاده شوند. ۱۰۰ و ۲۵۰ فوت کمتر از حد قانون و ۱۰۰۰ فوت عدد قانون نیست."}, {"t": "row", "s": ["316.121", "H5.16"], "sg": null, "q": ["At an intersection with no signs or signals, you are about to enter a state-maintained highway from a side road. You must:", "در تقاطعی بدون تابلو یا چراغ، از یک جاده فرعی در حال ورود به بزرگراهی هستید که ایالت آن را نگهداری می‌کند. چه باید بکنید؟"], "o": [["Go first if you are on the right", "اگر در سمت راست هستید، اول بروید"], ["Yield the right-of-way to all vehicles approaching on the state highway", "به همه خودروهایی که در بزرگراه ایالتی نزدیک می‌شوند حق تقدم بدهید"], ["Yield only to trucks", "فقط به کامیون‌ها راه بدهید"], ["Honk and enter", "بوق بزنید و وارد شوید"]], "a": 1, "x": "بند 316.121(3): راننده‌ای که از جاده آسفالته یا آسفالت‌نشده، بدون تابلو یا چراغ، وارد جاده یا بزرگراه ایالتی می‌شود یا از آن عبور می‌کند، باید به همه خودروهایی که در جاده ایالتی نزدیک می‌شوند حق تقدم بدهد؛ کتابچه (بخش تقاطع‌های باز) هم همین را می‌گوید. قاعده «سمت راست» فقط برای ورود هم‌زمان به تقاطع برابر است، نه ورود از جاده فرعی. نوع خودرو اهمیتی ندارد و بوق زدن حق تقدم ایجاد نمی‌کند."}, {"t": "speed", "s": ["S2", "S11"], "sg": null, "q": ["Unless otherwise posted, the maximum speed on Florida roads and highways that are not otherwise listed (not business/residential areas, not interstates) is:", "اگر تابلویی نصب نشده باشد، حداکثر سرعت در جاده‌های فلوریدا که در دسته دیگری نیستند (نه منطقه مسکونی/تجاری و نه بین‌ایالتی) چقدر است؟"], "o": [["45 mph", "۴۵ مایل در ساعت"], ["50 mph", "۵۰ مایل در ساعت"], ["55 mph", "۵۵ مایل در ساعت"], ["65 mph", "۶۵ مایل در ساعت"]], "a": 2, "x": "طبق جدول کتابچه و بند 316.183، سرعت پیش‌فرض «سایر جاده‌ها و بزرگراه‌ها» ۵۵ مایل در ساعت است. مناطق مسکونی/تجاری ۳۰، بین‌ایالتی روستایی و بزرگراه با دسترسی محدود ۷۰ و مناطق مدرسه ۲۰ هستند. ۴۵، ۵۰ و ۶۵ پیش‌فرض قانونی نیستند (هرچند ممکن است با تابلو تعیین شوند)."}, {"t": "speed", "s": ["S11"], "sg": null, "q": ["On an interstate highway with four or more lanes and a posted limit BELOW 70 mph (for example, 65 mph), the minimum speed is:", "در بزرگراه بین‌ایالتی با چهار خط یا بیشتر و حداکثر سرعت «کمتر از» ۷۰ مایل در ساعت (مثلاً ۶۵)، حداقل سرعت چقدر است؟"], "o": [["35 mph", "۳۵ مایل در ساعت"], ["40 mph", "۴۰ مایل در ساعت"], ["45 mph", "۴۵ مایل در ساعت"], ["50 mph", "۵۰ مایل در ساعت"]], "a": 1, "x": "بند 316.183: حداقل سرعت در بزرگراه‌های بین‌ایالتی با چهار خط یا بیشتر ۴۰ مایل در ساعت است. فقط وقتی حداکثر سرعت ۷۰ باشد، حداقل به ۵۰ افزایش می‌یابد؛ پس برای حداکثر ۶۵، حداقل ۴۰ است. ۳۵ و ۴۵ در قانون نیستند."}, {"t": "speed", "s": ["318.18"], "sg": null, "q": ["Speeding fines in a construction zone when workers are present are:", "جریمه سرعت غیرمجاز در منطقه کار عمرانی، وقتی کارگران حضور دارند، چگونه است؟"], "o": [["Doubled", "دو برابر"], ["The same as normal", "مانند حالت عادی"], ["Tripled", "سه برابر"], ["Replaced by a warning", "جای خود را به یک اخطار می‌دهد"]], "a": 0, "x": "طبق بند 318.18، جریمه سرعت در منطقه کار عمرانیِ دارای تابلو، وقتی کارکنان حضور دارند یا با تجهیزات روی جاده یا کنار آن کار می‌کنند، دو برابر می‌شود. هدف، حفاظت از کارگرانی است که در فاصله چند متری ترافیک کار می‌کنند. سه برابر یا اخطار در قانون نیست."}, {"t": "speed", "s": ["S11", "316.183"], "sg": null, "q": ["The posted limit is 45 mph, but it is raining hard and visibility is poor. You should:", "حداکثر سرعت ۴۵ مایل در ساعت است، اما باران شدید می‌بارد و دید ضعیف است. چه باید بکنید؟"], "o": [["Drive slower than 45 mph, at a speed that is safe for the conditions", "آهسته‌تر از ۴۵ مایل در ساعت، با سرعتی که برای شرایط ایمن است، برانید"], ["Drive exactly 45 mph", "دقیقاً با ۴۵ مایل در ساعت برانید"], ["Drive faster to get out of the rain sooner", "سریع‌تر برانید تا زودتر از باران خارج شوید"], ["Drive 45 mph with your hazard lights on", "با ۴۵ مایل در ساعت و فلاشر روشن برانید"]], "a": 0, "x": "«قانون سرعت پایه» (بند 316.183 بند ۱) می‌گوید هیچ‌کس نباید سریع‌تر از سرعتی براند که با توجه به شرایط واقعی و خطرات موجود، معقول و ایمن است. پس در باران شدید باید کمتر از حد مجاز برانید و ممکن است حتی با ۴۵ مایل در ساعت جریمه شوید. روشن کردن فلاشر هنگام حرکت، سرعت ناایمن را ایمن نمی‌کند."}, {"t": "parking", "s": ["S12"], "sg": null, "q": ["You may not park within how many feet of a crosswalk at an intersection?", "در چه فاصله‌ای از خط عابر پیاده در تقاطع، پارک کردن ممنوع است؟"], "o": [["10 feet", "۱۰ فوت"], ["15 feet", "۱۵ فوت"], ["20 feet", "۲۰ فوت"], ["50 feet", "۵۰ فوت"]], "a": 2, "x": "بند 316.1945: پارک در فاصله ۲۰ فوتی خط عابر پیاده در تقاطع ممنوع است تا عابران و رانندگان یکدیگر را ببینند. ۱۵ فوت مربوط به شیر آتش‌نشانی و ۵۰ فوت مربوط به نزدیک‌ترین ریل تقاطع راه‌آهن است. ۱۰ فوت در این قانون وجود ندارد."}, {"t": "parking", "s": ["S12"], "sg": null, "q": ["You may not park within how many feet of a stop sign, flashing signal, or traffic light located at the side of the road?", "در چه فاصله‌ای قبل از تابلوی ایست، چراغ چشمک‌زن یا چراغ راهنمایی کنار جاده، پارک کردن ممنوع است؟"], "o": [["15 feet", "۱۵ فوت"], ["20 feet", "۲۰ فوت"], ["30 feet", "۳۰ فوت"], ["50 feet", "۵۰ فوت"]], "a": 2, "x": "بند 316.1945: پارک در ۳۰ فوتیِ مسیر رسیدن به تابلوی ایست، چراغ چشمک‌زن یا چراغ راهنمایی کنار جاده ممنوع است تا خودروی پارک‌شده تابلو یا چراغ را از دید رانندگان نپوشاند. ۱۵ فوت برای شیر آتش‌نشانی، ۲۰ فوت برای خط عابر و ۵۰ فوت برای راه‌آهن است."}, {"t": "parking", "s": ["S12"], "sg": null, "q": ["You may not park within how many feet of the nearest rail of a railroad crossing?", "در چه فاصله‌ای از نزدیک‌ترین ریل تقاطع راه‌آهن، پارک کردن ممنوع است؟"], "o": [["15 feet", "۱۵ فوت"], ["30 feet", "۳۰ فوت"], ["50 feet", "۵۰ فوت"], ["100 feet", "۱۰۰ فوت"]], "a": 2, "x": "بند 316.1945: پارک در ۵۰ فوتی نزدیک‌ترین ریل ممنوع است (مگر وزارت راه فاصله دیگری تعیین کرده باشد). عدد ۱۵ را با «حداقل فاصله توقف» از ریل وقتی قطار می‌آید اشتباه نگیرید (باید بین ۱۵ تا ۵۰ فوت از ریل توقف کنید). ۳۰ فوت مربوط به تابلوی ایست و چراغ است."}, {"t": "dui", "s": ["S7"], "sg": null, "q": ["For a FIRST DUI conviction (BAC under 0.15 and no minor in the vehicle), the fine is:", "برای «اولین» محکومیت DUI (الکل خون کمتر از ۰.۱۵ و بدون کودک در خودرو)، جریمه نقدی چقدر است؟"], "o": [["$250 to $500", "۲۵۰ تا ۵۰۰ دلار"], ["$500 to $1,000", "۵۰۰ تا ۱۰۰۰ دلار"], ["$1,000 to $2,000", "۱۰۰۰ تا ۲۰۰۰ دلار"], ["$2,000 to $5,000", "۲۰۰۰ تا ۵۰۰۰ دلار"]], "a": 1, "x": "طبق جدول رسمی FLHSMV (بند 316.193)، جریمه اولین محکومیت DUI بین ۵۰۰ تا ۱۰۰۰ دلار است. اگر الکل خون ۰.۱۵ یا بیشتر باشد یا کودکی در خودرو باشد، جریمه به ۱۰۰۰ تا ۲۰۰۰ دلار می‌رسد. ۲۰۰۰ تا ۵۰۰۰ دلار برای محکومیت سوم (بیش از ۱۰ سال پس از دومی) است. علاوه بر جریمه، ۵۰ ساعت خدمات اجتماعی، دوره مشروط و لغو گواهینامه هم وجود دارد."}, {"t": "dui", "s": ["S7", "322.28"], "sg": null, "q": ["For a first DUI conviction without bodily injury, the minimum license revocation is:", "برای اولین محکومیت DUI بدون آسیب جسمی به دیگران، حداقل مدت لغو گواهینامه چقدر است؟"], "o": [["30 days", "۳۰ روز"], ["90 days", "۹۰ روز"], ["180 days", "۱۸۰ روز"], ["5 years", "۵ سال"]], "a": 2, "x": "طبق صفحه رسمی FLHSMV: اولین محکومیت بدون آسیب جسمی = حداقل ۱۸۰ روز و حداکثر ۱ سال لغو گواهینامه. با آسیب جسمی جدی (Serious Bodily Injury)، حداقل ۳ سال. محکومیت دوم در کمتر از ۵ سال = حداقل ۵ سال. ۳۰ و ۹۰ روز حداقل‌های قانونی DUI نیستند."}, {"t": "dui", "s": ["S7", "316.1932", "316.1939"], "sg": null, "q": ["Florida's Implied Consent Law means that, by driving in Florida, you have agreed to:", "قانون «رضایت ضمنی» فلوریدا یعنی با رانندگی در فلوریدا شما به چه چیزی رضایت داده‌اید؟"], "o": [["Take approved breath, blood, or urine tests if lawfully arrested for DUI", "اگر به‌طور قانونی به اتهام DUI بازداشت شوید، آزمایش‌های تأییدشده تنفس، خون یا ادرار را انجام دهید"], ["Let police search your car at any time", "اجازه دهید پلیس هر زمان خودروی شما را بگردد"], ["Carry a printed copy of your insurance policy", "یک نسخه چاپی از بیمه‌نامه همراه داشته باشید"], ["Report every crash to your insurer within 24 hours", "هر تصادف را ظرف ۲۴ ساعت به بیمه گزارش دهید"]], "a": 0, "x": "رضایت ضمنی یعنی پذیرفتن گواهینامه و رانندگی در فلوریدا به معنای رضایت به انجام آزمایش‌های الکل و مواد مخدر (تنفس، ادرار و در شرایط خاص خون) پس از بازداشت قانونی برای DUI است. امتناع باعث تعلیق خودکار گواهینامه می‌شود (بار اول ۱ سال) و از ۱ اکتبر ۲۰۲۵، امتناع از آزمایش تنفس یا ادرار (حتی بار اول) جرم کیفری نیز هست. این قانون به تفتیش خودرو یا امور بیمه ربطی ندارد."}, {"t": "dui", "s": ["S2"], "sg": null, "q": ["Alcohol FIRST affects a driver's:", "الکل «ابتدا» روی کدام توانایی راننده اثر می‌گذارد؟"], "o": [["Judgment and self-control", "قضاوت و خودکنترلی"], ["Hearing", "شنوایی"], ["Muscle strength", "قدرت عضلات"], ["Sense of smell", "حس بویایی"]], "a": 0, "x": "الکل ابتدا بخش‌هایی از مغز را که مسئول قضاوت و خودکنترلی هستند تحت تأثیر قرار می‌دهد؛ به همین دلیل راننده‌ای که نوشیده اغلب فکر می‌کند حالش خوب است و ریسک بیشتری می‌کند. سپس زمان واکنش، هماهنگی و بینایی آسیب می‌بینند. شنوایی، قدرت عضلات و بویایی اولین موارد آسیب‌دیده نیستند."}, {"t": "dui", "s": ["S7", "316.1939"], "sg": null, "q": ["A second (or later) refusal to take a lawful breath, blood, or urine test results in a license suspension of:", "امتناع «دوم» (یا بیشتر) از انجام آزمایش قانونی تنفس، خون یا ادرار، چه مدت تعلیق گواهینامه در پی دارد؟"], "o": [["6 months", "۶ ماه"], ["1 year", "۱ سال"], ["18 months", "۱۸ ماه"], ["5 years", "۵ سال"]], "a": 2, "x": "طبق FLHSMV: امتناع اول = ۱ سال تعلیق؛ امتناع دوم یا بیشتر = ۱۸ ماه تعلیق. علاوه بر تعلیق، از ۱ اکتبر ۲۰۲۵ (قانون Trenton، بند 316.1939) امتناع اول از آزمایش «تنفس یا ادرار» جنحه درجه دو و امتناع دوم یا بیشتر جنحه درجه یک است. ۱ سال مربوط به امتناع اول است. ۶ ماه مربوط به تعلیق اول زیر ۲۱ ساله‌ها با الکل ۰.۰۲ است و ۵ سال مربوط به DUI دوم در کمتر از ۵ سال است."}, {"t": "license", "s": ["S4"], "sg": null, "q": ["Before a teen can get a Class E license, the learner's license must be held for at least:", "قبل از اینکه یک نوجوان گواهینامه کلاس E بگیرد، گواهینامه آموزشی باید دست‌کم چه مدت نگه داشته شود؟"], "o": [["12 months or until age 18, whichever comes first", "۱۲ ماه یا تا ۱۸ سالگی، هر کدام زودتر برسد"], ["3 months", "۳ ماه"], ["6 months", "۶ ماه"], ["24 months", "۲۴ ماه"]], "a": 0, "x": "طبق صفحه GDL سایت FLHSMV: گواهینامه آموزشی باید دست‌کم ۱ سال (۱۲ ماه) یا تا رسیدن به ۱۸ سالگی (هر کدام زودتر) نگه داشته شود، بدون محکومیت تخلف رانندگی (یا حداکثر یک تخلف با «adjudication withheld»). ۳ ماه مربوط به محدودیت رانندگی فقط در روز است."}, {"t": "license", "s": ["S4", "S13"], "sg": null, "q": ["A parent, legal guardian, or responsible adult over 21 must certify that a teen driver has at least ___ hours of supervised driving, including ___ hours at night.", "والدین، سرپرست قانونی یا یک بزرگسال مسئول بالای ۲۱ سال باید گواهی کنند که نوجوان دست‌کم ___ ساعت رانندگی تحت نظارت داشته که ___ ساعت آن در شب بوده است."], "o": [["50; 10", "۵۰ ساعت؛ ۱۰ ساعت"], ["30; 5", "۳۰ ساعت؛ ۵ ساعت"], ["40; 15", "۴۰ ساعت؛ ۱۵ ساعت"], ["100; 20", "۱۰۰ ساعت؛ ۲۰ ساعت"]], "a": 0, "x": "FLHSMV: یک والد، سرپرست قانونی یا بزرگسال مسئول بالای ۲۱ سال باید فرم «Certification of Minor Driving Experience» را پر کند و گواهی دهد که نوجوان ۵۰ ساعت رانندگی داشته که ۱۰ ساعت آن در شب بوده است. در دفتر Tax Collector هیلزبورو نیز هنگام آزمون رانندگی همین را درخواست می‌کنند. اعداد دیگر نادرست‌اند."}, {"t": "license", "s": ["S4"], "sg": null, "q": ["A 16-year-old with a Class E license may NOT drive between:", "یک نوجوان ۱۶ ساله با گواهینامه کلاس E، بین چه ساعاتی «نمی‌تواند» رانندگی کند؟"], "o": [["11 p.m. and 6 a.m., unless with a licensed driver 21+ or driving to or from work", "۱۱ شب تا ۶ صبح، مگر همراه راننده دارای گواهینامه ۲۱ سال به بالا یا در مسیر رفت‌وبرگشت کار"], ["10 p.m. and 5 a.m.", "۱۰ شب تا ۵ صبح"], ["1 a.m. and 5 a.m.", "۱ بامداد تا ۵ صبح"], ["Midnight and 6 a.m.", "نیمه‌شب تا ۶ صبح"]], "a": 0, "x": "راننده ۱۶ ساله: رانندگی از ۱۱ شب تا ۶ صبح ممنوع است، مگر با راننده دارای گواهینامه ۲۱ سال به بالا یا در مسیر رفتن به کار/برگشتن از کار. «۱ تا ۵ بامداد» محدودیت راننده ۱۷ ساله است. «۱۰ شب» مربوط به گواهینامه آموزشی بعد از ۳ ماه اول است."}, {"t": "license", "s": ["S17", "H2.2", "S14"], "sg": null, "q": ["A new Florida resident who wants to drive must get a Florida driver license within how many days of becoming a resident?", "ساکن جدید فلوریدا که می‌خواهد رانندگی کند، باید ظرف چند روز پس از اقامت، گواهینامه فلوریدا بگیرد؟"], "o": [["10 days", "۱۰ روز"], ["30 days", "۳۰ روز"], ["60 days", "۶۰ روز"], ["90 days", "۹۰ روز"]], "a": 1, "x": "ساکنان جدید باید ظرف ۳۰ روز پس از برقراری اقامت، گواهینامه فلوریدا دریافت کنند تا بتوانند قانونی رانندگی کنند. ۱۰ روز مهلت دیگری است: ثبت خودرو و گرفتن بیمه فلوریدا. ۶۰ و ۹۰ روز در این قانون نیستند. اگر گواهینامه کشور خارجی دارید، به راهنمای ساکنان جدید Tax Collector هیلزبورو مراجعه کنید."}, {"t": "safe", "s": ["S2"], "sg": null, "q": ["In rain or other poor conditions, your following distance should be:", "در باران یا شرایط نامساعد دیگر، فاصله شما با خودروی جلو باید چگونه باشد؟"], "o": [["Increased: add extra seconds beyond the normal 3–4 seconds", "بیشتر: چند ثانیه به ۳ تا ۴ ثانیه معمول اضافه کنید"], ["The same as in good weather", "همانند هوای خوب"], ["Reduced so you can follow the taillights ahead", "کمتر، تا بتوانید چراغ‌های عقب خودروی جلو را دنبال کنید"], ["One car length", "یک طول خودرو"]], "a": 0, "x": "کتابچه فلوریدا حداقل فاصله دنبال کردن را ۳ تا ۴ ثانیه می‌داند و می‌گوید برای هر شرایط غیرعادی آب‌وهوا یا ترافیک، یک ثانیه دیگر اضافه کنید؛ در باران هم باید برای «دست‌کم دو برابر» مسافت توقف معمول برنامه‌ریزی کنید، چون مسافت ترمز روی جاده خیس بیشتر است و دید کمتر. کم کردن فاصله برای دنبال کردن چراغ‌های خودروی جلو بسیار خطرناک است و «یک طول خودرو» هرگز معیار درستی نیست."}, {"t": "safe", "s": ["S2", "316.238"], "sg": null, "q": ["When you are FOLLOWING another vehicle at night, you must switch to low beams within how many feet of it?", "وقتی شب «پشت سر» خودروی دیگری حرکت می‌کنید، در چند فوتی آن باید نور پایین را روشن کنید؟"], "o": [["100 feet", "۱۰۰ فوت"], ["200 feet", "۲۰۰ فوت"], ["300 feet", "۳۰۰ فوت"], ["500 feet", "۵۰۰ فوت"]], "a": 2, "x": "وقتی پشت خودرویی هستید، در فاصله ۳۰۰ فوتی باید نور پایین استفاده کنید تا نور بالای شما از آینه‌ها راننده جلویی را کور نکند. ۵۰۰ فوت مربوط به خودروی «روبه‌رو» است. ۱۰۰ و ۲۰۰ فوت عدد این قانون نیستند."}, {"t": "safe", "s": ["S2"], "sg": null, "q": ["‘Overdriving your headlights’ means:", "«جلوتر از نور چراغ‌ها راندن» (Overdriving your headlights) یعنی چه؟"], "o": [["Driving so fast that you cannot stop within the distance your headlights light up", "آن‌قدر سریع راندن که نتوانید در محدوده‌ای که چراغ‌ها روشن می‌کنند توقف کنید"], ["Using high beams in the city", "استفاده از نور بالا در شهر"], ["Driving with one headlight out", "رانندگی با یک چراغ جلوی سوخته"], ["Leaving headlights on after parking", "روشن گذاشتن چراغ‌ها پس از پارک"]], "a": 0, "x": "در شب فقط تا جایی را می‌بینید که چراغ‌ها روشن کرده‌اند. اگر مسافت توقف شما در آن سرعت بیشتر از این فاصله باشد، وقتی خطری را ببینید دیگر نمی‌توانید به‌موقع بایستید. راه‌حل: در شب آهسته‌تر برانید. گزینه‌های دیگر ربطی به این اصطلاح ندارند."}, {"t": "safe", "s": ["H6.8"], "sg": null, "q": ["When driving near a large truck, remember that:", "هنگام رانندگی نزدیک یک کامیون بزرگ، چه نکته‌ای را باید به خاطر داشته باشید؟"], "o": [["If you cannot see the driver in the truck's side mirror, the driver probably cannot see you", "اگر راننده را در آینه بغل کامیون نمی‌بینید، احتمالاً او هم شما را نمی‌بیند"], ["Trucks have fewer blind spots than cars", "کامیون‌ها نقاط کور کمتری از خودروها دارند"], ["It is safe to cut in close in front of a truck after passing", "پس از سبقت، پیچیدن نزدیک جلوی کامیون ایمن است"], ["Truck drivers can easily see cars directly behind the trailer", "رانندگان کامیون می‌توانند خودروهای درست پشت تریلر را به‌راحتی ببینند"]], "a": 0, "x": "کتابچه (اشتراک جاده با کامیون): کامیون‌ها نقاط کور بزرگی (No-Zone) در جلو، عقب و هر دو طرف دارند. قاعده ایمنی رایج (FMCSA): اگر صورت راننده را در آینه بغل او نمی‌بینید، او شما را نمی‌بیند؛ کتابچه هم می‌گوید طوری قرار بگیرید که راننده کامیون شما را در آینه‌های بغل ببیند. کامیون درست پشت تریلر یک نقطه کور بزرگ دارد، پس راننده کامیون خودرویی را که نزدیک پشت آن است نمی‌بیند (گزینه D غلط است). کامیون‌ها نقاط کور «بزرگ‌تری» از خودروها دارند، و هنگام سبقت فقط وقتی جلوی کامیون بروید که کابین آن را در آینه عقب خود ببینید؛ پیچیدن نزدیک جلوی آن خطرناک است."}, {"t": "safe", "s": ["316.083"], "sg": null, "q": ["When passing a bicyclist, Florida law requires you to leave at least how much space?", "هنگام سبقت از دوچرخه‌سوار، قانون فلوریدا حداقل چه فاصله‌ای را الزامی می‌کند؟"], "o": [["1 foot", "۱ فوت"], ["2 feet", "۲ فوت"], ["3 feet", "۳ فوت"], ["5 feet", "۵ فوت"]], "a": 2, "x": "بند 316.083: هنگام سبقت از دوچرخه یا سایر وسایل غیرموتوری باید دست‌کم ۳ فوت (حدود ۹۰ سانتی‌متر) فاصله جانبی بگذارید. اگر جا کافی نیست، پشت دوچرخه صبر کنید تا سبقت امن شود. ۱ و ۲ فوت کمتر از حد قانون‌اند. ۵ فوت فاصله بهتری است ولی حداقل قانونی نیست."}, {"t": "safe", "s": ["S2"], "sg": null, "q": ["If you become drowsy while driving, the best thing to do is:", "اگر هنگام رانندگی خواب‌آلود شوید، بهترین کار چیست؟"], "o": [["Pull off the road at a safe place and rest", "در جای امنی از جاده خارج شوید و استراحت کنید"], ["Turn up the radio", "صدای رادیو را بلند کنید"], ["Open the window and keep going", "پنجره را باز کنید و ادامه دهید"], ["Drink coffee and drive faster to get home sooner", "قهوه بنوشید و سریع‌تر برانید تا زودتر برسید"]], "a": 0, "x": "خستگی زمان واکنش و قضاوت را مانند الکل مختل می‌کند و ممکن است چند ثانیه به خواب بروید. رادیو، هوای سرد یا قهوه فقط اثر کوتاه‌مدت دارند و خواب را برطرف نمی‌کنند. تنها راه ایمن، توقف در جای امن و استراحت یا خواب کوتاه است. سریع‌تر راندن خطر را چند برابر می‌کند."}, {"t": "safe", "s": ["S2"], "sg": null, "q": ["In an emergency stop in a vehicle with anti-lock brakes (ABS), you should:", "در ترمز اضطراری با خودرویی که ترمز ضدقفل (ABS) دارد، چه باید بکنید؟"], "o": [["Press the brake firmly and keep steady pressure; do not pump", "ترمز را محکم فشار دهید و فشار را ثابت نگه دارید؛ پمپ نکنید"], ["Pump the brakes rapidly", "ترمز را سریع و پشت‌سرهم پمپ کنید"], ["Release the brake when you feel it pulsing", "وقتی لرزش پدال را حس کردید، ترمز را رها کنید"], ["Use only the parking brake", "فقط از ترمز دستی استفاده کنید"]], "a": 0, "x": "سیستم ABS خودش به‌صورت خودکار ترمز را چندین بار در ثانیه پمپ می‌کند تا چرخ‌ها قفل نشوند و بتوانید فرمان بدهید. پس پدال را محکم و پیوسته فشار دهید و فرمان را کنترل کنید. لرزش پدال طبیعی است؛ آن را رها نکنید. پمپ کردن دستی مخصوص خودروهای بدون ABS است و ترمز دستی برای توقف اضطراری مناسب نیست."}, {"t": "safe", "s": ["S10", "316.305"], "sg": null, "q": ["In Florida, texting while driving is:", "در فلوریدا، پیامک دادن هنگام رانندگی چه وضعیتی دارد؟"], "o": [["A primary offense: an officer can stop you for it alone", "تخلف اولیه است: پلیس فقط به همین دلیل می‌تواند شما را متوقف کند"], ["Legal at speeds under 25 mph", "در سرعت کمتر از ۲۵ مایل در ساعت قانونی است"], ["Only a secondary offense", "فقط تخلف ثانویه است"], ["Allowed if you hold the phone at eye level", "اگر گوشی را هم‌سطح چشم نگه دارید مجاز است"]], "a": 0, "x": "از ۱ ژوئیه ۲۰۱۹، پیامک دادن (تایپ یا خواندن پیام، ایمیل و مانند آن) هنگام حرکت خودرو در فلوریدا «تخلف اولیه» است؛ یعنی پلیس فقط برای همین می‌تواند شما را متوقف کند. پیش از آن تخلف ثانویه بود. سرعت کم یا بالا نگه داشتن گوشی آن را قانونی نمی‌کند. در منطقه مدرسه، گذرگاه مدرسه و منطقه کار (وقتی کارگران حضور دارند یا با تجهیزات کار می‌کنند)، هر نوع استفاده دستی از گوشی ممنوع است."}, {"t": "emergency", "s": ["S2"], "sg": null, "q": ["If your brakes suddenly fail in a car without anti-lock brakes, you should first:", "اگر ترمز خودروی بدون ABS ناگهان از کار بیفتد، ابتدا چه باید بکنید؟"], "o": [["Pump the brake pedal quickly and firmly, shift to a lower gear, then apply the parking brake gradually", "پدال ترمز را سریع و محکم پمپ کنید، به دنده پایین‌تر بروید و سپس به‌تدریج ترمز دستی را بکشید"], ["Turn off the engine", "موتور را خاموش کنید"], ["Pull the parking brake hard at full speed", "در سرعت بالا ترمز دستی را محکم بکشید"], ["Shift into Park", "دنده را روی P (پارک) بگذارید"]], "a": 0, "x": "پمپ کردن سریع پدال ممکن است فشار ترمز را برگرداند. سپس با رفتن به دنده سنگین‌تر از موتور برای کاهش سرعت کمک بگیرید و ترمز دستی را «به‌تدریج» بکشید. خاموش کردن موتور ممکن است فرمان‌پذیری را از بین ببرد. کشیدن ناگهانی ترمز دستی یا زدن دنده P در سرعت بالا ممکن است باعث لغزش و آسیب شدید به گیربکس شود."}, {"t": "emergency", "s": ["S2", "https://oli.org/safety-near-trains/driving-safely-near-tracks", "https://oli.org/sites/default/files/2019-09/How-to-Drive-Near-Trains_20min_LessonPlan.pdf"], "sg": null, "q": ["Your vehicle stalls on railroad tracks and a train is coming. You should:", "خودروی شما روی ریل راه‌آهن خاموش شده و قطاری در حال آمدن است. چه باید بکنید؟"], "o": [["Get everyone out immediately and move well away from the tracks", "همه را فوراً پیاده کنید و به فاصله زیادی از ریل دور شوید"], ["Keep trying to restart the engine", "دوباره سعی کنید موتور را روشن کنید"], ["Stay in the vehicle with seat belts on", "با کمربند بسته در خودرو بمانید"], ["Try to push the car off the tracks", "سعی کنید خودرو را از روی ریل هل دهید"]], "a": 0, "x": "قطار نمی‌تواند سریع بایستد و جان شما مهم‌تر از خودرو است. فوراً همه را پیاده کنید و از ریل دور شوید؛ طبق توصیه Operation Lifesaver (سازمان ایمنی راه‌آهن)، با زاویه، به سمت قطار دور شوید تا تکه‌های خودرو پس از برخورد به شما نخورد. سپس با شماره اضطراری روی تابلوی آبی کنار ریل یا ۹۱۱ تماس بگیرید. تلاش برای روشن کردن یا هل دادن خودرو وقت حیاتی را هدر می‌دهد."}, {"t": "special", "s": ["S5", "316.172"], "sg": null, "q": ["On a divided highway with a raised barrier or an unpaved median at least 5 feet wide, traffic moving in the OPPOSITE direction of a stopped school bus:", "در بزرگراه جداشده با مانع برآمده یا میانه غیرآسفالته حداقل ۵ فوتی، ترافیکی که در جهت «مخالف» اتوبوس مدرسه متوقف حرکت می‌کند:"], "o": [["Does not have to stop, but should proceed with caution", "مجبور به توقف نیست، اما باید با احتیاط عبور کند"], ["Must stop until the stop arm is withdrawn", "باید تا بسته شدن بازوی ایست توقف کند"], ["Must stop only if children are visible", "فقط اگر کودکی دیده شود باید توقف کند"], ["Must slow to 10 mph", "باید سرعت را به ۱۰ مایل در ساعت کاهش دهد"]], "a": 0, "x": "این تنها استثنای قانون اتوبوس مدرسه است: اگر جاده با مانع برآمده (مثل جدول بتنی) یا میانه غیرآسفالته دست‌کم ۵ فوتی جدا شده باشد، ترافیک جهت مخالف لازم نیست بایستد، ولی باید با احتیاط حرکت کند. ترافیک پشت اتوبوس همیشه باید بایستد. اگر میانه آسفالته یا فقط خط‌کشی رنگی باشد، رانندگان هر دو جهت باید توقف کنند."}, {"t": "special", "s": ["S9"], "sg": null, "q": ["Florida's seat belt law requires seat belts or child restraints for:", "قانون کمربند ایمنی فلوریدا، استفاده از کمربند یا صندلی کودک را برای چه کسانی الزامی می‌کند؟"], "o": [["The driver, all front-seat passengers, and all passengers under 18", "راننده، همه سرنشینان صندلی جلو و همه سرنشینان زیر ۱۸ سال"], ["Only the driver", "فقط راننده"], ["Only front-seat passengers under 18", "فقط سرنشینان زیر ۱۸ سالِ صندلی جلو"], ["Only passengers on highways", "فقط سرنشینان در بزرگراه‌ها"]], "a": 0, "x": "طبق FLHSMV، کمربند ایمنی (یا صندلی کودک) برای راننده، همه سرنشینان صندلی جلو (با هر سنی) و همه سرنشینان زیر ۱۸ سال (در هر صندلی) الزامی است. کودکان ۵ ساله و کوچک‌تر باید در صندلی کودک مورد تأیید باشند. این قانون در همه جاده‌ها اعمال می‌شود و عدم رعایت آن تخلف اولیه است."}], [{"t": "signs", "s": ["S2"], "sg": {"k": "diamond", "c": "yellow", "sym": "signal"}, "q": ["This yellow diamond sign with a traffic-light symbol means:", "این تابلوی لوزی زرد با نماد چراغ راهنمایی به چه معناست؟"], "o": [["A traffic signal is ahead", "در ادامه مسیر چراغ راهنمایی وجود دارد"], ["The signal ahead is broken", "چراغ راهنمایی جلو خراب است"], ["A railroad crossing is ahead", "در ادامه تقاطع راه‌آهن است"], ["A stop sign is ahead", "در ادامه تابلوی ایست است"]], "a": 0, "x": "این تابلوی هشدار «چراغ راهنمایی در پیش رو» است و معمولاً جایی نصب می‌شود که چراغ به‌دلیل پیچ یا شیب دیر دیده می‌شود. آماده توقف باشید. خراب بودن چراغ با این تابلو اعلام نمی‌شود. پیش‌آگاهی راه‌آهن تابلوی گرد زرد است و «ایست در پیش رو» نماد هشت‌ضلعی قرمز دارد."}, {"t": "signs", "s": ["S2"], "sg": {"k": "stopall"}, "q": ["A STOP sign with an ‘ALL WAY’ plate under it means:", "تابلوی ایست با پلاک «ALL WAY» در زیر آن به چه معناست؟"], "o": [["All drivers approaching the intersection must stop", "همه رانندگانی که به تقاطع نزدیک می‌شوند باید توقف کنند"], ["Only you must stop; cross traffic does not", "فقط شما باید بایستید؛ ترافیک عرضی نه"], ["You may turn in any direction without stopping", "می‌توانید بدون توقف به هر سمت بپیچید"], ["Stop only during rush hour", "فقط در ساعت اوج ترافیک بایستید"]], "a": 0, "x": "پلاک ALL WAY (یا 4-WAY) یعنی رانندگان «همه» جهت‌ها باید بایستند. پس از توقف کامل، هر که زودتر رسیده اول حرکت می‌کند و اگر هم‌زمان رسیدید، به سمت راست حق تقدم بدهید. بدون این پلاک ممکن است فقط شما تابلوی ایست داشته باشید و ترافیک عرضی بدون توقف رد شود، پس همیشه نگاه کنید."}, {"t": "signs", "s": ["S2"], "sg": {"k": "rect", "bg": "#fff", "fg": "#111", "lines": ["KEEP", "RIGHT"], "tall": true}, "q": ["This white regulatory sign means:", "این تابلوی مقرراتی سفید به چه معناست؟"], "o": [["Stay to the right of the traffic island or divider ahead", "از سمت راست جزیره یا جداکننده جلو عبور کنید"], ["The right lane ends", "خط راست تمام می‌شود"], ["Right turn only", "فقط گردش به راست"], ["Slower traffic keep right", "ترافیک کندتر سمت راست حرکت کند"]], "a": 0, "x": "تابلوی KEEP RIGHT معمولاً جلوی جزیره ترافیکی، میانه یا مانع نصب می‌شود و یعنی باید از سمت «راست» آن عبور کنید. پایان خط راست با لوزی زرد هشدار داده می‌شود، «فقط گردش به راست» تابلوی جداگانه‌ای با فلش دارد و «ترافیک کندتر سمت راست» تابلوی مخصوص خود را دارد."}, {"t": "signs", "s": ["S2", "316.1575"], "sg": null, "q": ["At a railroad crossing, the red lights are flashing and the gate is coming down, but you do not see a train. You must:", "در تقاطع راه‌آهن، چراغ‌های قرمز چشمک می‌زنند و راهبند در حال پایین آمدن است، اما قطاری نمی‌بینید. چه باید بکنید؟"], "o": [["Stop and wait until the gate is fully raised and the lights stop flashing", "توقف کنید و صبر کنید تا راهبند کاملاً بالا برود و چراغ‌ها خاموش شوند"], ["Drive around the gate if the tracks look clear", "اگر ریل خالی به نظر می‌رسد، از کنار راهبند عبور کنید"], ["Speed up to cross before the gate closes", "سرعت را زیاد کنید تا قبل از بسته شدن راهبند رد شوید"], ["Stop, then cross if no train is visible", "توقف کنید و اگر قطاری دیده نمی‌شود عبور کنید"]], "a": 0, "x": "بند 316.1575: وقتی چراغ‌های هشدار روشن‌اند یا راهبند پایین است، باید بین ۱۵ تا ۵۰ فوت از نزدیک‌ترین ریل توقف کنید و تا بالا رفتن کامل راهبند و خاموش شدن چراغ‌ها صبر کنید. قطار از فاصله‌ای که فکر می‌کنید سریع‌تر می‌رسد و ممکن است قطار دوم پشت اولی باشد. دور زدن راهبند یا عجله برای عبور غیرقانونی و مرگبار است."}, {"t": "signs", "s": ["S2", "316.081"], "sg": {"k": "rect", "bg": "#fff", "fg": "#111", "lines": ["SLOWER", "TRAFFIC", "KEEP RIGHT"], "tall": true}, "q": ["On a multi-lane highway, this sign means:", "در بزرگراه چندخطه، این تابلو به چه معناست؟"], "o": [["If you are driving slower than surrounding traffic, use the right lane", "اگر آهسته‌تر از ترافیک اطراف می‌رانید، از خط راست استفاده کنید"], ["Only trucks may use the right lane", "فقط کامیون‌ها می‌توانند از خط راست استفاده کنند"], ["The right lane is closed ahead", "خط راست در ادامه بسته است"], ["You must pass on the right", "باید از سمت راست سبقت بگیرید"]], "a": 0, "x": "در بزرگراه‌های چندخطه، خط چپ برای سبقت است و خودروهای کندتر باید در خط راست حرکت کنند. طبق بند 316.081(3)، در هر جاده‌ای که دو خط یا بیشتر در یک جهت دارد، اگر خودروی سریع‌تری از پشت در خط چپ به شما نزدیک می‌شود، نباید در خط چپ بمانید. این تابلو خط را به کامیون‌ها محدود نمی‌کند و سبقت از راست را اجباری نمی‌کند."}, {"t": "signs", "s": ["H5.23"], "sg": {"k": "hov"}, "q": ["A white diamond symbol painted in a lane (or posted over it) means the lane is:", "نماد لوزی سفید که روی یک خط رنگ شده (یا بالای آن نصب شده) به چه معناست؟"], "o": [["Reserved for high-occupancy (carpool/HOV) vehicles or other special uses shown on signs", "مخصوص خودروهای با سرنشین زیاد (HOV/کارپول) یا کاربری ویژه‌ای که روی تابلو آمده"], ["A school zone lane", "خط منطقه مدرسه"], ["A lane that is ending", "خطی که در حال پایان است"], ["A passing lane for trucks only", "خط سبقت فقط برای کامیون‌ها"]], "a": 0, "x": "کتابچه: خطوطی که با لوزی مشخص شده‌اند برای خودروهای «کارپول» با دو سرنشین یا بیشتر (HOV) رزرو شده‌اند؛ به تابلوهای لوزی کنار جاده توجه کنید. اگر شرایط لازم را ندارید (مثلاً تنها هستید)، نباید در آن رانندگی کنید. منطقه مدرسه، پایان خط و خط سبقت کامیون نشانه‌های دیگری دارند."}, {"t": "signs", "s": ["S2", "316.075"], "sg": {"k": "rect", "bg": "#fff", "fg": "#111", "lines": ["NO", "TURN", "ON RED"], "tall": true}, "q": ["A ‘NO TURN ON RED’ sign means:", "تابلوی «NO TURN ON RED» به چه معناست؟"], "o": [["You may not turn while the signal is red; wait for green", "تا وقتی چراغ قرمز است نمی‌توانید بپیچید؛ منتظر سبز بمانید"], ["You may turn right after a full stop", "پس از توقف کامل می‌توانید به راست بپیچید"], ["You may turn left only", "فقط می‌توانید به چپ بپیچید"], ["Turning is never allowed at this intersection", "پیچیدن در این تقاطع هرگز مجاز نیست"]], "a": 0, "x": "به‌طور معمول در فلوریدا گردش به راست با چراغ قرمز پس از توقف کامل مجاز است، اما این تابلو آن را ممنوع می‌کند؛ باید تا سبز شدن چراغ (یا فلش سبز) صبر کنید. گردش در این تقاطع ممنوع نیست، فقط در زمان قرمز ممنوع است. گردش به چپ با قرمز هم مجاز نمی‌شود."}, {"t": "signs", "s": ["S2"], "sg": {"k": "advisory"}, "q": ["A yellow plate showing ‘35 MPH’ under a curve warning sign, like this one, tells you:", "پلاک زرد با نوشته «35 MPH» زیر تابلوی هشدار پیچ، مانند این، به شما چه می‌گوید؟"], "o": [["The recommended safe speed for the curve", "سرعت ایمن توصیه‌شده برای پیچ"], ["The minimum speed on the curve", "حداقل سرعت در پیچ"], ["The speed limit for trucks only", "حداکثر سرعت فقط برای کامیون‌ها"], ["The speed you need to climb the hill", "سرعتی که برای بالا رفتن از تپه لازم دارید"]], "a": 0, "x": "پلاک زرد زیر تابلوی هشدار «سرعت توصیه‌ای» است: حداکثر سرعتی که در شرایط خوب برای عبور ایمن از آن پیچ پیشنهاد می‌شود. تابلوهای حداکثر و حداقل سرعت قانونی سفید و مستطیلی هستند. در باران یا شب حتی آهسته‌تر از سرعت توصیه‌ای برانید."}, {"t": "signs", "s": ["S2"], "sg": null, "q": ["In a work zone, a flagger holds up a sign that says ‘STOP’. You must:", "در منطقه کار، پرچمداری تابلویی با نوشته «STOP» بالا گرفته است. چه باید بکنید؟"], "o": [["Stop and follow the flagger's directions", "توقف کنید و از دستورهای پرچمدار پیروی کنید"], ["Proceed slowly if your lane looks open", "اگر خط شما باز به نظر می‌رسد، آرام عبور کنید"], ["Obey the traffic signal instead", "به‌جای آن از چراغ راهنمایی پیروی کنید"], ["Honk and wait for the workers to move", "بوق بزنید و منتظر بمانید کارگران کنار بروند"]], "a": 0, "x": "دستورهای پرچمدار در منطقه کار همان اعتبار تابلوها و چراغ‌های راهنمایی را دارد. وقتی تابلوی STOP را نشان می‌دهد باید توقف کنید تا تابلوی SLOW را نشان دهد یا اشاره کند. ممکن است ترافیک یک‌طرفه از جهت مقابل در همان خط در حال عبور باشد که شما نمی‌بینید. بوق زدن به کارگران بی‌فایده و بی‌احترامی است."}, {"t": "signs", "s": ["H9.3"], "sg": {"k": "lanex"}, "q": ["Above a reversible lane, a steady red X like this means:", "بالای یک خط برگشت‌پذیر، علامت X قرمز ثابت مانند این به چه معناست؟"], "o": [["Do not drive in this lane", "در این خط رانندگی نکنید"], ["You may use this lane to turn left", "می‌توانید از این خط برای گردش به چپ استفاده کنید"], ["The lane is about to open", "این خط به‌زودی باز می‌شود"], ["Use the lane only if it looks clear", "فقط اگر خالی به نظر می‌رسد از این خط استفاده کنید"]], "a": 0, "x": "علائم کنترل خط: X قرمز ثابت = هرگز در این خط رانندگی نکنید (ترافیک مقابل از آن استفاده می‌کند). X زرد ثابت = آماده خروج از خط شوید. فلش سبز رو به پایین = می‌توانید از این خط استفاده کنید. پس خالی به نظر رسیدن خط، اجازه استفاده نمی‌دهد."}, {"t": "signals", "s": ["H9.1"], "sg": null, "q": ["At a steady RED right-turn arrow, with no sign prohibiting it, you may:", "در برابر فلش قرمز ثابت گردش به راست، اگر تابلویی آن را ممنوع نکرده باشد، چه می‌توانید بکنید؟"], "o": [["Turn right after coming to a complete stop and yielding to pedestrians and traffic", "پس از توقف کامل و دادن حق تقدم به عابران و ترافیک، به راست بپیچید"], ["Turn right without stopping", "بدون توقف به راست بپیچید"], ["Never turn until the arrow turns green", "تا سبز شدن فلش هرگز نپیچید"], ["Proceed straight through the intersection", "مستقیم از تقاطع عبور کنید"]], "a": 0, "x": "طبق کتابچه فلوریدا (بخش چراغ‌ها)، فلش قرمز مانند چراغ قرمز است: باید کامل توقف کنید. در بیشتر تقاطع‌ها پس از توقف و دادن حق تقدم، گردش به راست با فلش قرمز مجاز است، مگر تابلوی NO TURN ON RED نصب باشد. عبور بدون توقف مجاز نیست، «هرگز» هم درست نیست، و فلش قرمز گردش به راست اجازه حرکت مستقیم نمی‌دهد."}, {"t": "signals", "s": ["S2", "316.075"], "sg": null, "q": ["In Florida, a LEFT turn on a red light is allowed only:", "در فلوریدا، گردش به «چپ» با چراغ قرمز فقط در چه حالتی مجاز است؟"], "o": [["From a one-way street onto another one-way street going left, after a full stop and yielding", "از خیابان یک‌طرفه به خیابان یک‌طرفه دیگری که ترافیک آن به سمت چپ می‌رود، پس از توقف کامل و دادن حق تقدم"], ["Never", "هرگز"], ["At any intersection after stopping", "در هر تقاطعی پس از توقف"], ["From a two-way street onto a one-way street", "از خیابان دوطرفه به خیابان یک‌طرفه"]], "a": 0, "x": "بند 316.075: گردش به چپ با قرمز فقط از خیابان یک‌طرفه به خیابان یک‌طرفه دیگر (که ترافیکش به چپ می‌رود) مجاز است، آن هم پس از توقف کامل و دادن حق تقدم، مگر تابلویی آن را ممنوع کند. از خیابان دوطرفه مجاز نیست، چون باید از جلوی ترافیک روبه‌رو عبور کنید. «هرگز» و «هر تقاطعی» هر دو نادرست‌اند."}, {"t": "signals", "s": ["S2"], "sg": null, "q": ["A FLASHING yellow left-turn arrow means:", "فلش زرد «چشمک‌زن» برای گردش به چپ به چه معناست؟"], "o": [["Left turns are allowed, but you must yield to oncoming traffic and pedestrians", "گردش به چپ مجاز است، اما باید به ترافیک روبه‌رو و عابران حق تقدم بدهید"], ["A protected turn; oncoming traffic is stopped", "گردش حمایت‌شده است؛ ترافیک روبه‌رو متوقف است"], ["Stop; turns are not allowed", "توقف کنید؛ گردش مجاز نیست"], ["Turn quickly before the light changes", "قبل از تغییر چراغ سریع بپیچید"]], "a": 0, "x": "فلش زرد چشمک‌زن یعنی گردش به چپ «غیرحمایت‌شده» مجاز است: ترافیک روبه‌رو چراغ سبز دارد، پس باید به آن‌ها و عابران راه بدهید و در فاصله امن بپیچید. گردش حمایت‌شده (ترافیک مقابل متوقف) با فلش «سبز» نشان داده می‌شود. عجله برای پیچیدن خطرناک است."}, {"t": "signals", "s": ["S2"], "sg": null, "q": ["A BROKEN (dashed) yellow center line on your side of the road means:", "خط زرد «منقطع» وسط جاده در سمت شما به چه معناست؟"], "o": [["You may pass when it is safe", "وقتی امن باشد می‌توانید سبقت بگیرید"], ["Passing is never allowed", "سبقت هرگز مجاز نیست"], ["The lane is for turning only", "این خط فقط برای گردش است"], ["You are on a one-way road", "در جاده یک‌طرفه هستید"]], "a": 0, "x": "خط زرد منقطع در سمت شما یعنی اجازه دارید در صورت دید کافی و خالی بودن خط مقابل سبقت بگیرید؛ خط زرد یعنی آن طرف ترافیک مخالف است، پس جاده یک‌طرفه نیست. خط ممتد زرد در سمت شما یعنی سبقت ممنوع. سبقت همیشه باید با فاصله کافی و بدون عبور از حد سرعت انجام شود."}, {"t": "signals", "s": ["S2", "316.123"], "sg": null, "q": ["At a stop sign with no marked stop line and no crosswalk, you must stop:", "در تابلوی ایست بدون خط ایست و بدون خط عابر پیاده، کجا باید توقف کنید؟"], "o": [["Before entering the intersection, at the point nearest it where you can see approaching traffic", "قبل از ورود به تقاطع، در نزدیک‌ترین نقطه‌ای که ترافیک در حال نزدیک شدن را می‌بینید"], ["In the middle of the intersection", "وسط تقاطع"], ["About 100 feet before the sign", "حدود ۱۰۰ فوت قبل از تابلو"], ["Anywhere, as long as no traffic is coming", "هر جایی، به شرطی که ترافیکی نیاید"]], "a": 0, "x": "ترتیب محل توقف در فلوریدا: ۱) پشت خط ایست سفید؛ ۲) اگر نیست، قبل از خط عابر پیاده؛ ۳) اگر هیچ‌کدام نیست، قبل از ورود به تقاطع در نقطه‌ای که بتوانید ترافیک جاده متقاطع را ببینید. توقف وسط تقاطع راه را می‌بندد و ۱۰۰ فوت قبل از تابلو خیلی دور است و دید کافی نمی‌دهد. توقف کامل همیشه الزامی است."}, {"t": "row", "s": ["H5.15", "316.122"], "sg": null, "q": ["Two cars facing each other stop at a four-way stop at the same time. One wants to go straight and the other wants to turn left. Who goes first?", "دو خودرو روبه‌روی هم در ایست چهارطرفه هم‌زمان توقف می‌کنند. یکی می‌خواهد مستقیم برود و دیگری به چپ بپیچد. چه کسی اول می‌رود؟"], "o": [["The car going straight", "خودرویی که مستقیم می‌رود"], ["The car turning left", "خودرویی که به چپ می‌پیچد"], ["Whichever driver honks first", "هر کدام که زودتر بوق بزند"], ["Neither; both must wait for a third car", "هیچ‌کدام؛ هر دو باید منتظر خودروی سوم بمانند"]], "a": 0, "x": "راننده‌ای که به چپ می‌پیچد باید به ترافیک روبه‌رو که مستقیم می‌رود (یا به راست می‌پیچد) حق تقدم بدهد، چون مسیرش از جلوی آن‌ها عبور می‌کند. قاعده «سمت راست» برای خودروهایی است که عمود بر هم رسیده‌اند، نه روبه‌روی هم. بوق زدن حق تقدم ایجاد نمی‌کند."}, {"t": "row", "s": ["S2", "316.122"], "sg": null, "q": ["You are turning left into a driveway, crossing the oncoming lane. You must yield to:", "در حال گردش به چپ به داخل یک ورودی هستید و از خط مقابل عبور می‌کنید. به چه کسی باید حق تقدم بدهید؟"], "o": [["Oncoming vehicles and any pedestrians on the sidewalk", "خودروهای روبه‌رو و هر عابری که روی پیاده‌رو است"], ["No one, because you signaled", "هیچ‌کس، چون راهنما زده‌اید"], ["Only vehicles behind you", "فقط خودروهای پشت سر"], ["Only bicyclists", "فقط دوچرخه‌سواران"]], "a": 0, "x": "هر راننده‌ای که به چپ می‌پیچد (به تقاطع، کوچه یا ورودی) باید به خودروهای روبه‌رو که نزدیک هستند حق تقدم بدهد، و هنگام عبور از پیاده‌رو باید به عابران هم راه بدهد. راهنما زدن فقط قصد شما را اعلام می‌کند و حق تقدم نمی‌دهد. دوچرخه‌سواران در خط مقابل هم جزو ترافیک روبه‌رو هستند."}, {"t": "row", "s": ["S2"], "sg": null, "q": ["A school crossing guard signals you to stop. You must:", "مأمور عبور دانش‌آموزان به شما علامت توقف می‌دهد. چه باید بکنید؟"], "o": [["Stop and obey the guard's signal", "توقف کنید و از علامت مأمور پیروی کنید"], ["Follow the traffic light instead", "به‌جای آن از چراغ راهنمایی پیروی کنید"], ["Slow down, but continue if no children are in your lane", "سرعت را کم کنید، اما اگر کودکی در خط شما نیست ادامه دهید"], ["Stop only if the school-zone lights are flashing", "فقط اگر چراغ‌های منطقه مدرسه چشمک می‌زنند بایستید"]], "a": 0, "x": "دستور مأمور عبور مدرسه (Crossing Guard) باید اطاعت شود، حتی اگر با چراغ راهنمایی تفاوت داشته باشد. کودکان ممکن است ناگهان وارد خط شما شوند. وظیفه اطاعت از مأمور به روشن بودن چراغ‌های منطقه مدرسه بستگی ندارد."}, {"t": "row", "s": ["S2", "316.154", "316.155"], "sg": null, "q": ["When pulling out of a parallel parking space, you must:", "هنگام خارج شدن از جای پارک موازی، چه باید بکنید؟"], "o": [["Signal, check your mirrors and blind spot, and yield to approaching traffic", "راهنما بزنید، آینه‌ها و نقطه کور را بررسی کنید و به ترافیک در حال نزدیک شدن حق تقدم بدهید"], ["Pull out quickly; traffic must slow for you", "سریع خارج شوید؛ ترافیک باید برای شما سرعت کم کند"], ["Sound your horn and go", "بوق بزنید و حرکت کنید"], ["Pull out first, then signal", "اول خارج شوید، بعد راهنما بزنید"]], "a": 0, "x": "خودرویی که از حالت پارک وارد جریان ترافیک می‌شود حق تقدم ندارد و باید صبر کند تا بتواند بدون خطر وارد شود. راهنما را «قبل» از حرکت بزنید، آینه‌ها را نگاه کنید و حتماً سر خود را برای بررسی نقطه کور برگردانید. انتظار کم کردن سرعت از دیگران یا بوق زدن جایگزین این کارها نیست."}, {"t": "row", "s": ["S2", "316.130"], "sg": null, "q": ["A car in the lane next to you has stopped at a crosswalk. You should:", "خودروی خط کناری شما جلوی خط عابر پیاده توقف کرده است. چه باید بکنید؟"], "o": [["Stop too; never pass a vehicle stopped for pedestrians", "شما هم توقف کنید؛ هرگز از خودرویی که برای عابر ایستاده سبقت نگیرید"], ["Pass it carefully", "با احتیاط از کنارش رد شوید"], ["Honk to find out why it stopped", "بوق بزنید تا ببینید چرا ایستاده"], ["Change lanes and speed up", "خط عوض کنید و سرعت را زیاد کنید"]], "a": 0, "x": "بند 316.130: وقتی خودرویی جلوی خط عابر ایستاده تا عابری عبور کند، خودروهای پشت سر یا خط کناری نباید از آن سبقت بگیرند. خودروی متوقف ممکن است دید شما را نسبت به عابری که در حال عبور است بپوشاند و این وضعیت خطر جدی تصادف با عابر ایجاد می‌کند."}, {"t": "row", "s": ["S2", "316.072"], "sg": null, "q": ["A police officer is directing traffic at an intersection where your signal is green. The officer signals you to stop. You must:", "پلیسی در تقاطعی که چراغ شما سبز است ترافیک را هدایت می‌کند و به شما علامت توقف می‌دهد. چه باید بکنید؟"], "o": [["Stop; the officer's directions override the signal", "توقف کنید؛ دستور پلیس بر چراغ راهنمایی مقدم است"], ["Proceed because your light is green", "ادامه دهید چون چراغ شما سبز است"], ["Honk to get the officer's attention", "بوق بزنید تا توجه پلیس جلب شود"], ["Turn right to avoid the officer", "به راست بپیچید تا از پلیس دوری کنید"]], "a": 0, "x": "دستورهای افسر پلیس یا مأمور مجاز هدایت ترافیک بر همه تابلوها، چراغ‌ها و خط‌کشی‌ها مقدم است (بند 316.072). اگر چراغ سبز است ولی پلیس علامت توقف می‌دهد، باید بایستید. نادیده گرفتن دستور پلیس تخلف است."}, {"t": "row", "s": ["S2", "316.209"], "sg": null, "q": ["Motorcycles on the road:", "موتورسیکلت‌ها در جاده:"], "o": [["Are entitled to the full width of a lane", "حق استفاده از کل عرض یک خط را دارند"], ["Must ride on the shoulder", "باید روی شانه جاده حرکت کنند"], ["Must share a lane with cars when traffic is heavy", "وقتی ترافیک سنگین است باید خط را با خودروها شریک شوند"], ["Must yield to all cars", "باید به همه خودروها راه بدهند"]], "a": 0, "x": "طبق قانون فلوریدا (بند 316.209)، هر موتورسیکلت حق استفاده از «کل عرض» خط را دارد و هیچ خودرویی نباید طوری رانده شود که این حق را از آن بگیرد. پس نباید کنار موتورسیکلت در همان خط برانید. موتورسیکلت‌ها مانند سایر وسایل نقلیه تابع قوانین حق تقدم‌اند و مجبور به حرکت روی شانه نیستند."}, {"t": "speed", "s": ["H5.11", "316.187"], "sg": null, "q": ["According to the Florida Driver Handbook's speed-limit table, the maximum speed on limited-access highways (such as the Florida Turnpike) is:", "طبق جدول حد سرعت کتابچه رانندگی فلوریدا، حداکثر سرعت در بزرگراه‌های با دسترسی محدود (مانند Florida Turnpike) چقدر است؟"], "o": [["55 mph", "۵۵ مایل در ساعت"], ["60 mph", "۶۰ مایل در ساعت"], ["65 mph", "۶۵ مایل در ساعت"], ["70 mph", "۷۰ مایل در ساعت"]], "a": 3, "x": "جدول کتابچه رسمی فلوریدا: بزرگراه‌های با دسترسی محدود (ورود و خروج فقط از رمپ‌ها، مثل Turnpike) و بین‌ایالتی روستایی = ۷۰ مایل در ساعت. ۵۵ پیش‌فرض سایر جاده‌هاست. همیشه از تابلوی نصب‌شده پیروی کنید، چون ممکن است در بخش‌های شهری کمتر باشد."}, {"t": "speed", "s": ["S11"], "sg": null, "q": ["If you drive so slowly on a highway that you block the normal flow of traffic:", "اگر در بزرگراه آن‌قدر آهسته برانید که جریان عادی ترافیک را مسدود کنید:"], "o": [["You can be ticketed; minimum speed laws prevent blocking traffic", "ممکن است جریمه شوید؛ قوانین حداقل سرعت برای جلوگیری از مسدود کردن ترافیک است"], ["Nothing happens; driving slowly is always legal", "اتفاقی نمی‌افتد؛ آهسته راندن همیشه قانونی است"], ["Only truck drivers can be ticketed", "فقط رانندگان کامیون جریمه می‌شوند"], ["You can be ticketed only in the right lane", "فقط در خط راست ممکن است جریمه شوید"]], "a": 0, "x": "بند 316.183 (بند ۵) می‌گوید هیچ‌کس نباید آن‌قدر آهسته براند که حرکت عادی و معقول ترافیک را مختل کند (مگر برای ایمنی لازم باشد). اختلاف سرعت زیاد به اندازه سرعت زیاد خطرناک است. اگر مجبورید آهسته برانید، در خط راست بمانید. این قانون برای همه رانندگان است."}, {"t": "speed", "s": ["H5.11"], "sg": null, "q": ["If you double your speed (for example, from 30 mph to 60 mph), your braking distance becomes about:", "اگر سرعت خود را دو برابر کنید (مثلاً از ۳۰ به ۶۰ مایل در ساعت)، مسافت ترمزگیری شما تقریباً چند برابر می‌شود؟"], "o": [["Four times as long", "چهار برابر"], ["Twice as long", "دو برابر"], ["The same", "بدون تغییر"], ["Half as long", "نصف"]], "a": 0, "x": "کتابچه می‌گوید با دو برابر شدن سرعت، نیروی برخورد چهار برابر می‌شود. به همین دلیل فیزیکی (انرژی حرکتی خودرو با «مجذور» سرعت افزایش می‌یابد)، مسافت ترمز هم تقریباً چهار برابر می‌شود، به‌علاوه مسافت بیشتری که در زمان واکنش طی می‌کنید. پس سرعت کمی بیشتر، مسافت توقف را خیلی بیشتر می‌کند. «دو برابر» اشتباه رایج است و «بدون تغییر» یا «نصف» کاملاً نادرست‌اند."}, {"t": "speed", "s": ["322.27"], "sg": null, "q": ["A conviction for speeding MORE than 15 mph over the limit adds how many points to your driving record?", "محکومیت برای سرعت «بیش از» ۱۵ مایل در ساعت بالاتر از حد مجاز، چند امتیاز منفی به سابقه رانندگی اضافه می‌کند؟"], "o": [["2 points", "۲ امتیاز"], ["3 points", "۳ امتیاز"], ["4 points", "۴ امتیاز"], ["6 points", "۶ امتیاز"]], "a": 2, "x": "بند 322.27: سرعت بیش از ۱۵ مایل در ساعت بالاتر از حد مجاز = ۴ امتیاز؛ سرعت تا ۱۵ مایل در ساعت بالاتر = ۳ امتیاز. ۶ امتیاز برای مواردی مانند سرعت غیرمجاز منجر به تصادف یا ترک صحنه تصادف با خسارت بیش از ۵۰ دلار است. امتیازها روی هم جمع می‌شوند و می‌توانند به تعلیق گواهینامه منجر شوند."}, {"t": "parking", "s": ["S12"], "sg": null, "q": ["On the same side of the street, you may not park within how many feet of a fire station driveway entrance?", "در همان سمت خیابان، در چه فاصله‌ای از ورودی ایستگاه آتش‌نشانی پارک کردن ممنوع است؟"], "o": [["10 feet", "۱۰ فوت"], ["15 feet", "۱۵ فوت"], ["20 feet", "۲۰ فوت"], ["50 feet", "۵۰ فوت"]], "a": 2, "x": "بند 316.1945: پارک در ۲۰ فوتی ورودی ایستگاه آتش‌نشانی ممنوع است؛ و در سمت مقابل خیابان، اگر تابلو نصب شده باشد، تا ۷۵ فوت روبه‌روی ورودی. ۱۵ فوت مربوط به شیر آتش‌نشانی و ۵۰ فوت مربوط به ریل راه‌آهن است."}, {"t": "parking", "s": ["S2"], "sg": null, "q": ["When parking UPHILL next to a curb, turn your front wheels:", "هنگام پارک در «سربالایی» کنار جدول، چرخ‌های جلو را به کدام سمت بچرخانید؟"], "o": [["Away from the curb (to the left)", "دور از جدول (به چپ)"], ["Toward the curb (to the right)", "به سمت جدول (به راست)"], ["Straight ahead", "مستقیم"], ["Toward the right edge, as if there were no curb", "به سمت لبه راست، مثل اینکه جدولی نیست"]], "a": 0, "x": "در سربالایی با جدول، چرخ‌ها را «دور از جدول» (به چپ) بچرخانید و خودرو را کمی عقب بیاورید تا پشت چرخ جلو به جدول تکیه کند؛ اگر ترمز رها شود، جدول مانع عقب رفتن خودرو می‌شود. چرخاندن به سمت جدول برای «سراشیبی» است. در سربالایی «بدون» جدول، چرخ‌ها را به سمت لبه راست جاده بچرخانید."}, {"t": "parking", "s": ["316.1975"], "sg": null, "q": ["Before leaving your vehicle unattended, Florida law requires you to:", "قبل از اینکه خودرو را بدون سرنشین رها کنید، قانون فلوریدا شما را موظف به چه کاری می‌کند؟"], "o": [["Stop the engine, lock the ignition, and remove the key", "موتور را خاموش کنید، سوئیچ را قفل کنید و کلید را بردارید"], ["Nothing, if you will be gone less than 5 minutes", "اگر کمتر از ۵ دقیقه دور هستید، کاری لازم نیست"], ["Only lock the doors", "فقط درها را قفل کنید"], ["Turn on the hazard lights", "فلاشرها را روشن کنید"]], "a": 0, "x": "بند 316.1975: راننده نباید خودرو را بدون سرنشین رها کند مگر اینکه موتور را خاموش، سوئیچ را قفل و کلید را برداشته باشد؛ و اگر خودرو روی هر شیبی است، باید ترمز دستی را هم بکشد و چرخ‌های جلو را به سمت جدول یا کنار جاده بچرخاند. کوتاه بودن زمان توقف استثنا ایجاد نمی‌کند. قفل کردن درها یا روشن کردن فلاشر به‌تنهایی کافی نیست."}, {"t": "dui", "s": ["S7"], "sg": null, "q": ["For a FIRST DUI conviction (BAC under 0.15, no minor in the vehicle), the maximum jail sentence is:", "برای «اولین» محکومیت DUI (الکل خون کمتر از ۰.۱۵ و بدون کودک در خودرو)، حداکثر مدت زندان چقدر است؟"], "o": [["30 days", "۳۰ روز"], ["3 months", "۳ ماه"], ["6 months", "۶ ماه"], ["1 year", "۱ سال"]], "a": 2, "x": "طبق جدول FLHSMV، حداکثر زندان برای اولین محکومیت DUI شش ماه است. اگر الکل خون ۰.۱۵ یا بیشتر باشد یا کودکی در خودرو باشد، حداکثر به ۹ ماه می‌رسد. برای محکومیت دوم حداکثر ۹ ماه است (یا ۱۲ ماه اگر الکل خون ۰.۱۵ یا بیشتر باشد یا کودکی در خودرو باشد). علاوه بر آن: جریمه ۵۰۰ تا ۱۰۰۰ دلار، ۵۰ ساعت خدمات اجتماعی و حداقل ۱۸۰ روز لغو گواهینامه."}, {"t": "dui", "s": ["316.193"], "sg": null, "q": ["A first-time DUI offender with a BAC of 0.15 or higher must have an ignition interlock device installed for at least:", "فردی که اولین بار به DUI با الکل خون ۰.۱۵ یا بیشتر محکوم شده، باید دستگاه قفل احتراق (Ignition Interlock) را دست‌کم چه مدت نصب کند؟"], "o": [["30 days", "۳۰ روز"], ["3 months", "۳ ماه"], ["6 months", "۶ ماه"], ["2 years", "۲ سال"]], "a": 2, "x": "قانون فلوریدا برای اولین محکومیت DUI با الکل خون ۰.۱۵ یا بیشتر (یا با کودک در خودرو)، نصب دستگاه قفل احتراق را دست‌کم ۶ ماه الزامی می‌کند. این دستگاه پیش از روشن شدن خودرو، تنفس راننده را آزمایش می‌کند. مدت‌های طولانی‌تر (مثل ۱ یا ۲ سال) برای محکومیت‌های بعدی است."}, {"t": "dui", "s": ["316.193", "H4.6"], "sg": null, "q": ["Florida's DUI law applies to driving while impaired by:", "قانون DUI فلوریدا شامل رانندگی تحت تأثیر چه چیزهایی می‌شود؟"], "o": [["Alcohol or controlled substances, including prescription drugs, when your normal faculties are impaired", "الکل یا مواد کنترل‌شده، از جمله داروهای تجویزی، وقتی توانایی‌های عادی شما مختل شده باشد"], ["Alcohol only", "فقط الکل"], ["Illegal drugs only", "فقط مواد مخدر غیرقانونی"], ["Alcohol only when BAC is 0.15 or above", "فقط الکل وقتی میزان آن ۰.۱۵ یا بیشتر باشد"]], "a": 0, "x": "بند 316.193: DUI یعنی رانندگی تحت تأثیر نوشیدنی الکلی، مواد شیمیایی مشخص‌شده (مثل مواد استنشاقی) یا مواد کنترل‌شده، به میزانی که توانایی‌های عادی مختل شود. کتابچه تصریح می‌کند مواد کنترل‌شده شامل داروهای تجویزی، آرام‌بخش‌ها، محرک‌ها، مخدرها و مواد استنشاقی است. داروهای بدون نسخه (مثل داروی سرماخوردگی یا آلرژی) هم ممکن است خواب‌آلودگی ایجاد کنند، پس در این حالت رانندگی نکنید. «فقط الکل» یا «فقط مواد غیرقانونی» نادرست است و ۰.۱۵ حد شروع DUI نیست؛ حد بزرگسالان ۰.۰۸ است."}, {"t": "dui", "s": ["https://www.lowestpricetrafficschool.com/handbooks/cdl/en/2/22"], "sg": null, "q": ["Which drink contains about the same amount of alcohol as one 12-ounce can of regular beer?", "کدام نوشیدنی تقریباً همان مقدار الکل یک قوطی ۱۲ اونسی آبجوی معمولی را دارد؟"], "o": [["A 5-ounce glass of wine or a 1.5-ounce shot of 80-proof liquor", "یک لیوان ۵ اونسی شراب یا یک پیک ۱.۵ اونسی مشروب ۴۰ درصد"], ["A 12-ounce glass of wine", "یک لیوان ۱۲ اونسی شراب"], ["Half a can of beer", "نصف قوطی آبجو"], ["Three ounces of liquor", "سه اونس مشروب قوی"]], "a": 0, "x": "کتابچه رسمی CDL فلوریدا (بخش ۲.۲۲): این نوشیدنی‌ها مقدار الکل برابری دارند: ۱۲ اونس آبجوی ۵٪ ≈ ۵ اونس شراب ۱۲٪ ≈ ۱.۵ اونس مشروب ۸۰ پروف (۴۰٪). پس نوع نوشیدنی مهم نیست، مقدار الکل مهم است. ۱۲ اونس شراب حدود ۲.۵ نوشیدنی و ۳ اونس مشروب قوی حدود ۲ نوشیدنی است."}, {"t": "dui", "s": ["322.2616", "S7"], "sg": null, "q": ["A driver under 21 found with a BAC of 0.02 or higher for the FIRST time will have their license suspended for:", "راننده زیر ۲۱ سال که برای «اولین» بار با الکل خون ۰.۰۲ یا بیشتر شناسایی شود، گواهینامه‌اش چه مدت تعلیق می‌شود؟"], "o": [["30 days", "۳۰ روز"], ["3 months", "۳ ماه"], ["6 months", "۶ ماه"], ["2 years", "۲ سال"]], "a": 2, "x": "بند 322.2616 (تحمل صفر): اولین بار = تعلیق ۶ ماهه؛ اگر قبلاً تعلیق شده باشد = ۱ سال. اگر میزان ۰.۰۵ یا بیشتر باشد، تعلیق تا گذراندن ارزیابی و دوره سوءمصرف مواد ادامه دارد. امتناع از آزمایش هم ۱ سال (بار اول) تعلیق دارد."}, {"t": "license", "s": ["S4"], "sg": null, "q": ["A 17-year-old with a Class E license may NOT drive between:", "یک نوجوان ۱۷ ساله با گواهینامه کلاس E، بین چه ساعاتی «نمی‌تواند» رانندگی کند؟"], "o": [["1 a.m. and 5 a.m., unless with a licensed driver 21+ or driving to or from work", "۱ بامداد تا ۵ صبح، مگر همراه راننده دارای گواهینامه ۲۱ سال به بالا یا در مسیر رفت‌وبرگشت کار"], ["11 p.m. and 6 a.m.", "۱۱ شب تا ۶ صبح"], ["Midnight and 5 a.m.", "نیمه‌شب تا ۵ صبح"], ["10 p.m. and 6 a.m.", "۱۰ شب تا ۶ صبح"]], "a": 0, "x": "راننده ۱۷ ساله: رانندگی از ۱ بامداد تا ۵ صبح ممنوع است، مگر با راننده ۲۱ سال به بالا یا برای رفتن به کار و برگشتن از آن. «۱۱ شب تا ۶ صبح» محدودیت راننده ۱۶ ساله است. «۱۰ شب» محدودیت گواهینامه آموزشی بعد از ۳ ماه اول است."}, {"t": "license", "s": ["S4", "322.161"], "sg": null, "q": ["A driver under 18 who accumulates 6 or more points within 12 months will:", "راننده زیر ۱۸ سال که ظرف ۱۲ ماه ۶ امتیاز منفی یا بیشتر جمع کند، چه وضعیتی پیدا می‌کند؟"], "o": [["Be restricted to driving for business purposes only for one year (or until 18)", "به مدت یک سال (یا تا ۱۸ سالگی) فقط برای «اهداف کاری» مجاز به رانندگی است"], ["Have their license permanently revoked", "گواهینامه‌اش برای همیشه لغو می‌شود"], ["Receive only a warning letter", "فقط یک نامه هشدار دریافت می‌کند"], ["Have to retake the knowledge exam", "باید دوباره آزمون دانش را بدهد"]], "a": 0, "x": "رانندگان زیر ۱۸ سال که در ۱۲ ماه ۶ امتیاز یا بیشتر بگیرند، گواهینامه‌شان به مدت ۱ سال یا تا ۱۸ سالگی به «Business Purposes Only» محدود می‌شود؛ و برای هر امتیاز اضافه در این مدت، محدودیت ۹۰ روز تمدید می‌شود. لغو دائمی یا فقط هشدار نادرست است."}, {"t": "license", "s": ["322.27"], "sg": null, "q": ["Accumulating 12 points within 12 months results in a license suspension of:", "جمع کردن ۱۲ امتیاز منفی ظرف ۱۲ ماه، چه مدت تعلیق گواهینامه در پی دارد؟"], "o": [["Up to 30 days", "حداکثر ۳۰ روز"], ["Up to 3 months", "حداکثر ۳ ماه"], ["Up to 6 months", "حداکثر ۶ ماه"], ["Up to 1 year", "حداکثر ۱ سال"]], "a": 0, "x": "بند 322.27 (سیستم امتیاز): ۱۲ امتیاز در ۱۲ ماه = تعلیق حداکثر ۳۰ روز؛ ۱۸ امتیاز در ۱۸ ماه = حداکثر ۳ ماه؛ ۲۴ امتیاز در ۳۶ ماه = حداکثر ۱ سال. ۳ ماه و ۱ سال مربوط به سطوح بالاتر امتیاز هستند و ۶ ماه در جدول امتیاز نیست."}, {"t": "license", "s": ["322.095", "H2.7", "https://www.hillstaxfl.gov/news/new-driver-education-requirements-for-teen-drivers-begin-july-1-2025/"], "sg": null, "q": ["A person aged 18 or older who has never held a driver license in any state or country must complete which course before applying for a Florida learner's license?", "فردی ۱۸ ساله یا بزرگ‌تر که هرگز در هیچ ایالت یا کشوری گواهینامه نداشته، قبل از درخواست گواهینامه آموزشی فلوریدا باید کدام دوره را بگذراند؟"], "o": [["A 4-hour Traffic Law and Substance Abuse Education (TLSAE) course", "دوره ۴ ساعته «آموزش قوانین ترافیک و سوءمصرف مواد» (TLSAE)"], ["A 40-hour defensive driving course", "دوره ۴۰ ساعته رانندگی تدافعی"], ["A commercial driver license (CDL) course", "دوره گواهینامه رانندگی تجاری (CDL)"], ["No course; only the exams", "هیچ دوره‌ای؛ فقط آزمون‌ها"]], "a": 0, "x": "طبق بند 322.095، متقاضی ۱۸ سال به بالا که قبلاً در هیچ ایالت یا کشوری گواهینامه نداشته باید دوره TLSAE (حدود ۴ ساعت) را بگذراند؛ از ۱ اوت ۲۰۲۵ دوره ۶ ساعته DETS برای متقاضیان زیر ۱۸ سال اجباری است و به گفته Tax Collector هیلزبورو، متقاضیان ۱۸ سال به بالا همچنان دوره ۴ ساعته TLSAE را می‌گذرانند. طبق راهنمای ساکنان جدید Tax Collector هیلزبورو، اگر گواهینامه کشور خود را ارائه کنید، این دوره لازم نیست. نتیجه دوره به‌صورت الکترونیکی برای FLHSMV ارسال می‌شود."}, {"t": "license", "s": ["S13", "S23"], "sg": null, "q": ["As of 2026, in what language is the Class E Knowledge Exam given in Florida, including at the Hillsborough County Tax Collector?", "از سال ۲۰۲۶، آزمون دانش کلاس E در فلوریدا (از جمله در Tax Collector شهرستان هیلزبورو) به چه زبانی برگزار می‌شود؟"], "o": [["English only; translation devices and services are not permitted", "فقط انگلیسی؛ استفاده از دستگاه یا خدمات ترجمه مجاز نیست"], ["Any language, using a handheld translator", "هر زبانی، با دستگاه ترجمه دستی"], ["English or Spanish", "انگلیسی یا اسپانیایی"], ["English, Spanish, or Haitian Creole", "انگلیسی، اسپانیایی یا کریول هائیتی"]], "a": 0, "x": "طبق اطلاعیه رسمی FLHSMV (۳۰ ژانویه ۲۰۲۶) و Tax Collector هیلزبورو، از ۶ فوریه ۲۰۲۶ همه آزمون‌های دانش و رانندگی در فلوریدا «فقط به زبان انگلیسی» برگزار می‌شوند و دستگاه‌ها یا خدمات ترجمه برای آزمون کتبی و عملی مجاز نیستند. پیش از این، آزمون به چند زبان دیگر (از جمله اسپانیایی و کریول هائیتی) و با مترجم هم ممکن بود، پس گزینه‌های دیگر مربوط به قوانین قدیمی‌اند."}, {"t": "safe", "s": ["S8"], "sg": null, "q": ["To register a vehicle in Florida, you must carry at least:", "برای ثبت خودرو در فلوریدا، حداقل چه بیمه‌ای باید داشته باشید؟"], "o": [["$10,000 Personal Injury Protection (PIP) and $10,000 Property Damage Liability (PDL)", "۱۰٬۰۰۰ دلار بیمه حوادث شخصی (PIP) و ۱۰٬۰۰۰ دلار بیمه مسئولیت خسارت مالی (PDL)"], ["$25,000 / $50,000 bodily injury liability only", "فقط بیمه مسئولیت جانی ۲۵٬۰۰۰ / ۵۰٬۰۰۰ دلار"], ["$5,000 PIP only", "فقط ۵٬۰۰۰ دلار PIP"], ["No insurance is required", "هیچ بیمه‌ای لازم نیست"]], "a": 0, "x": "طبق صفحه رسمی بیمه FLHSMV، هر خودروی ثبت‌شده در فلوریدا باید دست‌کم ۱۰٬۰۰۰ دلار PIP و ۱۰٬۰۰۰ دلار PDL از یک شرکت بیمه دارای مجوز فلوریدا داشته باشد. لایحه‌های حذف PIP در سال‌های ۲۰۲۵ و ۲۰۲۶ تصویب نشدند، پس این الزام هنوز برقرار است. نداشتن بیمه باعث تعلیق گواهینامه و پلاک و هزینه بازگشت تا ۵۰۰ دلار می‌شود."}, {"t": "safe", "s": ["316.063"], "sg": null, "q": ["You hit a parked, unattended car and cannot find the owner. You must:", "به یک خودروی پارک‌شده بدون سرنشین برخورد کرده‌اید و مالک را پیدا نمی‌کنید. چه باید بکنید؟"], "o": [["Stop, leave a secure note in a visible place with your name, address, and vehicle registration number, and notify the police", "توقف کنید، یادداشتی با نام، نشانی و شماره ثبت (پلاک) خودروی خود در جای قابل‌دید محکم کنید و به پلیس اطلاع دهید"], ["Leave without doing anything if the damage is minor", "اگر خسارت جزئی است، بدون هیچ کاری بروید"], ["Wait 10 minutes, then leave", "۱۰ دقیقه صبر کنید و بعد بروید"], ["Only notify your insurance company", "فقط به شرکت بیمه خود اطلاع دهید"]], "a": 0, "x": "بند 316.063: اگر به خودروی بدون سرنشین آسیب زدید، باید فوراً توقف کنید و یا مالک را پیدا کنید، یا یادداشتی با نام و نشانی خود و شماره ثبت (پلاک) خودرویی که می‌رانید در جایی محکم و قابل‌دید روی آن خودرو بگذارید، و بی‌درنگ به پلیس اطلاع دهید. ترک محل بدون این کارها «فرار از صحنه» محسوب می‌شود، حتی با خسارت جزئی."}, {"t": "safe", "s": ["316.061"], "sg": null, "q": ["After a minor crash with no injuries, where the cars can still be driven, you should:", "پس از یک تصادف جزئی بدون مصدوم که خودروها هنوز قابل حرکت‌اند، چه باید بکنید؟"], "o": [["Move the vehicles out of the travel lanes to a safe place", "خودروها را از خطوط عبور به جای امن منتقل کنید"], ["Leave the cars exactly where they are until police arrive", "خودروها را دقیقاً همان‌جا بگذارید تا پلیس برسد"], ["Drive away if the other driver agrees", "اگر راننده دیگر موافق است، محل را ترک کنید"], ["Stay parked in the travel lane with hazard lights on", "با فلاشر روشن در خط عبور بمانید"]], "a": 0, "x": "قانون «Move It» فلوریدا (بند 316.061): اگر کسی آسیب ندیده و خودروها قابل حرکت‌اند، باید آن‌ها را از خطوط اصلی به شانه یا جای امن منتقل کنید تا ترافیک مسدود نشود و تصادف دوم رخ ندهد؛ جابه‌جا کردن خودرو به معنای پذیرش تقصیر نیست. ترک محل پیش از تبادل اطلاعات (نام، نشانی، شماره پلاک، گواهینامه و بیمه) غیرقانونی است."}, {"t": "safe", "s": ["316.6135"], "sg": null, "q": ["Under Florida law, a child under 6 may not be left unattended in a motor vehicle for more than:", "طبق قانون فلوریدا، کودک زیر ۶ سال را نمی‌توان بیش از چه مدت بدون مراقب در خودرو رها کرد؟"], "o": [["15 minutes, or for any time if the engine is running or the child's health is in danger", "۱۵ دقیقه، یا هر مدتی اگر موتور روشن باشد یا سلامت کودک در خطر باشد"], ["30 minutes", "۳۰ دقیقه"], ["1 hour", "۱ ساعت"], ["5 minutes if the windows are open", "۵ دقیقه اگر پنجره‌ها باز باشند"]], "a": 0, "x": "بند 316.6135: رها کردن کودک زیر ۶ سال بدون مراقب در خودرو بیش از ۱۵ دقیقه ممنوع است؛ و اگر موتور روشن باشد یا سلامت کودک در خطر باشد، حتی برای یک لحظه هم ممنوع است. در گرمای فلوریدا دمای داخل خودرو در چند دقیقه به حد خطرناک می‌رسد و باز بودن پنجره تأثیر کمی دارد."}, {"t": "safe", "s": ["S10", "316.306"], "sg": null, "q": ["In a designated school zone, school crossing, or active work zone, using a phone:", "در منطقه مدرسه، گذرگاه دانش‌آموزان یا منطقه کار فعال، استفاده از گوشی:"], "o": [["In a handheld manner is illegal; hands-free use is allowed", "به‌صورت دستی (در دست گرفتن) غیرقانونی است؛ استفاده بدون دست (هندزفری) مجاز است"], ["Is legal if traffic is light", "اگر ترافیک کم است قانونی است"], ["Is legal for calls but not for texting", "برای تماس قانونی است ولی برای پیامک نه"], ["Is illegal only for drivers under 18", "فقط برای رانندگان زیر ۱۸ سال غیرقانونی است"]], "a": 0, "x": "بند 316.306: در مناطق مدرسه، گذرگاه مدرسه و مناطق کار فعال، هر نوع استفاده «دستی» از گوشی (حتی تماس تلفنی با گوشی در دست) ممنوع است و تخلف رانندگی با ۳ امتیاز منفی است. فقط استفاده بدون دست (بلوتوث، فرمان صوتی) مجاز است. این قانون برای همه سنین است."}, {"t": "safe", "s": ["H5.7", "https://www.flhsmv.gov/florida-highway-patrol/contact-fhp/star-fhp/"], "sg": null, "q": ["An aggressive driver is honking and gesturing at you. You should:", "یک راننده پرخاشگر به شما بوق می‌زند و اشاره‌های ناشایست می‌کند. چه باید بکنید؟"], "o": [["Stay calm, avoid eye contact, and give them room", "آرام بمانید، از تماس چشمی خودداری کنید و به او فضا بدهید"], ["Brake suddenly to teach them a lesson", "ناگهان ترمز کنید تا درس بگیرد"], ["Gesture back", "متقابلاً اشاره کنید"], ["Speed up so they cannot pass", "سرعت را زیاد کنید تا نتواند سبقت بگیرد"]], "a": 0, "x": "کتابچه فلوریدا توصیه می‌کند با رانندگان پرخاشگر درگیر نشوید: آرام بمانید، از حرکات توهین‌آمیز پرهیز کنید، برای ترافیک سریع‌تر راه باز کنید و رانندگی پرخاشگرانه را به پلیس گزارش دهید. FLHSMV شماره *FHP (*347) یا ۹۱۱ را برای گزارش معرفی می‌کند. بهتر است به چشمان راننده پرخاشگر نگاه نکنید و اگر احساس خطر کردید به یک محل عمومی بروید. ترمز ناگهانی، مقابله به مثل یا مسابقه، خطر تصادف و خشونت را بیشتر می‌کند."}, {"t": "safe", "s": ["S2"], "sg": null, "q": ["A driver's left arm extended straight DOWN (palm facing back) means the driver is:", "دست چپ راننده که مستقیم رو به «پایین» گرفته شده (کف دست رو به عقب)، به چه معناست؟"], "o": [["Slowing down or stopping", "در حال کم کردن سرعت یا توقف است"], ["Turning left", "به چپ می‌پیچد"], ["Turning right", "به راست می‌پیچد"], ["Waving you to pass", "به شما اشاره می‌کند سبقت بگیرید"]], "a": 0, "x": "علائم دستی از پنجره سمت چپ: دست افقی و مستقیم = گردش به چپ؛ دست رو به بالا (آرنج خم) = گردش به راست؛ دست رو به پایین = کم کردن سرعت یا توقف. این علائم وقتی چراغ‌های راهنما یا ترمز کار نمی‌کنند مهم‌اند. علامت دستی برای اجازه سبقت وجود ندارد."}, {"t": "safe", "s": ["S2", "316.155"], "sg": null, "q": ["You should signal a turn continuously for at least how far before turning?", "دست‌کم از چه فاصله‌ای قبل از گردش باید به‌طور مداوم راهنما بزنید؟"], "o": [["50 feet", "۵۰ فوت"], ["100 feet", "۱۰۰ فوت"], ["200 feet", "۲۰۰ فوت"], ["500 feet", "۵۰۰ فوت"]], "a": 1, "x": "بند 316.155 و کتابچه فلوریدا: راهنما را دست‌کم در ۱۰۰ فوت آخر (حدود ۳۰ متر) پیش از گردش به‌طور مداوم بزنید تا دیگران وقت واکنش داشته باشند. ۵۰ فوت کافی نیست. ۲۰۰ و ۵۰۰ فوت الزام قانونی نیستند و راهنمای خیلی زودهنگام ممکن است دیگران را گیج کند (مثلاً فکر کنند در تقاطع قبلی می‌پیچید)."}, {"t": "emergency", "s": ["S2"], "sg": null, "q": ["A vehicle is coming toward you in your lane. You should:", "خودرویی در خط شما، رو به شما در حال حرکت است. چه باید بکنید؟"], "o": [["Slow down, sound your horn, and steer to the right", "سرعت را کم کنید، بوق بزنید و به سمت راست بپیچید"], ["Steer left into the other lane", "به چپ و به خط دیگر بپیچید"], ["Speed up", "سرعت را زیاد کنید"], ["Stop in your lane and wait", "در خط خود بایستید و منتظر بمانید"]], "a": 0, "x": "کتابچه فلوریدا: بوق بزنید، ترمز محکم بگیرید و به سمت کنار جاده (در صورت لزوم حتی شانه یا خارج از جاده) بروید؛ یعنی به سمت «راست». اگر به چپ بروید، ممکن است راننده مقابل هم هم‌زمان به خط خود برگردد و تصادف رودررو رخ دهد. افزایش سرعت یا توقف در خط، شدت برخورد را بیشتر یا اجتناب‌ناپذیر می‌کند."}, {"t": "emergency", "s": ["S2"], "sg": null, "q": ["If your right wheels drop off the pavement onto the shoulder, you should:", "اگر چرخ‌های سمت راست از آسفالت خارج و روی شانه جاده بیفتند، چه باید بکنید؟"], "o": [["Ease off the gas, hold the wheel firmly, and steer back gently when it is safe", "پا را از گاز بردارید، فرمان را محکم بگیرید و وقتی امن شد به‌آرامی به جاده برگردید"], ["Jerk the wheel to get back on the road immediately", "فرمان را ناگهان بچرخانید تا فوراً به جاده برگردید"], ["Brake hard", "ترمز شدید بگیرید"], ["Accelerate to climb back onto the pavement", "گاز بدهید تا به آسفالت برگردید"]], "a": 0, "x": "فرمان را محکم نگه دارید، روی شانه مستقیم ادامه دهید، آرام از گاز پا بردارید و بعد از کاهش سرعت و بررسی ترافیک، به‌آرامی به جاده برگردید. چرخاندن ناگهانی فرمان باعث می‌شود خودرو به خط مقابل پرتاب شود یا واژگون شود. ترمز شدید یا گاز دادن هم کنترل را از بین می‌برد."}, {"t": "special", "s": ["S9", "316.613"], "sg": null, "q": ["Florida law requires children aged 3 and younger to ride in:", "قانون فلوریدا کودکان ۳ سال و کوچک‌تر را ملزم می‌کند در چه چیزی سفر کنند؟"], "o": [["A separate child carrier or the vehicle manufacturer's integrated child seat", "صندلی کودک جداگانه یا صندلی کودک یکپارچه کارخانه‌ای خودرو"], ["A booster seat or a seat belt", "بوستر یا کمربند ایمنی"], ["A seat belt only", "فقط کمربند ایمنی"], ["Any seat, if an adult holds them", "هر صندلی، اگر یک بزرگسال آن‌ها را بغل کند"]], "a": 0, "x": "طبق FLHSMV و بند 316.613: کودکان ۰ تا ۳ سال باید در صندلی کودک جداگانه یا صندلی یکپارچه کارخانه‌ای باشند. کودکان ۴ و ۵ سال می‌توانند در صندلی کودک، صندلی یکپارچه یا «بوستر» باشند. بغل کردن کودک در تصادف هرگز محافظت نمی‌کند. FLHSMV توصیه می‌کند کودکان تا دست‌کم ۱۲ سالگی در صندلی عقب بنشینند."}], [{"t": "signs", "s": ["S2"], "sg": {"k": "oneway"}, "q": ["A black-and-white rectangular sign like this, with an arrow and the words ‘ONE WAY’, means:", "تابلوی مستطیل سیاه و سفید مانند این، با فلش و نوشته «ONE WAY»، به چه معناست؟"], "o": [["Traffic on this street moves only in the direction of the arrow", "ترافیک این خیابان فقط در جهت فلش حرکت می‌کند"], ["You must turn in the direction of the arrow
