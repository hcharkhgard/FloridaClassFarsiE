<style>
:root{
  --bg:#EEF2EF; --surface:#FFFFFF; --surface2:#F6F8F6; --ink:#15201A; --muted:#56655D; --line:#D5DDD8;
  --guide:#0A6B47; --guide-ink:#FFFFFF; --amber:#E9A800; --amber-soft:#FFF4D1;
  --ok:#1E7A3C; --ok-soft:#E3F3E7; --bad:#B42318; --bad-soft:#FBE7E5; --focus:#E9A800;
  --en:"Overpass", "Segoe UI", system-ui, sans-serif;
  --fa:"Vazirmatn", "Tahoma", "Segoe UI", sans-serif;
  --mono:"Overpass Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1411; --surface:#161F1A; --surface2:#1C2620; --ink:#E6EEE9; --muted:#9BABA2; --line:#2B3831;
    --guide:#0F7A52; --guide-ink:#FFFFFF; --amber:#F2BE2E; --amber-soft:#3A3014;
    --ok:#58C27D; --ok-soft:#173222; --bad:#F2877D; --bad-soft:#3A1B18; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1411; --surface:#161F1A; --surface2:#1C2620; --ink:#E6EEE9; --muted:#9BABA2; --line:#2B3831;
  --guide:#0F7A52; --guide-ink:#FFFFFF; --amber:#F2BE2E; --amber-soft:#3A3014;
  --ok:#58C27D; --ok-soft:#173222; --bad:#F2877D; --bad-soft:#3A1B18; color-scheme: dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--en);font-size:16px;line-height:1.5;margin:0}
.wrap{max-width:820px;margin:0 auto;padding-inline:16px;padding-block:0 64px}
.fa{font-family:var(--fa);direction:rtl;text-align:right;line-height:1.85}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
a{color:var(--guide)}
:root:not([data-theme="light"]) a{color:inherit}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) a{color:#7FD9AE}}
:root[data-theme="dark"] a{color:#7FD9AE}

/* guide-sign header */
.sign-head{background:var(--guide);color:var(--guide-ink);border-radius:0 0 14px 14px;padding:18px 20px 16px;margin-bottom:20px;
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.9), inset 0 0 0 6px var(--guide)}
.sign-head .route{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.shield{background:#fff;color:var(--guide);font-weight:800;font-size:13px;letter-spacing:.08em;padding:3px 9px;border-radius:4px}
.sign-head h1{font-size:clamp(24px,5vw,34px);line-height:1.1;margin:8px 0 2px;font-weight:800;letter-spacing:.01em;text-wrap:balance}
.sign-head .sub{font-size:14px;opacity:.92}
.sign-head .sub.fa{font-size:14px;margin-top:2px}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
nav.tabs button{background:transparent;border:1.5px solid rgba(255,255,255,.55);color:#fff;border-radius:999px;padding:5px 14px;font-size:14px;font-weight:600}
nav.tabs button[aria-current="true"]{background:#fff;color:var(--guide);border-color:#fff}

h2{font-size:22px;margin:28px 0 10px;text-wrap:balance}
h3{font-size:17px;margin:0 0 6px}
.lede{color:var(--muted);max-width:65ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.stack{display:flex;flex-direction:column;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.eyebrow{font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted)}

.test-card{display:flex;flex-direction:column;gap:10px}
.test-card .big{font-size:28px;font-weight:800;line-height:1}
.test-card .meta{font-size:14px;color:var(--muted)}
.btn{border:0;border-radius:8px;padding:10px 16px;font-weight:700;font-size:15px}
.btn.primary{background:var(--guide);color:#fff}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.btn.warn{background:var(--amber);color:#1a1400}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.fact{background:var(--surface2);border-radius:10px;padding:12px}
.fact b{display:block;font-size:22px;font-family:var(--mono)}
.fact span{font-size:13px;color:var(--muted)}
.notice{border-left:4px solid var(--amber);background:var(--amber-soft);border-radius:8px;padding:12px 14px}
.toggle{display:flex;gap:10px;align-items:flex-start}
.toggle input{width:20px;height:20px;margin-top:3px;accent-color:var(--guide)}

/* test view */
.progress{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;display:flex;flex-direction:column;gap:8px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--amber);transition:width .2s}
.qhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.qnum{font-family:var(--mono);font-weight:700;font-size:15px}
.chip{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);color:var(--muted)}
.q-en{font-size:clamp(18px,3.4vw,21px);font-weight:700;line-height:1.35;margin:10px 0 4px;text-wrap:pretty}
.q-fa{font-size:17px;color:var(--muted);margin:0 0 12px}
.signbox{display:flex;justify-content:center;padding:10px;background:var(--surface2);border-radius:10px;margin:8px 0 12px}
.signbox svg{width:150px;height:auto;max-width:100%}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:grid;grid-template-columns:34px 1fr;gap:12px;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:12px;align-items:start}
.opt:hover{border-color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--guide);background:color-mix(in srgb,var(--guide) 9%,var(--surface))}
.opt .letter{width:30px;height:30px;border-radius:6px;display:grid;place-items:center;font-family:var(--mono);font-weight:700;background:var(--surface2);border:1px solid var(--line)}
.opt[aria-pressed="true"] .letter{background:var(--guide);color:#fff;border-color:var(--guide)}
.opt .t-en{font-weight:600}
.opt .t-fa{font-size:15px;color:var(--muted);margin-top:2px}
.navrow{display:flex;justify-content:space-between;gap:10px;margin-top:16px;flex-wrap:wrap}
.dots{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;margin-top:18px}
.dot{aspect-ratio:1;border-radius:6px;border:1.5px solid var(--line);background:var(--surface);font-family:var(--mono);font-size:12px;display:grid;place-items:center;padding:0}
.dot.done{background:var(--guide);border-color:var(--guide);color:#fff}
.dot.cur{outline:3px solid var(--amber);outline-offset:1px}
.confirm{margin-top:14px}

/* results */
.scorebar{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.score{font-family:var(--mono);font-weight:700;font-size:clamp(44px,10vw,64px);line-height:1}
.score small{font-size:.45em;color:var(--muted)}
.verdict{display:inline-block;font-weight:800;letter-spacing:.06em;padding:6px 14px;border-radius:6px;font-size:18px}
.verdict.pass{background:var(--ok-soft);color:var(--ok);border:2px solid var(--ok)}
.verdict.fail{background:var(--bad-soft);color:var(--bad);border:2px solid var(--bad)}
.counts{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px;font-size:15px}
.counts b{font-family:var(--mono)}
.miss{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.miss-h{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:10px 14px;background:var(--surface2);border-bottom:1px solid var(--line);font-size:13px}
.miss-b{padding:14px;display:flex;flex-direction:column;gap:10px}
.ro{display:grid;grid-template-columns:30px 1fr auto;gap:10px;padding:9px 10px;border-radius:8px;border:1.5px solid var(--line);align-items:start}
.ro .letter{width:26px;height:26px;border-radius:5px;display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:13px;background:var(--surface2)}
.ro.right{border-color:var(--ok);background:var(--ok-soft)}
.ro.wrong{border-color:var(--bad);background:var(--bad-soft)}
.tag{font-size:11px;font-weight:800;letter-spacing:.05em;padding:2px 7px;border-radius:4px;white-space:nowrap;align-self:center}
.tag.right{background:var(--ok);color:#fff}
.tag.wrong{background:var(--bad);color:#fff}
:root[data-theme="dark"] .tag.right, :root[data-theme="dark"] .tag.wrong{color:#111}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tag.right, :root:not([data-theme="light"]) .tag.wrong{color:#111}}
.expl{border-radius:10px;background:var(--surface2);padding:12px 14px;font-size:15.5px}
.expl .lbl{font-weight:700;display:block;margin-bottom:4px}
.src{font-size:13px;color:var(--muted)}
.srclist{display:flex;flex-direction:column;gap:10px;padding:0;margin:0;list-style:none}
.srclist li{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.srclist .kind{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:4px;margin-right:6px}
.kind.gov{background:var(--guide);color:#fff}
.kind.county{background:var(--amber);color:#1a1400}
.kind.sec{background:var(--surface2);border:1px solid var(--line);color:var(--muted)}
.srclist a{word-break:break-all}
table.cov{border-collapse:collapse;width:100%;font-size:14px}
table.cov th,table.cov td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left}
table.cov td.n{font-family:var(--mono);text-align:right}
.tblwrap{overflow-x:auto}

/* study guide */
.guide{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px;font-size:16.5px}
.guide section{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;scroll-margin-top:12px}
.guide h3{font-size:21px;margin:0 0 10px;color:var(--guide);font-family:var(--fa);font-weight:700}
:root[data-theme="dark"] .guide h3{color:#7FD9AE}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .guide h3{color:#7FD9AE}}
.guide h4{font-size:17px;margin:16px 0 6px;font-family:var(--fa)}
.guide ul,.guide ol{padding-right:22px;padding-left:0;margin:6px 0;display:flex;flex-direction:column;gap:6px}
.guide p{margin:6px 0}
.g-cover{background:var(--guide);color:#fff;border-radius:12px;padding:20px}
.g-cover .eyebrow{color:rgba(255,255,255,.8)}
.g-title{font-family:var(--fa);font-size:clamp(22px,4.5vw,28px);line-height:1.5;margin:6px 0 8px;text-wrap:balance}
.g-note{font-size:14px;opacity:.9}
.g-toc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 20px}
.g-toc h3{margin:0 0 8px;font-size:18px}
.g-toc ol{columns:2;column-gap:28px;display:block;padding-right:22px}
.g-toc li{margin-bottom:4px;break-inside:avoid}
@media (max-width:560px){.g-toc ol{columns:1}}
.g-alert{border-right:4px solid var(--amber);background:var(--amber-soft);border-radius:8px;padding:12px 14px;margin:10px 0}
.g-key{border-right:4px solid var(--guide);background:var(--surface2);border-radius:8px;padding:12px 14px;margin:6px 0 10px}
.g-src{font-size:13px;color:var(--muted);margin-top:10px!important}
table.gt{border-collapse:collapse;width:100%;font-size:15px;margin:8px 0}
table.gt th,table.gt td{border:1px solid var(--line);padding:7px 9px;text-align:right;vertical-align:top}
table.gt th{background:var(--surface2)}
table.gt td.num,table.num-table td:first-child{font-family:var(--mono);direction:ltr;text-align:left;white-space:nowrap}
table.gloss td:first-child{direction:ltr;text-align:left;font-family:var(--en)}
.g-check li::marker{content:"☐  "}
@media (max-width:480px){.dots{grid-template-columns:repeat(8,1fr)}.scorebar{grid-template-columns:1fr}}

/* mobile / iPhone */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{padding-bottom:env(safe-area-inset-bottom,0px)}
button,a{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.btn{min-height:44px}
nav.tabs button{min-height:38px}
.sign-head.compact{padding:10px 14px}
.sign-head.compact .sub,.sign-head.compact .route{display:none}
.sign-head.compact h1{font-size:19px;margin:0 0 2px}
.sign-head.compact nav.tabs{margin-top:8px}
@media (max-width:480px){
  .wrap{padding-inline:12px}
  .panel{padding:14px}
  .opt{grid-template-columns:30px 1fr;gap:10px;padding:11px}
  .ro{grid-template-columns:26px 1fr}
  .ro .tag{grid-column:1 / -1;justify-self:start}
  .navrow .btn{flex:1}
  .guide section{padding:14px}
  table.gt{font-size:14px}

}

</style>

<template id="guideTpl">
<div class="guide fa">
<header class="g-cover">
  <div class="eyebrow" style="direction:ltr;text-align:left">Florida Class E · Self-study guide in Farsi</div>
  <h2 class="g-title">راهنمای جامع مطالعه آزمون دانش رانندگی فلوریدا (Class E)</h2>
  <p>ویژه متقاضیان شهرستان هیلزبورو (تامپا، براندون، پلنت سیتی) و سراسر فلوریدا. بر پایه کتابچه رسمی رانندگی فلوریدا (Florida Driver License Handbook)، صفحات رسمی FLHSMV، قوانین ایالتی فلوریدا (فصل‌های ۳۱۶، ۳۱۸ و ۳۲۲) و اطلاعیه‌های Tax Collector شهرستان هیلزبورو. شماره منبع هر بخش در انتهای همان بخش آمده و فهرست کامل منابع در زبانه «Sources» است.</p>
  <p class="g-note">این راهنما آموزشی است و جای کتابچه رسمی را نمی‌گیرد. قوانین ممکن است تغییر کنند؛ پیش از آزمون، آخرین نسخه کتابچه و سایت FLHSMV را بررسی کنید.</p>
</header>

<section id="g1">
<h3>۱. درباره آزمون و نکات هیلزبورو</h3>
<h4>واقعیت‌های رسمی آزمون (FLHSMV)</h4>
<ul>
<li>نام رسمی: <b>Class E Knowledge Exam</b>. برای گرفتن گواهینامه آموزشی (Learner’s License) یا اولین گواهینامه لازم است.</li>
<li><b>۵۰ سؤال چندگزینه‌ای</b> درباره قوانین ترافیک فلوریدا، رانندگی ایمن و شناخت علائم راهنمایی.</li>
<li>حد قبولی: <b>۴۰ پاسخ درست (۸۰٪)</b>. یعنی حداکثر <b>۱۰ اشتباه</b> مجاز است؛ ۱۱ اشتباه = مردود.</li>
<li>تنها منبع رسمی سؤالات، <b>کتابچه رسمی رانندگی فلوریدا</b> است. FLHSMV بانک سؤالات واقعی را منتشر نمی‌کند.</li>
<li>متقاضیان <b>زیر ۱۸ سال</b> می‌توانند آزمون را آنلاین از طریق ارائه‌دهنده مجاز بدهند؛ برای آزمون آنلاین فرم نظارت والدین لازم است که باید محضری شود یا نزد کارشناس آزمون گواهینامه امضا شود. (آزمون حضوری نزد مدیران آزمون شخص ثالث مجاز هم ممکن است.) بزرگسالان آزمون را <b>حضوری</b> می‌دهند: در دفتر FLHSMV، Tax Collector یا ارائه‌دهندگان شخص ثالث مجاز (آزمون آنلاین فقط برای زیر ۱۸ سال است).</li>
</ul>
<div class="g-alert"><b>مهم‌ترین تغییر ۲۰۲۶:</b> از <b>۶ فوریه ۲۰۲۶</b>، طبق اطلاعیه Tax Collector هیلزبورو و FLHSMV، همه آزمون‌های دانش و رانندگی در فلوریدا <b>فقط به زبان انگلیسی</b> برگزار می‌شوند و <b>استفاده از دستگاه یا خدمات ترجمه مجاز نیست</b> (نه در آزمون کتبی و نه در آزمون عملی). پس باید مفاهیم را به فارسی بفهمید ولی <b>واژه‌های انگلیسی</b> را هم بشناسید. بخش ۲۱ این راهنما (واژه‌نامه) و حالت «English only» برنامه آزمون برای همین طراحی شده‌اند.</div>
<h4>نکات شهرستان هیلزبورو (Hillsborough County Tax Collector)</h4>
<ul>
<li>Tax Collector نماینده FLHSMV در شهرستان است و خدمات گواهینامه را انجام می‌دهد. تلفن: <span class="num" dir="ltr">813-635-5200</span>؛ سایت: hillstaxfl.gov.</li>
<li><b>آزمون عملی (Road Test)</b> فقط با وقت قبلی و فقط برای <b>ساکنان هیلزبورو</b> است؛ هر روز فقط یک بار می‌توانید امتحان دهید. مکان‌ها: Brandon (3030 N. Falkenburg Rd.)، East Tampa (2814 E. Hillsborough Ave.)، Plant City (4706 Sydney Rd.).</li>
<li>برای آزمون عملی نوجوانان، یک بزرگسال ۲۱ سال به بالا باید حضور داشته باشد و ۵۰ ساعت تمرین (۱۰ ساعت شب) را تأیید کند، یا فرم <b>HSMV 71143</b> را پر کند.</li>
<li>در خودرو هنگام آزمون عملی فقط متقاضی و ممتحن حضور دارند.</li>
<li>متقاضیان زیر ۱۸ سالی که هرگز گواهینامه نداشته‌اند باید دوره ۶ ساعته <b>DETS</b> را بگذرانند. بزرگسالانی که اولین گواهینامه را می‌گیرند دوره <b>TLSAE</b> را می‌گذرانند. طبق راهنمای ساکنان جدید هیلزبورو، اگر گواهینامه معتبر کشور خود را ارائه کنید، TLSAE لازم نیست (کپی پذیرفته نمی‌شود).</li>
<li>ساکنان جدید باید ظرف <b>۳۰ روز</b> گواهینامه فلوریدا بگیرند.</li>
</ul>
<p class="g-src">منابع: S1، S13، S14، S4، S17</p>
</section>

<section id="g2">
<h3>۲. برنامه مطالعه برای نمره کامل</h3>
<ol>
<li><b>هفته اول:</b> این راهنما را بخش به بخش بخوانید. بعد از هر بخش، واژه‌های انگلیسی آن بخش را از واژه‌نامه (بخش ۲۱) مرور کنید.</li>
<li><b>اعداد را جداگانه حفظ کنید.</b> بیشتر اشتباه‌ها در سؤالات عددی است (فوت، مایل، امتیاز، روز). جدول بخش ۲۰ را روی کاغذ بنویسید و هر روز مرور کنید.</li>
<li><b>آزمون‌های ۱ تا ۶ را با متن فارسی</b> بدهید. هر سؤال اشتباه را در مرور پایانی بخوانید و توضیح فارسی را یادداشت کنید.</li>
<li><b>دوباره همه آزمون‌ها را در حالت «English only»</b> بدهید. هدف: دست‌کم ۴۷ از ۵۰ در هر آزمون، بدون کمک فارسی.</li>
<li><b>تله‌های رایج را بشناسید:</b> «همیشه/هرگز»، تفاوت چراغ «ثابت» و «چشمک‌زن»، تفاوت «روبه‌رو» (۵۰۰ فوت) و «پشت سر» (۳۰۰ فوت)، تفاوت «سراشیبی» و «سربالایی»، تفاوت جهت «مخالف» و «هم‌جهت» در قانون اتوبوس مدرسه.</li>
<li><b>روش پاسخ دادن:</b> اول سؤال را کامل بخوانید، کلمات کلیدی مثل NOT، ALWAYS، FIRST، ONLY را پیدا کنید، گزینه‌های آشکارا نادرست را حذف کنید، سپس «ایمن‌ترین» و «قانونی‌ترین» گزینه را انتخاب کنید. در آزمون رانندگی تقریباً همیشه پاسخ درست گزینه‌ای است که ایمنی بیشتری دارد و به دیگران حق تقدم می‌دهد.</li>
</ol>
</section>

<section id="g3">
<h3>۳. تابلوها: شکل و رنگ</h3>
<p>کتابچه قدیمی‌تر فلوریدا توضیح می‌دهد که آزمون شامل سؤالاتی برای شناخت تابلوها «از روی رنگ، شکل یا معنا» است. اگر شکل و رنگ را بدانید، حتی بدون خواندن نوشته، معنای تابلو را می‌فهمید.</p>
<h4>شکل‌ها</h4>
<div class="tblwrap"><table class="gt">
<tr><th>شکل (English)</th><th>معنا</th></tr>
<tr><td>هشت‌ضلعی (Octagon)</td><td>فقط <b>STOP / ایست</b>. توقف کامل.</td></tr>
<tr><td>مثلث رو به پایین (Downward triangle)</td><td>فقط <b>YIELD / حق تقدم بدهید</b>. سرعت کم، در صورت لزوم توقف.</td></tr>
<tr><td>دایره (Circle)</td><td>فقط <b>پیش‌آگاهی راه‌آهن</b> (زرد با X و RR).</td></tr>
<tr><td>پنج‌ضلعی (Pentagon)</td><td><b>منطقه مدرسه یا محل عبور دانش‌آموزان</b>.</td></tr>
<tr><td>پرچم مثلثی افقی (Pennant)</td><td><b>منطقه سبقت ممنوع</b>؛ در سمت <b>چپ</b> جاده و رو به راننده نصب می‌شود.</td></tr>
<tr><td>لوزی (Diamond)</td><td><b>هشدار</b> (Warning): پیچ، تقاطع، لغزندگی، چراغ در پیش رو، ادغام خط.</td></tr>
<tr><td>مستطیل عمودی (Vertical rectangle)</td><td><b>مقرراتی</b> (Regulatory): قانون؛ مثل SPEED LIMIT، KEEP RIGHT، NO TURN ON RED.</td></tr>
<tr><td>مستطیل افقی (Horizontal rectangle)</td><td><b>راهنما</b> (Guide): مسیر، مسافت، خروجی.</td></tr>
<tr><td>ضربدر سفید (Crossbuck)</td><td>خود محل تقاطع راه‌آهن؛ مانند YIELD عمل می‌کند؛ قطار همیشه حق تقدم دارد.</td></tr>
<tr><td>مثلث نارنجی با حاشیه قرمز پشت خودرو</td><td><b>خودروی کندرو</b> (Slow-Moving Vehicle) که معمولاً با سرعت کمتر از ۲۵ مایل در ساعت حرکت می‌کند (بند 316.2225).</td></tr>
</table></div>
<h4>رنگ‌ها</h4>
<div class="tblwrap"><table class="gt">
<tr><th>رنگ</th><th>معنا</th></tr>
<tr><td>قرمز (Red)</td><td>ایست، حق تقدم، ممنوعیت (DO NOT ENTER، WRONG WAY، دایره با خط مورب).</td></tr>
<tr><td>سفید (White)</td><td>مقرراتی؛ باید اطاعت کنید.</td></tr>
<tr><td>زرد (Yellow)</td><td>هشدار عمومی.</td></tr>
<tr><td>نارنجی (Orange)</td><td>منطقه کار و ساخت‌وساز. جریمه سرعت با حضور کارگران <b>دو برابر</b>.</td></tr>
<tr><td>زرد-سبز فسفری (Fluorescent yellow-green)</td><td>عابر پیاده، دوچرخه، مدرسه.</td></tr>
<tr><td>سبز (Green)</td><td>راهنمای مسیر و مسافت.</td></tr>
<tr><td>آبی (Blue)</td><td>خدمات راننده: بنزین، غذا، اقامت، بیمارستان.</td></tr>
<tr><td>قهوه‌ای (Brown)</td><td>مناطق تفریحی، فرهنگی، پارک‌ها.</td></tr>
</table></div>
<h4>تابلوهای مهم دیگر</h4>
<ul>
<li><b>DO NOT ENTER</b>: وارد نشوید؛ خلاف جهت خواهید بود. <b>WRONG WAY</b>: در خلاف جهت هستید؛ با احتیاط کنار بکشید و دور بزنید.</li>
<li><b>ONE WAY</b>: خیابان یک‌طرفه؛ فقط در جهت فلش.</li>
<li><b>STOP + ALL WAY</b>: همه جهت‌ها باید بایستند.</li>
<li><b>NO TURN ON RED</b>: با چراغ قرمز گردش ممنوع؛ منتظر سبز بمانید.</li>
<li><b>SLOWER TRAFFIC KEEP RIGHT</b>: اگر کندتر از دیگران می‌رانید در خط راست بمانید.</li>
<li><b>پلاک زرد سرعت توصیه‌ای</b> (مثلاً 35 MPH زیر تابلوی پیچ): سرعت ایمن پیشنهادی برای پیچ، نه حداکثر قانونی.</li>
<li><b>SPEED LIMIT</b>: حداکثر سرعت در شرایط ایده‌آل؛ در باران و ترافیک باید آهسته‌تر برانید.</li>
<li><b>پرچمدار (Flagger)</b> در منطقه کار: دستورش همان اعتبار تابلو را دارد.</li>
</ul>
<p class="g-src">منابع: S2، S19 (بخش‌های ۲.۸، ۵.۲۳)، S12</p>
</section>

<section id="g4">
<h3>۴. چراغ‌های راهنمایی و علائم کنترل خط</h3>
<div class="tblwrap"><table class="gt">
<tr><th>چراغ</th><th>معنا</th></tr>
<tr><td>قرمز ثابت</td><td>توقف. گردش به <b>راست</b> پس از توقف کامل و حق تقدم مجاز است، مگر تابلوی NO TURN ON RED باشد. گردش به <b>چپ</b> فقط از خیابان یک‌طرفه به یک‌طرفه.</td></tr>
<tr><td>زرد ثابت</td><td>به‌زودی قرمز می‌شود؛ اگر می‌توانید با ایمنی بایستید، توقف کنید.</td></tr>
<tr><td>سبز</td><td>حرکت، پس از دادن حق تقدم به خودروها و عابرانی که هنوز در تقاطع‌اند. گردش به چپ با سبز معمولی: به ترافیک روبه‌رو راه بدهید.</td></tr>
<tr><td>فلش سبز</td><td>گردش «حمایت‌شده»؛ ترافیک مقابل متوقف است.</td></tr>
<tr><td>فلش زرد ثابت</td><td>گردش حمایت‌شده در حال پایان است.</td></tr>
<tr><td>فلش زرد چشمک‌زن</td><td>گردش مجاز است ولی باید به ترافیک روبه‌رو و عابران حق تقدم بدهید.</td></tr>
<tr><td>فلش قرمز</td><td>مانند چراغ قرمز: توقف کامل. در بیشتر تقاطع‌ها پس از توقف و حق تقدم، گردش به <b>راست</b> با فلش قرمز مجاز است، مگر تابلوی NO TURN ON RED باشد.</td></tr>
<tr><td>قرمز چشمک‌زن</td><td>مانند تابلوی ایست: توقف کامل، سپس حرکت.</td></tr>
<tr><td>زرد چشمک‌زن</td><td>با احتیاط و سرعت کم عبور کنید (توقف لازم نیست).</td></tr>
<tr><td>چراغ خاموش (خراب)</td><td>مانند ایست چهارطرفه (بند 316.1235).</td></tr>
</table></div>
<h4>علائم کنترل خط (بالای خطوط برگشت‌پذیر)</h4>
<ul>
<li>X قرمز ثابت: در این خط نرانید.</li>
<li>X زرد ثابت: آماده خروج از این خط شوید.</li>

<li>فلش سبز رو به پایین: می‌توانید از این خط استفاده کنید.</li>
</ul>
<h4>چراغ عابر پیاده و چراغ رمپ</h4>
<ul>
<li><b>WALK</b> (یا آدمک): عابر می‌تواند عبور کند. <b>DON'T WALK</b> ثابت (یا دست بالا): عابر نباید شروع به عبور کند. <b>DON'T WALK چشمک‌زن</b>: عابری که در میانه خط عابر است باید عبور را تمام کند.</li>
<li><b>چراغ رمپ ورودی بزرگراه (Freeway)</b> (Ramp meter): با چراغ قرمز باید تا سبز شدن صبر کنید و بعد وارد بزرگراه شوید.</li>
</ul>
<h4>علائم دستی (بند 316.157)</h4>
<ul><li>دست افقی و مستقیم = گردش به چپ؛ دست رو به بالا = گردش به راست؛ دست رو به پایین = کم کردن سرعت یا توقف.</li></ul>
<h4>دستور پلیس و مأموران</h4>
<p>دستور افسر پلیس یا مأمور هدایت ترافیک بر چراغ و تابلو <b>مقدم</b> است (بند 316.072). دستور مأمور عبور مدرسه (Crossing Guard) و پرچمدار منطقه کار را هم باید اطاعت کنید.</p>
<p class="g-src">منابع: S2، 316.075، 316.1235، 316.072</p>
</section>

<section id="g5">
<h3>۵. خط‌کشی‌های جاده</h3>
<ul>
<li><b>خطوط زرد</b> ترافیک <b>دو جهت مخالف</b> را جدا می‌کنند. <b>خطوط سفید</b> خطوط هم‌جهت را جدا می‌کنند.</li>
<li>زرد <b>منقطع</b> در سمت شما: سبقت در صورت امن بودن مجاز است.</li>
<li>زرد <b>ممتد</b> در سمت شما: سبقت ممنوع.</li>
<li><b>دو خط زرد ممتد</b>: سبقت برای ترافیک هر دو جهت ممنوع.</li>
<li><b>خط گردش به چپ دوطرفه</b> (وسط جاده، ممتد + منقطع در هر طرف با فلش): فقط برای شروع یا پایان گردش به چپ؛ نه برای سبقت یا رانندگی. کتابچه: «خط وسط جاده سه‌خطه یا پنج‌خطه فقط برای گردش به چپ است.»</li>
<li><b>خط سفید ممتد</b> بین خطوط هم‌جهت: از آن عبور نکنید مگر برای اجتناب از خطر. <b>خط سفید منقطع</b>: پس از راهنما و در صورت امن بودن می‌توانید برای تغییر خط از آن عبور کنید.</li>
<li><b>خط زرد تکی</b> ممکن است لبه چپ بزرگراه جداشده یا خیابان یک‌طرفه را نشان دهد.</li>
<li><b>فلش روی خط با کلمه ONLY</b>: باید در جهت فلش بپیچید.</li>
<li><b>لوزی سفید</b> روی خط: خط ویژه خودروهای کارپول با دو سرنشین یا بیشتر (HOV)؛ به تابلوهای لوزی کنار جاده توجه کنید.</li>
<li><b>خط دوچرخه</b>: خودرو اجازه ورود ندارد مگر در تقاطع‌هایی که خط سفید منقطع دارند و فقط وقتی دوچرخه‌ای نیست.</li>
<li><b>بازتابنده‌های قرمز رو به شما</b> روی خطوط: در سمت اشتباه جاده هستید. روی لبه‌های رمپ: رمپ اشتباه؛ <b>فوراً کنار بکشید</b>.</li>
<li><b>خط ایست</b>: پشت آن توقف کنید؛ اگر نیست، قبل از خط عابر؛ اگر آن هم نیست، قبل از تقاطع در نقطه‌ای که دید دارید.</li>
</ul>
<p class="g-src">منابع: S2، S19 (۵.۲۳)، 316.123</p>
</section>

<section id="g6">
<h3>۶. حق تقدم و تقاطع‌ها</h3>
<div class="g-key">جمله کلیدی کتابچه: «چه کسی در فلوریدا حق تقدم دارد؟ <b>هیچ‌کس!</b> قانون فقط می‌گوید چه کسی باید حق تقدم را <b>واگذار</b> کند.» همه موظف‌اند برای جلوگیری از تصادف هر کاری بکنند.</div>
<h4>تقاطع‌ها</h4>
<ul>
<li>«تصادف‌ها در <b>تقاطع‌ها</b> بیشتر از هر جای دیگری رخ می‌دهند.»</li>
<li>کمترین سرعت: <b>درست قبل از ورود</b> به تقاطع، نه هنگام عبور.</li>
<li>در تقاطع <b>سبقت نگیرید و خط عوض نکنید</b>.</li>
<li>با چراغ سبز هم اگر نمی‌توانید کامل عبور کنید، وارد تقاطع نشوید (تقاطع را مسدود نکنید).</li>
</ul>
<h4>ایست چهارطرفه</h4>
<ul>
<li>اولین خودرویی که <b>توقف کامل</b> کرده، اول حرکت می‌کند.</li>
<li>اگر دو خودرو هم‌زمان برسند: راننده <b>چپ</b> به راننده <b>راست</b> راه می‌دهد.</li>
<li>دو خودرو روبه‌روی هم: خودرویی که <b>مستقیم</b> می‌رود بر خودرویی که به <b>چپ</b> می‌پیچد مقدم است.</li>
<li>پس از توقف در تابلوی ایست، به <b>همه</b> ترافیک و عابران حق تقدم بدهید.</li>
</ul>
<h4>تقاطع باز (بدون تابلو و چراغ)</h4>
<p>باید حق تقدم بدهید وقتی: خودرویی از قبل داخل تقاطع است؛ از جاده فرعی (آسفالته یا آسفالت‌نشده) وارد <b>جاده یا بزرگراه ایالتی</b> می‌شوید یا از آن عبور می‌کنید (بند 316.121: به <b>همه</b> خودروهای جاده ایالتی حق تقدم بدهید)؛ از جاده <b>آسفالت‌نشده</b> وارد جاده <b>آسفالته</b> می‌شوید؛ به <b>چپ</b> می‌پیچید و خودرویی از روبه‌رو می‌آید. ورود هم‌زمان: راننده چپ به راننده راست راه می‌دهد. (کتابچه فلوریدا قاعده جداگانه‌ای برای تقاطع T ندارد؛ همین قواعد را به کار ببرید.)</p>
<h4>موارد دیگر حق تقدم</h4>
<ul>
<li>گردش به چپ (در تقاطع یا به داخل ورودی): به ترافیک روبه‌رو و عابران راه بدهید.</li>
<li>ورود از <b>ورودی خانه، کوچه یا پارکینگ</b>: به عابران و همه خودروهای جاده راه بدهید.</li>
<li>خروج از جای پارک: راهنما، آینه، نقطه کور، و حق تقدم به ترافیک.</li>
<li>ورود به بزرگراه: در خط شتاب‌گیری به سرعت ترافیک برسید و به خودروهای داخل بزرگراه راه بدهید.</li>
<li><b>میدان (Roundabout)</b>: به ترافیک داخل میدان راه بدهید؛ خلاف عقربه‌های ساعت؛ برای چپ خط چپ، برای راست خط راست، برای مستقیم هر خط؛ هنگام خروج راهنمای <b>راست</b>؛ به عابران در خط عابر راه بدهید.</li>
<li><b>کاروان تشییع جنازه</b>: وقتی خودروی اول به‌طور قانونی وارد تقاطع شد، بقیه حق تقدم دارند؛ وارد کاروان نشوید.</li>
<li><b>اتوبوس عمومی</b> که از جایگاه مخصوص راهنما زده و به ترافیک برمی‌گردد: حق تقدم بدهید (بند 316.0815).</li>
<li><b>خودروی امدادی</b> با آژیر/چراغ: به نزدیک‌ترین لبه جاده (در جاده دوطرفه معمولاً راست) بروید و بایستید؛ داخل تقاطع نایستید.</li>
</ul>
<p class="g-src">منابع: S19 (۵.۱۳، ۵.۱۴، ۵.۱۵، ۵.۱۶، ۵.۱۷، ۵.۱۹)، S2، 316.0815، 316.1974</p>
</section>

<section id="g7">
<h3>۷. جاده‌های یک‌طرفه، دوطرفه، دوخطه؛ گردش، سبقت و بزرگراه</h3>
<h4>جاده دوطرفه و چندخطه</h4>
<ul>
<li>در جاده دوطرفه با عرض کافی، در <b>نیمه راست</b> جاده برانید (بند 316.081).</li>
<li>در بزرگراه چندخطه: در <b>خطوط راست</b> برانید مگر هنگام سبقت. خودروهای کندتر در خط راست.</li>
<li>در <b>چپ‌ترین خط</b> نمانید اگر خودروی سریع‌تری از پشت می‌رسد (مگر در حال سبقت یا آماده گردش به چپ).</li>
<li>در جاده دوطرفه <b>با چهار خط یا بیشتر</b>: از خط وسط عبور نکنید، مگر برای گردش به چپ به کوچه/ورودی یا وقتی علائم اجازه دهند.</li>
<li>در جاده <b>دوخطه</b> فقط وقتی سبقت امن و مجاز است می‌توانید در نیمه چپ برانید.</li>
</ul>
<h4>گردش‌ها</h4>
<ul>
<li>تصمیم گردش را <b>قبل</b> از رسیدن به محل گردش بگیرید. در <b>۱۰۰ فوت آخر</b> راهنما بزنید. راهنما برای <b>تغییر خط و سبقت</b> هم الزامی است.</li>
<li><b>گردش به راست</b>: از خط کنار لبه راست، به خط راست جاده جدید.</li>
<li><b>گردش به چپ در جاده دوطرفه</b>: از بخش نیمه راست که به خط وسط نزدیک‌تر است.</li>
<li><b>گردش به چپ از خیابان یک‌طرفه</b>: از منتهاالیه چپ‌ترین خط.</li>
<li>اگر در خط اشتباه هستید: تا <b>تقاطع بعدی</b> بروید و از خط درست بپیچید.</li>
<li>قبل از گردش به راست، دوچرخه‌سواری که از او سبقت گرفته‌اید ممکن است کنارتان باشد؛ از روی شانه نگاه کنید.</li>
<li><b>U-turn</b>: فقط اگر ایمن باشد، مزاحم ترافیک نشود و تابلو ممنوع نکرده باشد. هرگز در <b>پیچ یا روی تپه</b>. دور سه‌مرحله‌ای فقط وقتی جاده برای U-turn باریک است.</li>
<li>استفاده از راهنما برای «اجازه سبقت دادن» به راننده پشتی <b>غیرقانونی</b> است.</li>
</ul>
<h4>سبقت</h4>
<ul>
<li>فاصله ایمن پشت خودروی جلو، راهنما، سپس ورود به خط چپ (در جاده دوخطه می‌توانید با بوق یا در شب با چراغ اعلام کنید).</li>
<li>تا <b>لاستیک‌های</b> خودرویی که از آن سبقت گرفته‌اید را در آینه نبینید، برنگردید.</li>
<li>باید قبل از رسیدن به <b>۲۰۰ فوتی</b> خودروی روبه‌رو به خط خود برگردید (بند 316.085).</li>
<li>سبقت ممنوع: در مناطق DO NOT PASS / NO PASSING ZONE؛ با خط زرد ممتد در سمت شما؛ روی <b>تپه</b> و در <b>پیچ</b>؛ در <b>۱۰۰ فوتی</b> تقاطع (در جاده‌های ایالتی/شهرستانی بیرون از شهر فقط اگر تقاطع با تابلو مشخص شده باشد) یا تقاطع راه‌آهن؛ در ۱۰۰ فوتی پل، روگذر یا تونل وقتی دید محدود است (بند 316.087).</li>
<li><b>سبقت از راست</b> فقط وقتی خودروی جلو به چپ می‌پیچد یا دو یا چند خط هم‌جهت وجود دارد؛ هرگز با خروج از آسفالت یا روی شانه (بند 316.084).</li>
<li>وقتی از شما سبقت می‌گیرند: <b>سرعت را زیاد نکنید</b>، در خط خود بمانید و در صورت امکان به راست بروید.</li>
</ul>
<h4>بزرگراه (Expressway)</h4>
<ul>
<li>در رمپ ورودی دنبال فرصت باشید، راهنما بزنید، در خط شتاب‌گیری به سرعت ترافیک برسید و ادغام شوید.</li>
<li>بیشتر خروجی‌ها از <b>خط راست</b> است؛ زود وارد خط خروجی شوید.</li>
<li>خروجی را رد کردید؟ تا <b>خروجی بعدی</b> بروید. هرگز روی سطح بزرگراه توقف نکنید (مگر اضطرار)، روی رمپ دنده‌عقب نروید و از میانه عبور نکنید.</li>
<li>خستگی و «خواب‌آلودگی بزرگراه»: وقتی خسته‌اید رانندگی را متوقف کنید و استراحت کنید.</li>
</ul>
<p class="g-src">منابع: 316.081، 316.084، 316.085، 316.087، 316.151، 316.1515، S19 (۵.۲۰، ۵.۲۱، ۵.۲۲، ۵.۲۳، ۵.۲۵، ۵.۲۸)</p>
</section>

<section id="g8">
<h3>۸. محدودیت‌های سرعت</h3>
<div class="tblwrap"><table class="gt">
<tr><th>محل (اگر تابلوی دیگری نباشد)</th><th>حداکثر سرعت</th></tr>
<tr><td>مناطق شهری (Municipal)</td><td class="num">30 mph</td></tr>
<tr><td>مناطق تجاری یا مسکونی (Business / Residential)</td><td class="num">30 mph</td></tr>
<tr><td>بزرگراه بین‌ایالتی خارج از شهر (Rural Interstate)</td><td class="num">70 mph</td></tr>
<tr><td>بزرگراه با دسترسی محدود (Limited Access، مثل Turnpike)</td><td class="num">70 mph</td></tr>
<tr><td>سایر جاده‌ها و بزرگراه‌ها</td><td class="num">55 mph</td></tr>
<tr><td>منطقه مدرسه (School Zone)</td><td class="num">20 mph</td></tr>
</table></div>
<ul>
<li><b>حداقل سرعت</b> در بزرگراه بین‌ایالتی با چهار خط یا بیشتر: <b>40 mph</b>؛ اگر حداکثر <b>70</b> باشد، حداقل <b>50 mph</b>.</li>
<li>رانندگی آن‌قدر آهسته که ترافیک عادی را مختل کند، قابل جریمه است.</li>
<li><b>قانون سرعت پایه</b>: هرگز سریع‌تر از سرعتی که برای شرایط (باران، ترافیک، دید) ایمن است نرانید، حتی زیر حد مجاز.</li>
<li>جریمه سرعت در <b>منطقه کار با حضور کارگران دو برابر</b> است.</li>
<li>اگر سرعت را <b>دو برابر</b> کنید، مسافت ترمز حدود <b>چهار برابر</b> می‌شود.</li>
<li>امتیاز منفی سرعت: تا ۱۵ مایل در ساعت بالاتر = <b>۳ امتیاز</b>؛ بیش از ۱۵ مایل در ساعت = <b>۴ امتیاز</b>.</li>
</ul>
<p class="g-src">منابع: S2، S11، 318.18، 322.27</p>
</section>

<section id="g9">
<h3>۹. فاصله ایمن، ترمز و مسافت توقف</h3>
<h4>فاصله دنبال کردن</h4>
<ul>
<li>کتابچه فعلی: <b>حداقل ۳ تا ۴ ثانیه</b>، و برای هر شرایط غیرعادی (هوا یا ترافیک) <b>یک ثانیه اضافه</b>. (در آزمون عملی FLHSMV حداقل فاصله دنبال کردن «چهار ثانیه» ارزیابی می‌شود؛ در آزمون کتبی به توصیه کتابچه یعنی ۳ تا ۴ ثانیه و یک ثانیه اضافه در شرایط بد تکیه کنید.)</li>
<li>روش: وقتی عقب خودروی جلو از یک نقطه ثابت (تابلو، تیر) رد شد، ثانیه‌ها را بشمارید تا شما به همان نقطه برسید.</li>
<li>فاصله بیشتر لازم است: جاده لغزنده؛ پشت کامیون، اتوبوس یا ون که دید را می‌بندند؛ پشت موتورسیکلت (<b>دست‌کم ۴ ثانیه</b>)؛ بار سنگین یا یدک‌کش؛ شب و هوای بد؛ وقتی کسی پشت شما نزدیک است؛ پشت خودروهایی که باید در راه‌آهن بایستند؛ روی <b>تپه</b> که خودروی جلو ممکن است <b>عقب بلغزد</b>.</li>
<li>کامیون یا خودروی یدک‌کش نباید در فاصله کمتر از <b>۳۰۰ فوت</b> پشت کامیون یا یدک‌کش دیگر حرکت کند (طبق بند 316.0895 این قانون بیرون از مناطق تجاری یا مسکونی اعمال می‌شود و هنگام سبقت شامل نمی‌شود).</li>
<li>راننده‌ای که پشت شما نزدیک است: فاصله <b>جلوی</b> خود را زیاد کنید و بگذارید سبقت بگیرد؛ ترمز هشداری نزنید.</li>
</ul>
<h4>ترمز و مسافت توقف</h4>
<ul>
<li>خودرو باید <b>دو سیستم ترمز</b> داشته باشد که هر کدام به‌تنهایی خودرو را متوقف کند. ترمز دستی باید خودرو را در هر شیبی نگه دارد.</li>
<li>مسافت کل توقف = <b>مسافت درک</b> + <b>مسافت واکنش</b> + <b>مسافت ترمز</b>.</li>
<li>در <b>۵۰ مایل در ساعت</b>: مسافت واکنش حدود <b>۵۵ فوت</b> و مسافت ترمز روی آسفالت خشک حدود <b>۱۵۸ فوت</b> است؛ با افزودن مسافت درک خطر، کل مسافت توقف دست‌کم <b>۲۶۸ فوت</b> می‌شود.</li>
<li><b>ترمز ضدقفل (ABS)</b>: فشار محکم و پیوسته؛ پمپ نکنید؛ لرزش پدال طبیعی است.</li>
<li>بدون ABS و ترمز از کار افتاده: پدال را <b>سریع و محکم پمپ کنید</b>، به دنده سنگین‌تر بروید، و ترمز دستی را تدریجی بکشید.</li>
<li><b>ترمز خیس</b> پس از عبور از آب عمیق: سرعت را کم کنید و به‌آرامی ترمز بگیرید تا خشک و عادی شود.</li>
<li>در باران برای <b>دست‌کم دو برابر</b> مسافت توقف عادی برنامه‌ریزی کنید.</li>
<li>در جاده یخ‌زده: بیش از حد لازم ترمز نکنید، هنگام پیچیدن ترمز نکنید؛ قبل از پیچ سرعت را کم کنید.</li>
</ul>
<p class="g-src">منابع: S19 (۵.۲۶، ۵.۳۱، ۵.۳۲، ۷.۱، ۲.۸)، S20</p>
</section>

<section id="g10">
<h3>۱۰. پارک کردن (سربالایی و سراشیبی)</h3>
<h4>فاصله‌های پارک ممنوع (بندهای 316.1945 و 316.1965 و کتابچه)</h4>
<div class="tblwrap"><table class="gt">
<tr><th>از چه چیزی</th><th>حداقل فاصله</th></tr>
<tr><td>شیر آتش‌نشانی (Fire hydrant)</td><td class="num">15 ft</td></tr>
<tr><td>خط عابر در تقاطع (Crosswalk at intersection)</td><td class="num">20 ft</td></tr>
<tr><td>ورودی ایستگاه آتش‌نشانی (همان طرف خیابان)؛ طرف مقابل با تابلو</td><td class="num">20 ft / 75 ft</td></tr>
<tr><td>قبل از تابلوی ایست، چراغ چشمک‌زن یا چراغ راهنمایی کنار جاده</td><td class="num">30 ft</td></tr>
<tr><td>صندوق پست روستایی در بزرگراه ایالتی (۸ صبح تا ۶ عصر؛ بند 316.1965)</td><td class="num">30 ft</td></tr>
<tr><td>نزدیک‌ترین ریل تقاطع راه‌آهن</td><td class="num">50 ft</td></tr>
<tr><td>فاصله چرخ‌ها از جدول در پارک موازی (حداکثر)</td><td class="num">12 in</td></tr>
</table></div>
<p><b>همیشه ممنوع:</b> روی خط عابر، پیاده‌رو، خط دوچرخه، جلوی ورودی‌ها، کنار جدول زرد یا تابلوی No Parking، داخل تقاطع، روی پل/روگذر/تونل، روی ریل راه‌آهن، و «پارک دوبل» (در سمت خیابانِ خودرویی که کنار جدول پارک شده).</p>
<h4>پارک در شیب</h4>
<p>قاعده کتابچه: چرخ‌ها را طوری بچرخانید که اگر خودرو حرکت کرد، <b>از ترافیک دور شود یا به جدول برخورد کند</b>. ترمز دستی را بکشید.</p>
<div class="tblwrap"><table class="gt">
<tr><th>وضعیت</th><th>چرخ‌های جلو</th><th>دنده دستی</th></tr>
<tr><td>سراشیبی (Downhill) با جدول</td><td>به سمت جدول (راست)</td><td>دنده عقب (Reverse)</td></tr>
<tr><td>سربالایی (Uphill) با جدول</td><td>دور از جدول (چپ)</td><td>دنده یک (First)</td></tr>
<tr><td>بدون جدول (سربالایی یا سراشیبی)</td><td>به سمت لبه راست جاده</td><td>سراشیبی: عقب؛ سربالایی: یک</td></tr>
</table></div>
<p>خودروی اتوماتیک را روی <b>P</b> بگذارید. پیش از ترک خودرو (بند 316.1975): موتور را خاموش کنید، سوئیچ را قفل کنید و کلید را بردارید؛ و اگر روی هر شیبی هستید، ترمز دستی را هم بکشید و چرخ‌های جلو را به سمت جدول یا کنار جاده بچرخانید.</p>
<h4>نکات دیگر</h4>
<ul>
<li>در جاده عمومی تا جای ممکن از ترافیک دور پارک کنید؛ اگر شانه هست، کامل روی آن بروید.</li>
<li>پارک مستقیم: خودرو در وسط جای پارک و هیچ بخشی وارد خط عبور نشود.</li>
<li>قبل از پیاده شدن از سمت خیابان، ترافیک و دوچرخه‌سواران پشت سر را بررسی کنید؛ در را تا وقتی امن نیست باز نکنید و بیش از زمان لازم باز نگذارید (بند 316.2005).</li>
<li>کودک زیر ۶ سال را بیش از ۱۵ دقیقه (و با موتور روشن حتی یک لحظه) در خودرو تنها نگذارید.</li>
<li>سوءاستفاده از مجوز پارک معلولان جرم است.</li>
</ul>
<p class="g-src">منابع: S12، S19 (۵.۲۷)، 316.195، 316.1975، 316.2005، 316.6135</p>
</section>

<section id="g11">
<h3>۱۱. چراغ‌ها و تجهیزات خودرو</h3>
<h4>زمان روشن کردن چراغ‌ها</h4>
<ul>
<li>چراغ‌های جلو از <b>غروب تا طلوع آفتاب</b> و هنگام <b>باران، دود یا مه</b> الزامی‌اند. قاعده ساده: وقتی برف‌پاک‌کن روشن است، چراغ‌ها هم روشن.</li>
<li>رانندگی فقط با <b>چراغ پارک</b> به‌جای چراغ جلو <b>غیرقانونی</b> است.</li>
<li>در <b>۵۰۰ فوتی خودروی روبه‌رو</b> و <b>۳۰۰ فوتی خودرویی که پشتش هستید</b> نور بالا را به نور پایین تغییر دهید</li>
<li>پشت کامیون در شب همیشه نور پایین؛ وقتی دوچرخه‌سوار نزدیک می‌شود نور بالا نزنید.</li>
<li>به چراغ‌های روبه‌رو خیره نشوید؛ به <b>لبه راست خط خود</b> نگاه کنید.</li>
<li>پس از ترک مکان پرنور، آهسته برانید تا چشم‌ها به تاریکی عادت کنند.</li>
<li><b>فلاشر (چراغ هشدار)</b>: معمولاً فقط وقتی خودرو متوقف یا ازکارافتاده است. از ۲۰۲۴ قانون اجازه می‌دهد هنگام <b>دید بسیار کم در جاده‌های با حد سرعت ۵۵ مایل در ساعت یا بیشتر</b> هم استفاده شود (بند 316.2397).</li>
</ul>
<h4>جدول تجهیزات</h4>
<div class="tblwrap"><table class="gt">
<tr><th>تجهیزات</th><th>استاندارد</th></tr>
<tr><td>نور پایین (Low beam)</td><td>اشیا را تا <b>۱۵۰ فوت</b> نشان دهد؛ مؤثر تا حدود ۲۰–۲۵ مایل در ساعت</td></tr>
<tr><td>نور بالا (High beam)</td><td>تا <b>۴۵۰ فوت</b>؛ مؤثر برای سرعت‌های بالای ۲۵ مایل در ساعت</td></tr>
<tr><td>چراغ‌های عقب (Taillights)</td><td>دو چراغ قرمز، دیده شدن از <b>۱۰۰۰ فوت</b></td></tr>
<tr><td>چراغ ترمز (Stoplights)</td><td>دو چراغ قرمز، دیده شدن در روز از <b>۳۰۰ فوت</b></td></tr>
<tr><td>چراغ پلاک</td><td>سفید، پلاک از <b>۵۰ فوت</b> خوانا باشد</td></tr>
<tr><td>بوق</td><td>شنیده شدن از <b>۲۰۰ فوت</b></td></tr>
<tr><td>آینه عقب</td><td>دید دست‌کم <b>۲۰۰ فوت</b> پشت خودرو</td></tr>
<tr><td>آج لاستیک</td><td>دست‌کم <b>۲/۳۲ اینچ</b></td></tr>
<tr><td>تینت شیشه‌های کناری جلو (کنار راننده)</td><td>بازتاب حداکثر <b>۲۵٪</b> نور؛ شیشه‌های پشت راننده حداکثر <b>۳۵٪</b> (بندهای 316.2953 و 316.2954)</td></tr>
<tr><td>برف‌پاک‌کن</td><td>باید سالم باشد</td></tr>
</table></div>
<p><b>تجهیزات غیرمجاز:</b> چراغ اضطراری قرمز یا آبی، آژیر/زنگ/سوت، اگزوز بسیار پرصدا یا دودزا، برچسب روی شیشه (به‌جز موارد قانونی)، تلویزیون قابل‌دید برای راننده، <b>هدست یا هدفون راننده</b> (به‌جز هدست تلفن یک‌گوش یا سمعک).</p>
<p class="g-src">منابع: S19 (۵.۲۲، ۵.۲۹، ۷.۱، ۷.۲، ۷.۳)، 316.217، 316.238، 316.2397، 316.304</p>
</section>

<section id="g12">
<h3>۱۲. شب، باران، مه، یخ‌زدگی و حیوانات</h3>
<h4>شب</h4>
<p>«جلوتر از نور چراغ‌ها نرانید»: اگر نتوانید در فاصله‌ای که چراغ‌ها روشن می‌کنند بایستید، سرعت شما زیاد است.</p>
<h4>باران و هیدروپلنینگ</h4>
<ul>
<li>«اولین قطره‌های باران یعنی خطر.» جاده‌ها <b>درست پس از شروع باران</b> از همه لغزنده‌ترند (آب با روغن روی آسفالت مخلوط می‌شود).</li>
<li>برای دست‌کم <b>دو برابر</b> مسافت توقف برنامه‌ریزی کنید و فاصله را بیشتر کنید.</li>
<li><b>هیدروپلنینگ</b>: لاستیک‌ها روی لایه آب سُر می‌خورند و «به‌راحتی کنترل را از دست می‌دهید». پیشگیری طبق کتابچه: در باران سرعت را کم کنید و لاستیک‌ها باد مناسب و آج کافی داشته باشند.</li>
<li>از برف‌پاک‌کن و بخارزدا به‌اندازه کافی استفاده کنید؛ زودتر راهنما بزنید و زودتر ترمز کنید.</li>
</ul>
<h4>مه و دود</h4>
<ul>
<li>از <b>نور پایین</b> استفاده کنید؛ نور بالا از مه بازتاب می‌شود.</li>
<li>قبل از ورود به تکه مه سرعت را کم کنید و به سرعت‌سنج نگاه کنید.</li>
<li>از <b>لبه راست جاده</b> یا خط‌کشی‌ها به‌عنوان راهنما استفاده کنید.</li>
</ul>
<h4>جاده یخ‌زده (از کتابچه رسمی CDL فلوریدا، بخش رانندگی در زمستان)</h4>
<p>یخ‌زدگی در بیشتر فلوریدا نادر است، اما در شمال ایالت یا سفر به ایالت‌های دیگر رخ می‌دهد:</p>
<ul>
<li><b>پل‌ها و روگذرها</b> زودتر از بقیه جاده یخ می‌زنند.</li>
<li>اگر دیگر از زیر چرخ خودروهای دیگر <b>آب پاشیده نمی‌شود</b>، احتمالاً یخ بسته است.</li>
<li>آهسته و نرم برانید؛ اگر خیلی لغزنده است <b>اصلاً رانندگی نکنید</b>.</li>
<li>بیش از حد لازم ترمز نکنید، هنگام پیچیدن ترمز نکنید، فاصله دنبال کردن را بیشتر کنید و سرعت را ثابت نگه دارید.</li>
</ul>
<h4>حیوانات</h4>
<ul>
<li>برای اجتناب از حیوان، <b>به ترافیک روبه‌رو یا بیرون از جاده منحرف نشوید</b>.</li>
<li>بیشترین خطر: <b>اکتبر تا دسامبر</b>، به‌ویژه <b>سپیده‌دم و غروب</b>.</li>
<li>تصادف با حیوان بزرگ (گوزن، دام) را به پلیس گزارش دهید.</li>
</ul>
<p class="g-src">منابع: S19 (۵.۲۹، ۵.۳۰، ۵.۳۱)، S20</p>
</section>

<section id="g13">
<h3>۱۳. اتوبوس مدرسه، راه‌آهن، خودروهای امدادی و قانون Move Over</h3>
<h4>اتوبوس مدرسه (یکی از پرتکرارترین موضوعات)</h4>
<div class="tblwrap"><table class="gt">
<tr><th>نوع جاده</th><th>چه کسی باید بایستد؟</th></tr>
<tr><td>جاده دوطرفه (دوخطه یا چندخطه بدون جداکننده)</td><td><b>هر دو جهت</b></td></tr>
<tr><td>بزرگراه با میانه <b>آسفالته</b>، خط گردش وسط یا فقط خط‌کشی</td><td><b>هر دو جهت</b></td></tr>
<tr><td>بزرگراه با <b>مانع برآمده</b> یا میانه <b>غیرآسفالته دست‌کم ۵ فوتی</b></td><td>فقط ترافیک <b>هم‌جهت</b> (پشت اتوبوس). جهت مخالف با احتیاط عبور می‌کند.</td></tr>
</table></div>
<ul>
<li>متوقف بمانید تا <b>همه کودکان از جاده خارج شوند و بازوی ایست جمع شود</b>.</li>
<li>اگر در همان جهت اتوبوس هستید، <b>همیشه</b> بایستید.</li>
<li>مجازات: <b>۴ امتیاز</b> و جریمه <b>۲۰۰ دلار</b>؛ اگر از سمتی که کودکان سوار و پیاده می‌شوند عبور کنید <b>۴۰۰ دلار</b>. اگر منجر به آسیب جدی یا مرگ شود: <b>۶ امتیاز</b> و جریمه <b>۱۵۰۰ دلار</b> (بندهای 318.18 و 322.27).</li>
<li>در منطقه مدرسه، گذرگاه مدرسه و منطقه کار فعال، استفاده <b>دستی</b> از گوشی ممنوع است.</li>
</ul>
<h4>تقاطع راه‌آهن</h4>
<ul>
<li>تابلوی گرد زرد (RR) = پیش‌آگاهی. کراس‌باک = خود محل تقاطع.</li>
<li>وقتی چراغ‌ها چشمک می‌زنند، راهبند پایین است یا قطار نزدیک است: بین <b>۱۵ تا ۵۰ فوت</b> از نزدیک‌ترین ریل بایستید؛ تا بالا رفتن کامل راهبند و خاموش شدن چراغ صبر کنید. هرگز از کنار راهبند رد نشوید؛ ممکن است قطار دوم در راه باشد.</li>
<li>اتوبوس مدرسه حامل دانش‌آموز، خودروی مسافربری کرایه‌ای (به‌جز تاکسی) و حامل مواد منفجره/قابل اشتعال باید بین ۱۵ تا ۵۰ فوتی ریل بایستند، نگاه کنند و گوش دهند (حتی اگر قطاری دیده نمی‌شود) و روی ریل دنده عوض نکنند. اگر پلیس، چراغ یا تابلو اجازه عبور دهد توقف لازم نیست، اما اتوبوس مدرسه فقط با اجازه پلیس معاف است (بند 316.159).</li>
<li>عبور غیرقانونی از تقاطع راه‌آهن (مثلاً دور زدن راهبند): <b>۶ امتیاز</b> (بند 322.27).</li>
<li>خودرو روی ریل خاموش شد و قطار می‌آید: <b>فوراً همه پیاده شوند</b> و از ریل دور شوند؛ سپس ۹۱۱ یا شماره روی تابلوی آبی کنار ریل.</li>
<li>سبقت در ۱۰۰ فوتی تقاطع راه‌آهن ممنوع؛ پارک در ۵۰ فوتی ممنوع.</li>
</ul>
<h4>خودروهای امدادی</h4>
<ul>
<li>با آژیر یا چراغ چشمک‌زن: به <b>نزدیک‌ترین لبه جاده</b> (در جاده دوطرفه معمولاً راست) بروید و بایستید تا عبور کند؛ تقاطع را مسدود نکنید.</li>
<li>دنبال کردن ماشین آتش‌نشانی در حال پاسخ به حادثه در کمتر از <b>۵۰۰ فوت</b> ممنوع است.</li>
</ul>
<h4>قانون Move Over</h4>
<ul>
<li>برای خودروی امدادی، پلیس، یدک‌کش، خدمات شهری/ساخت‌وساز <b>و هر خودروی ازکارافتاده</b> متوقف با فلاشر، مشعل یا علامت اضطراری، یا با افراد حاضر کنار آن:</li>
<li>اگر ممکن است، <b>یک خط دور شوید</b>.</li>
<li>اگر نمی‌توانید: سرعت را به <b>۲۰ مایل در ساعت کمتر از حد مجاز</b> برسانید (مثال: ۵۵ → ۳۵؛ ۷۰ → ۵۰).</li>
<li>اگر حد مجاز <b>۲۰ مایل در ساعت یا کمتر</b> است: به <b>۵ مایل در ساعت</b> برسانید.</li>
</ul>
<p class="g-src">منابع: S5، S6، S21، 316.172، 316.159، 316.1575، 316.2025، 316.126، 322.27</p>
</section>

<section id="g14">
<h3>۱۴. عابران، دوچرخه، موتورسیکلت، کامیون و اتوبوس عمومی</h3>
<h4>عابران</h4>
<ul>
<li>مسئولیت اجتناب از برخورد با عابر با راننده است.</li>
<li>عابر در خط عابر (با یا بدون خط‌کشی): توقف و حق تقدم.</li>
<li><b>همیشه</b> به افراد نابینا (عصای سفید یا سگ راهنما) و افراد دارای محدودیت حرکتی حق تقدم بدهید.</li>
<li>از خودرویی که برای عابر جلوی خط عابر ایستاده <b>سبقت نگیرید</b>.</li>
</ul>
<h4>دوچرخه</h4>
<ul>
<li>هنگام سبقت دست‌کم <b>۳ فوت</b> فاصله بدهید و سرعت را کم کنید.</li>
<li>دوچرخه را در همه جاده‌ها <b>به‌جز بزرگراه‌های با دسترسی محدود (Expressway/بین‌ایالتی)</b>، در همه ساعات، انتظار داشته باشید.</li>
<li>قبل از عبور از خط دوچرخه برای گردش به راست، راهنما بزنید و به دوچرخه‌سوار راه بدهید؛ مستقیم جلوی او نپیچید.</li>
<li>قبل از باز کردن در، دوچرخه‌سوارانی که از پشت می‌آیند را بررسی کنید.</li>
<li>دوچرخه در شب باید چراغ سفید جلو (قابل‌دیدن از ۵۰۰ فوت) و چراغ و بازتابنده قرمز عقب (قابل‌دیدن از ۶۰۰ فوت) داشته باشد. دوچرخه‌سواران زیر ۱۶ سال باید کلاه ایمنی بپوشند.</li>
</ul>
<h4>موتورسیکلت</h4>
<ul>
<li>حق استفاده از <b>کل عرض خط</b>؛ هرگز خط را با موتور شریک نشوید.</li>
<li>فاصله دست‌کم <b>۴ ثانیه</b>. موتورها دورتر از آنچه هستند به نظر می‌رسند و تخمین سرعتشان سخت است؛ پیش از ورود به تقاطع یا تغییر خط <b>دست‌کم سه بار</b> نگاه کنید.</li>
</ul>
<h4>کامیون (No-Zone)</h4>
<ul>
<li>نقاط کور بزرگ در جلو، عقب و دو طرف. اگر راننده را در آینه بغل کامیون نمی‌بینید، او شما را نمی‌بیند.</li>
<li>در گردش به راست ممکن است به چپ باز کند؛ هرگز بین کامیون و جدول وارد نشوید.</li>
<li>پشت کامیونی که دنده‌عقب می‌رود رد نشوید. سریع سبقت بگیرید و کنارش نمانید. پس از سبقت، فقط وقتی <b>کابین</b> کامیون را در آینه عقب دیدید جلوی آن بروید. کامیون‌ها به‌دلیل اندازه‌شان کمی دیرتر از خودروهای سواری متوقف می‌شوند.</li>
</ul>
<h4>موپد و گلف‌کارت</h4>
<ul>
<li><b>موپد</b>: دست‌کم ۱۶ سال و حداقل گواهینامه کلاس E (تأییدیه موتورسیکلت لازم نیست).</li>
<li><b>گلف‌کارت</b>: فقط بین طلوع و غروب آفتاب (مگر استفاده شبانه برای گلف‌کارت مجهز مجاز شده باشد). طبق بند 316.212 (اصلاح ۲۰۲۳)، فرد زیر ۱۸ سال فقط با گواهینامه آموزشی یا گواهینامه رانندگی معتبر می‌تواند در جاده عمومی گلف‌کارت براند؛ ۱۸ سال به بالا کارت شناسایی عکس‌دار دولتی لازم دارد.</li>
</ul>
<h4>اتوبوس عمومی</h4>
<p>به اتوبوس عمومی که از جایگاه مخصوص راهنما زده و به ترافیک برمی‌گردد حق تقدم بدهید.</p>
<p class="g-src">منابع: S19 (۶.۱، ۶.۲، ۶.۳، ۶.۸)، 316.083، 316.130، 316.1301، 316.209، 316.0815</p>
</section>

<section id="g15">
<h3>۱۵. موقعیت‌های اضطراری</h3>
<div class="tblwrap"><table class="gt">
<tr><th>وضعیت</th><th>اقدام درست طبق کتابچه</th></tr>
<tr><td>ترکیدن لاستیک (Blowout)</td><td>ترمز نکنید؛ روی فرمان تمرکز کنید؛ به‌تدریج سرعت را کم کنید.</td></tr>
<tr><td>از کار افتادن ترمز</td><td>پدال را سریع و محکم پمپ کنید (به‌جز ABS)؛ دنده سنگین‌تر؛ ترمز دستی تدریجی.</td></tr>
<tr><td>خروج چرخ‌های راست از آسفالت</td><td>پا از گاز؛ فرمان محکم؛ مستقیم؛ وقتی امن شد آرام برگردید.</td></tr>
<tr><td>گیر کردن پدال گاز</td><td>ضربه به پدال؛ بالا کشیدن با نوک کفش؛ دنده خلاص.</td></tr>
<tr><td>لغزش (Skid)</td><td>پا از گاز؛ فرمان را به سمت لغزش/جایی که می‌خواهید بروید بچرخانید؛ ترمز شدید نکنید.</td></tr>
<tr><td>خودروی روبه‌رو در خط شما</td><td>سرعت کم؛ بوق؛ به <b>راست</b> بروید (نه چپ).</td></tr>
<tr><td>خودرو در آب</td><td>آرام بمانید؛ کمربند را باز کنید؛ شیشه را پایین بکشید و روی سقف خودرو بروید.</td></tr>
<tr><td>آتش گرفتن خودرو</td><td>کنار بکشید و موتور را خاموش کنید؛ اگر آتش بزرگ‌تر شد، از خودرو دور شوید.</td></tr>
<tr><td>ترمز خیس</td><td>آهسته؛ ترمز ملایم تا خشک شود.</td></tr>
<tr><td>خرابی خودرو</td><td>تا جای ممکن کنار جاده؛ فلاشر؛ خودرو را قابل‌دیدن کنید.</td></tr>
</table></div>
<h4>وقتی پلیس شما را متوقف می‌کند</h4>
<p>به منتهاالیه راست جاده بروید، موتور را خاموش کنید، در شب چراغ‌ها را روی حالت چراغ پارک بگذارید، آرام بنشینید و از دستورهای مأمور پیروی کنید.</p>
<h4>خرابی خودرو</h4>
<p>خودروی ازکارافتاده را جایی پارک کنید که از <b>۲۰۰ فوت</b> در هر جهت دیده شود؛ تا جای ممکن از جاده خارج شوید و فلاشر را روشن کنید.</p>
<p>اولویت کتابچه در اجتناب از تصادف: دور شدن از ترافیک روبه‌رو، برخورد با شیء ثابت به‌جای خودروی متحرک، و خروج از جاده به‌جای لغزش.</p>
<p class="g-src">منابع: S19 (۵.۳، ۵.۳۲)</p>
</section>

<section id="g16">
<h3>۱۶. تصادف، گزارش و کمک‌های اولیه</h3>
<ul>
<li>در صحنه بمانید و با پلیس محلی، گشت بزرگراه فلوریدا (<span dir="ltr">*FHP / *347</span>) یا کلانتری تماس بگیرید.</li>
<li>آماده باشید <b>نام، نشانی، شماره ثبت خودرو</b> را بدهید و <b>گواهینامه</b> را نشان دهید.</li>
<li>تصادف جزئی بدون مصدوم و خودرو قابل حرکت: خودرو را <b>از خط عبور خارج کنید</b> (قانون Move It).</li>
<li>اگر در تصادف به خودرو یا اموال خسارت وارد شده و گزارش پلیس لازم نبوده یا تهیه نشده است، راننده باید <b>ظرف ۱۰ روز</b> گزارش کتبی به FLHSMV بدهد (بند 316.066(1)(e)؛ قانون فعلی حداقل مبلغی تعیین نکرده است، هرچند کتابچه قدیمی‌تر رقم ۵۰۰ دلار را ذکر می‌کند).</li>
<li>برخورد با خودروی پارک‌شده: مالک را پیدا کنید یا <b>یادداشت</b> با نام، نشانی (و شماره پلاک) در جای قابل‌دید بگذارید و به پلیس اطلاع دهید.</li>
<li>ترک صحنه با خسارت بیش از ۵۰ دلار: <b>۶ امتیاز</b>.</li>
</ul>
<h4>کمک‌های اولیه</h4>
<ul>
<li>کسی را برای کمک بفرستید (۹۱۱).</li>
<li>سه قاعده: برقراری تنفس، توقف خونریزی با <b>فشار مستقیم</b>، درمان شوک (مصدوم را آرام کنید؛ <b>چیزی برای نوشیدن ندهید</b>).</li>
<li>مصدومی را که نمی‌تواند حرکت کند یا از درد <b>گردن یا کمر</b> شکایت دارد جابه‌جا نکنید. <b>کلاه ایمنی</b> موتورسوار یا دوچرخه‌سوار را برندارید.</li>
</ul>
<p class="g-src">منابع: S19 (۴.۱۰، ۵.۳۳)، 316.061، 316.063، 316.066، 322.27، S15</p>
</section>

<section id="g17">
<h3>۱۷. الکل، مواد مخدر و DUI</h3>
<ul>
<li>DUI یعنی رانندگی تحت تأثیر الکل، مواد شیمیایی مشخص‌شده (مانند مواد استنشاقی) یا <b>مواد کنترل‌شده، از جمله داروهای تجویزی</b>، به میزانی که توانایی‌های عادی مختل شود (بند 316.193). داروهای بدون نسخه هم ممکن است خواب‌آلودگی ایجاد کنند.</li>
<li>الکل ابتدا <b>قضاوت و خودکنترلی</b> را مختل می‌کند. تنها چیزی که هوشیاری را برمی‌گرداند <b>زمان</b> است (قهوه یا دوش سرد اثری ندارد).</li>
<li>یک نوشیدنی استاندارد: ۱۲ اونس آبجو ≈ ۵ اونس شراب ≈ ۱.۵ اونس مشروب ۴۰ درصد.</li>
<li><b>ظرف باز</b> الکل در بخش سرنشینان برای راننده و سرنشینان ممنوع است.</li>
</ul>

<section id="g18">
<h3>۱۸. گواهینامه، قوانین نوجوانان (GDL) و سیستم امتیاز منفی</h3>
<h4>گواهینامه آموزشی (Learner’s License)</h4>
<ul>
<li>حداقل سن <b>۱۵</b> سال.</li>
<li>همیشه همراه راننده دارای گواهینامه <b>۲۱ سال به بالا</b> در صندلی جلو (کنار راننده).</li>
<li><b>۳ ماه اول</b>: فقط در روشنایی روز. پس از آن: تا <b>۱۰ شب</b>.</li>
<li>باید دست‌کم <b>۱۲ ماه</b> یا تا ۱۸ سالگی (هر کدام زودتر) نگه داشته شود، بدون محکومیت تخلف (یا یک تخلف با adjudication withheld).</li>
<li><b>۵۰ ساعت</b> رانندگی تحت نظارت، شامل <b>۱۰ ساعت شب</b>.</li>
</ul>
<h4>گواهینامه کلاس E برای نوجوانان</h4>

<tr><th>سن</th><th>ساعات ممنوع</th><th>استثنا</th></tr>

<p><b>نکات امتیاز:</b> جریمه‌ای که فقط با <b>دوربین چراغ قرمز</b> ثبت شود امتیاز منفی ندارد. عبور غیرقانونی از تقاطع راه‌آهن ۶ امتیاز دارد.</p>
<h4>قوانین دیگر گواهینامه</h4>
<ul>
<li>تغییر نشانی یا نام: ظرف <b>۳۰ روز</b>.</li>
<li>ساکن جدید: گواهینامه فلوریدا ظرف <b>۳۰ روز</b>؛ ثبت خودرو و بیمه فلوریدا ظرف <b>۱۰ روز</b>.</li>
<li>تخلفات جدی: تغییر دادن گواهینامه، اجازه استفاده دیگری از گواهینامه شما، درخواست جعلی، داشتن بیش از یک گواهینامه/کارت شناسایی، <b>اجازه رانندگی به فرد بدون گواهینامه با خودروی شما</b>، اطلاعات نادرست به پلیس یا در گزارش تصادف، گزارش ندادن تصادف.</li>
<li>راننده مسئول زباله‌ای است که از خودرو بیرون ریخته می‌شود. زباله تا ۱۵ پوند: تخلف غیرکیفری با جریمه ۱۵۰ دلار؛ ۱۵ تا ۵۰۰ پوند: جنحه درجه یک؛ بیش از ۵۰۰ پوند: جنایت درجه سه (بند 403.413).</li>
<li><b>بینایی</b>: ۲۰/۴۰ یا بهتر در هر چشم (با یا بدون عینک) بدون ارجاع به متخصص پذیرفته می‌شود.</li>
</ul>

</section>

<section id="g19">
<h3>۱۹. بیمه، کمربند، صندلی کودک و تلفن همراه</h3>
<ul>
<li><b>بیمه</b>: هر خودروی ثبت‌شده باید دست‌کم <b>۱۰٬۰۰۰ دلار PIP</b> و <b>۱۰٬۰۰۰ دلار PDL</b> داشته باشد. لایحه‌های حذف PIP در ۲۰۲۵ و ۲۰۲۶ تصویب نشدند. نداشتن بیمه = تعلیق گواهینامه و پلاک و هزینه بازگشت تا ۵۰۰ دلار.</li>
<li><b>کمربند</b>: الزامی برای راننده، همه سرنشینان صندلی جلو و همه سرنشینان <b>زیر ۱۸ سال</b> در هر صندلی.</li>
<li><b>صندلی کودک</b>: ۰ تا ۳ سال: صندلی کودک جداگانه یا صندلی یکپارچه کارخانه‌ای. ۴ و ۵ سال: صندلی جداگانه، یکپارچه یا بوستر. طبق FLHSMV کودکان تا دست‌کم ۱۲ سالگی بهتر است در صندلی عقب بنشینند، زیرا باز شدن کیسه هوای جلو برای کودکان خطرناک است.</li>
<li><b>کودک تنها در خودرو</b>: زیر ۶ سال، حداکثر ۱۵ دقیقه؛ با موتور روشن یا خطر سلامتی، هیچ‌وقت.</li>
<li><b>پیامک هنگام رانندگی</b>: تخلف <b>اولیه</b> (پلیس فقط به همین دلیل می‌تواند شما را متوقف کند).</li>
<li><b>منطقه مدرسه، گذرگاه مدرسه، منطقه کار فعال</b>: هر نوع استفاده <b>دستی</b> از گوشی ممنوع (۳ امتیاز)؛ فقط هندزفری.</li>
<li><b>هدفون</b>: ممنوع؛ هدست تلفن <b>یک‌گوش</b> مجاز.</li>
</ul>
<p class="g-src">منابع: S8، S18، S9، 316.613، 316.6135، 316.305، 316.306، 316.304، S10</p>
</section>

<section id="g22">
<h3>۲۲. چک‌لیست روز آزمون</h3>
<ul class="g-check">
<li>وقت قبلی در Tax Collector هیلزبورو یا FLHSMV گرفته‌ام.</li>
<li>مدارک هویت، شماره تأمین اجتماعی و دو مدرک اقامت فلوریدا را طبق فهرست رسمی آماده کرده‌ام.</li>
<li>دوره TLSAE (بزرگسالان) یا DETS (زیر ۱۸ سال) را تمام کرده‌ام (یا گواهینامه خارجی معتبر اصل دارم).</li>
<li>برای آزمون بینایی، عینک دید دور همراه دارم (عینک مطالعه کافی نیست).</li>
<li>زیر ۱۸ سال: فرم رضایت والدین.</li>
<li>هر ۶ آزمون تمرینی را در حالت English only با دست‌کم ۴۷ از ۵۰ گذرانده‌ام.</li>
<li>جدول اعداد (بخش ۲۰) و واژه‌نامه (بخش ۲۱) را یک بار دیگر مرور کرده‌ام.</li>
<li>در آزمون: هر سؤال را کامل می‌خوانم، به NOT/ALWAYS/ONLY دقت می‌کنم و ایمن‌ترین پاسخ را انتخاب می‌کنم.</li>
</ul>
<p class="g-note">موفق باشید! این راهنما و آزمون‌های تمرینی برای یادگیری طراحی شده‌اند و سؤال‌های واقعی آزمون FLHSMV نیستند.</p>
</section>

ابان یک‌طرفه را هم نشان دهد؛ در آن حالت آن طرف خط ترافیک مخالف نیست."}, {"t": "row", "s": ["S2"], "sg": null, "q": ["Two vehicles arrive at a four-way stop at the same time. Which vehicle should go first?", "دو خودرو هم‌زمان به تقاطع ایست چهارطرفه می‌رسند. کدام باید اول حرکت کند؟"], "o": [["The vehicle on the right", "خودرویی که در سمت راست است"], ["The vehicle on the left", "خودرویی که در سمت چپ است"], ["The larger vehicle", "خودروی بزرگ‌تر"], ["Whichever driver is in a hurry", "راننده‌ای که عجله دارد"]], "a": 0, "x": "در ایست چهارطرفه، هر که «اول» برسد اول حرکت می‌کند. اگر دو خودرو هم‌زمان برسند، راننده سمت چپ باید به راننده «سمت راست» حق تقدم بدهد. اندازه خودرو یا عجله راننده هیچ نقشی در حق تقدم ندارد."}, {"t": "row", "s": ["S2", "316.122"], "sg": null, "q": ["You are turning left at an intersection on a green light (no arrow). You must:", "در تقاطع با چراغ سبز (بدون فلش) می‌خواهید به چپ بپیچید. چه باید بکنید؟"], "o": [["Yield to oncoming traffic and pedestrians, then turn when it is safe", "به ترافیک روبه‌رو و عابران حق تقدم بدهید و وقتی امن شد بپیچید"], ["Turn first, because your light is green", "اول بپیچید، چون چراغ شما سبز است"], ["Always wait for the light to turn yellow before turning", "همیشه صبر کنید تا چراغ زرد شود و بعد بپیچید"], ["Turn quickly in front of oncoming cars before they get close", "قبل از نزدیک شدن ماشین‌های روبه‌رو، سریع جلوی آن‌ها بپیچید"]], "a": 0, "x": "چراغ سبز معمولی (بدون فلش) یعنی گردش به چپ «غیرحمایت‌شده» است: ترافیک روبه‌رو هم سبز است و حق تقدم دارد. باید به آن‌ها و به عابران راه بدهید و در فاصله امن بپیچید. سبز بودن چراغ شما حق تقدم بر ترافیک مستقیم روبه‌رو نمی‌دهد. پیچیدن عجولانه جلوی ماشین‌ها یکی از علل اصلی تصادف است. قانونی برای «صبر تا زرد شدن» وجود ندارد."}, {"t": "row", "s": ["H5.19", "316.126"], "sg": null, "q": ["An emergency vehicle with flashing lights and a siren is approaching. You must:", "یک خودروی امدادی با چراغ‌های چشمک‌زن و آژیر در حال نزدیک شدن است. چه باید بکنید؟"], "o": [["Pull over to the closest edge of the road, clear of any intersection, and stop until it passes", "به نزدیک‌ترین لبه جاده، بیرون از تقاطع، کنار بکشید و تا عبور آن توقف کنید"], ["Speed up to get out of its way", "سرعت را زیاد کنید تا از سر راهش کنار بروید"], ["Stop immediately where you are, even inside an intersection", "همان‌جا فوراً بایستید، حتی اگر داخل تقاطع هستید"], ["Keep driving at the same speed in your lane", "با همان سرعت در خط خود به رانندگی ادامه دهید"]], "a": 0, "x": "بند 316.126 و کتابچه فلوریدا: باید به خودروی امدادی راه بدهید، به «نزدیک‌ترین لبه جاده» (در جاده‌های معمولی دوطرفه یعنی لبه سمت راست) بروید، بیرون از تقاطع، و بایستید تا عبور کند. اگر داخل تقاطع هستید، اول از تقاطع خارج شوید و بعد کنار بکشید؛ توقف وسط تقاطع راه را می‌بندد. افزایش سرعت خطرناک است و ادامه دادن به حرکت با همان سرعت، راه خودروی امدادی را می‌بندد."}, {"t": "row", "s": ["S2", "316.1301"], "sg": null, "q": ["A pedestrian using a white cane or a guide dog is crossing the street. You must:", "عابری با عصای سفید یا سگ راهنما در حال عبور از خیابان است. چه باید بکنید؟"], "o": [["Always stop and yield the right-of-way", "همیشه توقف کنید و به او حق تقدم بدهید"], ["Yield only if they are in a marked crosswalk", "فقط اگر روی خط عابر پیاده است به او راه بدهید"], ["Honk to warn the pedestrian", "برای هشدار به عابر بوق بزنید"], ["Drive slowly around the pedestrian", "به‌آرامی از کنار عابر رد شوید"]], "a": 0, "x": "عصای سفید یا سگ راهنما نشان می‌دهد عابر نابینا یا کم‌بیناست. قانون فلوریدا راننده را موظف می‌کند «همیشه» توقف کند و حق تقدم را به او بدهد، چه روی خط عابر باشد چه نباشد. بوق زدن ممکن است او را بترساند و گیج کند. دور زدن از کنار او هم خطرناک و غیرقانونی است."}, {"t": "row", "s": ["S2"], "sg": null, "q": ["When entering a roundabout, you must:", "هنگام ورود به میدان (راندَباوت)، چه باید بکنید؟"], "o": [["Yield to traffic already in the roundabout and travel counterclockwise", "به ترافیکی که داخل میدان است حق تقدم بدهید و در جهت خلاف عقربه‌های ساعت حرکت کنید"], ["Enter first, because traffic inside must yield to you", "اول وارد شوید، چون ترافیک داخل میدان باید به شما راه بدهد"], ["Travel clockwise around the center island", "در جهت عقربه‌های ساعت دور جزیره وسط حرکت کنید"], ["Stop inside the roundabout to let others enter", "داخل میدان بایستید تا دیگران وارد شوند"]], "a": 0, "x": "در میدان‌های آمریکا، خودروهایی که «داخل» میدان هستند حق تقدم دارند. با سرعت کم نزدیک شوید، به ترافیک سمت چپ (داخل میدان) راه بدهید، به راست وارد شوید و «خلاف جهت عقربه‌های ساعت» حرکت کنید. حرکت در جهت عقربه‌ها یعنی رانندگی خلاف جهت. توقف داخل میدان هم جریان ترافیک را مختل و خطر ایجاد می‌کند."}, {"t": "row", "s": ["S2", "316.1974"], "sg": null, "q": ["A funeral procession led by an escort vehicle is going through an intersection. You should:", "یک کاروان تشییع جنازه که خودروی اسکورت جلوی آن است، در حال عبور از تقاطع است. چه باید بکنید؟"], "o": [["Yield and let the entire procession pass", "حق تقدم بدهید و بگذارید کل کاروان عبور کند"], ["Drive between the cars of the procession if there is a gap", "اگر فاصله‌ای بین ماشین‌های کاروان هست، از بین آن‌ها رد شوید"], ["Proceed if your light turns green", "اگر چراغ شما سبز شد، حرکت کنید"], ["Honk to let them know you are waiting", "بوق بزنید تا بدانند منتظر هستید"]], "a": 0, "x": "طبق قانون فلوریدا، وقتی خودروی جلوی کاروان تشییع به‌طور قانونی وارد تقاطع شد، بقیه کاروان حق دارند پشت سر آن عبور کنند و شما باید حق تقدم بدهید، حتی اگر چراغ شما سبز شده باشد. ورود به میان کاروان ممنوع است. بوق زدن هم بی‌احترامی و بی‌فایده است."}, {"t": "row", "s": ["S2", "316.125"], "sg": null, "q": ["When you enter a road from a driveway, alley, or parking lot, you must:", "وقتی از راه ورودی خانه، کوچه یا پارکینگ وارد جاده می‌شوید، چه باید بکنید؟"], "o": [["Yield to pedestrians and to vehicles already on the road", "به عابران و خودروهایی که در جاده هستند حق تقدم بدهید"], ["Expect road traffic to stop for you", "انتظار داشته باشید ترافیک جاده برای شما بایستد"], ["Yield only to vehicles coming from your left", "فقط به خودروهایی که از سمت چپ می‌آیند راه بدهید"], ["Sound your horn and enter quickly", "بوق بزنید و سریع وارد شوید"]], "a": 0, "x": "راننده‌ای که از ورودی خانه، کوچه یا پارکینگ وارد جاده اصلی می‌شود «هیچ» حق تقدمی ندارد: در مناطق تجاری یا مسکونی باید قبل از پیاده‌رو توقف کند و به عابران و به «همه» خودروهای جاده (از هر دو طرف) راه بدهد. انتظار توقف از دیگران، یا بوق زدن و ورود سریع، باعث تصادف می‌شود."}, {"t": "speed", "s": ["S2", "S11"], "sg": null, "q": ["Unless otherwise posted, the maximum speed limit in Florida business or residential areas is:", "اگر تابلوی دیگری نصب نشده باشد، حداکثر سرعت در مناطق تجاری یا مسکونی فلوریدا چقدر است؟"], "o": [["25 mph", "۲۵ مایل در ساعت"], ["30 mph", "۳۰ مایل در ساعت"], ["35 mph", "۳۵ مایل در ساعت"], ["45 mph", "۴۵ مایل در ساعت"]], "a": 1, "x": "طبق جدول کتابچه رسمی و بند 316.183، سرعت پیش‌فرض در مناطق تجاری یا مسکونی ۳۰ مایل در ساعت (حدود ۴۸ کیلومتر) است. شهرها می‌توانند پس از بررسی، در خیابان‌های محلی مناطق مسکونی حداکثر سرعت را ۲۰ یا ۲۵ مایل در ساعت تعیین کنند و شهرستان‌ها ۲۵ مایل در ساعت (با نصب تابلو، بند 316.189)، ولی پیش‌فرض بدون تابلو ۳۰ است. ۳۵ و ۴۵ عدد پیش‌فرض قانونی نیستند."}, {"t": "speed", "s": ["S2", "H5.11", "316.187"], "sg": null, "q": ["The maximum speed limit on Florida rural interstate highways is:", "حداکثر سرعت در بزرگراه‌های بین‌ایالتی خارج از شهر در فلوریدا چقدر است؟"], "o": [["55 mph", "۵۵ مایل در ساعت"], ["65 mph", "۶۵ مایل در ساعت"], ["70 mph", "۷۰ مایل در ساعت"], ["75 mph", "۷۵ مایل در ساعت"]], "a": 2, "x": "حداکثر سرعت در بزرگراه‌های بین‌ایالتی خارج از شهر و بزرگراه‌های با دسترسی محدود (مثل Turnpike) ۷۰ مایل در ساعت است. ۵۵ مایل در ساعت حداکثر پیش‌فرض برای «سایر جاده‌ها» است. ۶۵ در برخی بزرگراه‌های جداشده با تابلو دیده می‌شود ولی عدد جدول کتابچه برای بین‌ایالتی روستایی نیست. ۷۵ در فلوریدا مجاز نیست."}, {"t": "speed", "s": ["S11"], "sg": null, "q": ["On an interstate highway with four or more lanes and a posted speed limit of 70 mph, the minimum speed is:", "در بزرگراه بین‌ایالتی با چهار خط یا بیشتر و حداکثر سرعت ۷۰ مایل در ساعت، حداقل سرعت مجاز چقدر است؟"], "o": [["40 mph", "۴۰ مایل در ساعت"], ["45 mph", "۴۵ مایل در ساعت"], ["50 mph", "۵۰ مایل در ساعت"], ["55 mph", "۵۵ مایل در ساعت"]], "a": 2, "x": "بند 316.183 قانون فلوریدا: حداقل سرعت در بزرگراه‌های بین‌ایالتی با چهار خط یا بیشتر ۴۰ مایل در ساعت است، «مگر» وقتی حداکثر سرعت ۷۰ باشد که در آن صورت حداقل ۵۰ مایل در ساعت می‌شود. پس ۴۰ برای وقتی است که حداکثر کمتر از ۷۰ باشد. ۴۵ و ۵۵ در قانون ذکر نشده‌اند. رانندگی خیلی آهسته هم مانند سرعت زیاد خطرناک است."}, {"t": "speed", "s": ["S2"], "sg": null, "q": ["Unless a different speed is posted, the school zone speed limit listed in the Florida Driver Handbook is:", "اگر سرعت دیگری با تابلو اعلام نشده باشد، حداکثر سرعت منطقه مدرسه طبق کتابچه رانندگی فلوریدا چقدر است؟"], "o": [["15 mph", "۱۵ مایل در ساعت"], ["20 mph", "۲۰ مایل در ساعت"], ["25 mph", "۲۵ مایل در ساعت"], ["30 mph", "۳۰ مایل در ساعت"]], "a": 1, "x": "جدول سرعت کتابچه رسمی، سرعت منطقه مدرسه را ۲۰ مایل در ساعت اعلام می‌کند (در ساعاتی که چراغ‌های چشمک‌زن روشن‌اند یا طبق تابلو). ۳۰ سرعت مناطق مسکونی است. در عمل همیشه از عددی که روی تابلوی منطقه مدرسه نوشته شده پیروی کنید. تخلف سرعت در منطقه مدرسه جریمه سنگین‌تری دارد."}, {"t": "parking", "s": ["S12"], "sg": null, "q": ["You may not park within how many feet of a fire hydrant?", "در چه فاصله‌ای از شیر آتش‌نشانی (هیدرانت) پارک کردن ممنوع است؟"], "o": [["10 feet", "۱۰ فوت"], ["15 feet", "۱۵ فوت"], ["20 feet", "۲۰ فوت"], ["30 feet", "۳۰ فوت"]], "a": 1, "x": "طبق بند 316.1945، پارک کردن در فاصله ۱۵ فوتی (حدود ۴.۵ متر) شیر آتش‌نشانی ممنوع است تا آتش‌نشانی بتواند سریع به آن وصل شود. ۲۰ فوت مربوط به خط عابر پیاده در تقاطع و ورودی ایستگاه آتش‌نشانی است؛ ۳۰ فوت مربوط به نزدیک شدن به تابلوی ایست، چراغ چشمک‌زن یا چراغ راهنمایی است. ۱۰ فوت در قانون وجود ندارد."}, {"t": "parking", "s": ["S2", "316.195"], "sg": null, "q": ["When parallel parking next to a curb, your wheels must be no more than how far from the curb?", "هنگام پارک موازی کنار جدول، چرخ‌های شما حداکثر چقدر می‌توانند از جدول فاصله داشته باشند؟"], "o": [["6 inches", "۶ اینچ"], ["12 inches", "۱۲ اینچ"], ["18 inches", "۱۸ اینچ"], ["24 inches", "۲۴ اینچ"]], "a": 1, "x": "قانون فلوریدا (بند 316.195) می‌گوید خودروی پارک‌شده باید موازی با جدول و حداکثر ۱۲ اینچ (حدود ۳۰ سانتی‌متر) از آن فاصله داشته باشد. ۱۸ و ۲۴ اینچ یعنی خودرو بیش از حد وارد خط عبور شده و ۶ اینچ عدد قانونی نیست (هرچند نزدیک‌تر بودن اشکالی ندارد، ولی حد قانونی ۱۲ اینچ است)."}, {"t": "parking", "s": ["S2"], "sg": null, "q": ["When parking DOWNHILL next to a curb, turn your front wheels:", "هنگام پارک در «سراشیبی» کنار جدول، چرخ‌های جلو را به کدام سمت بچرخانید؟"], "o": [["Toward the curb (to the right)", "به سمت جدول (به راست)"], ["Away from the curb (to the left)", "دور از جدول (به چپ)"], ["Straight ahead", "مستقیم"], ["It does not matter if the parking brake is set", "اگر ترمز دستی کشیده شده باشد فرقی نمی‌کند"]], "a": 0, "x": "در سراشیبی، اگر ترمز رها شود خودرو رو به جلو حرکت می‌کند؛ چرخاندن چرخ‌ها «به سمت جدول» باعث می‌شود چرخ به جدول گیر کند و خودرو وارد خیابان نشود. «دور از جدول» مربوط به پارک در «سربالایی» با جدول است. چرخ مستقیم هیچ محافظتی ندارد. ترمز دستی هم ممکن است از کار بیفتد، پس چرخاندن چرخ‌ها همیشه لازم است."}, {"t": "dui", "s": ["S2", "S7"], "sg": null, "q": ["For drivers 21 and older, Florida law says you are driving under the influence (DUI) if your blood or breath alcohol level is:", "برای رانندگان ۲۱ سال به بالا، طبق قانون فلوریدا اگر میزان الکل خون یا تنفس شما ... باشد، رانندگی تحت تأثیر (DUI) محسوب می‌شود:"], "o": [["0.05 or higher", "۰.۰۵ یا بیشتر"], ["0.08 or higher", "۰.۰۸ یا بیشتر"], ["0.10 or higher", "۰.۱۰ یا بیشتر"], ["0.15 or higher", "۰.۱۵ یا بیشتر"]], "a": 1, "x": "حد قانونی برای بزرگسالان در فلوریدا ۰.۰۸ است. ۰.۱۵ حد قانونی نیست؛ بلکه سطحی است که از آن به بعد مجازات‌ها شدیدتر می‌شود. ۰.۰۵ و ۰.۱۰ حد قانونی فلوریدا نیستند. توجه کنید که حتی زیر ۰.۰۸، اگر توانایی‌های عادی شما مختل شده باشد، باز هم می‌توانید به DUI محکوم شوید."}, {"t": "dui", "s": ["S7", "322.2616"], "sg": null, "q": ["Under Florida's Zero Tolerance law, a driver under 21 faces license suspension with a blood or breath alcohol level of:", "طبق قانون «تحمل صفر» فلوریدا، راننده زیر ۲۱ سال با چه میزان الکل خون یا تنفس با تعلیق گواهینامه روبه‌رو می‌شود؟"], "o": [["0.01 or higher", "۰.۰۱ یا بیشتر"], ["0.02 or higher", "۰.۰۲ یا بیشتر"], ["0.05 or higher", "۰.۰۵ یا بیشتر"], ["0.08 or higher", "۰.۰۸ یا بیشتر"]], "a": 1, "x": "برای رانندگان زیر ۲۱ سال، حد مجاز ۰.۰۲ است (بند 322.2616) که عملاً یعنی حتی یک نوشیدنی هم ممنوع است. ۰.۰۸ حد بزرگسالان است. ۰.۰۵ برای زیر ۲۱ ساله‌ها سطحی است که پس از آن گذراندن ارزیابی و دوره سوءمصرف مواد الزامی می‌شود، نه حد شروع تعلیق. ۰.۰۱ در قانون ذکر نشده است."}, {"t": "dui", "s": ["S7", "316.1939"], "sg": null, "q": ["If you refuse a lawful breath, blood, or urine test for the FIRST time, your license will be suspended for:", "اگر برای «اولین بار» از انجام آزمایش قانونی تنفس، خون یا ادرار خودداری کنید، گواهینامه شما چه مدت تعلیق می‌شود؟"], "o": [["3 months", "۳ ماه"], ["6 months", "۶ ماه"], ["1 year", "۱ سال"], ["18 months", "۱۸ ماه"]], "a": 2, "x": "طبق صفحه رسمی FLHSMV، اولین امتناع از آزمایش = تعلیق ۱ ساله. امتناع دوم یا بیشتر = تعلیق ۱۸ ماهه. همچنین از ۱ اکتبر ۲۰۲۵ (قانون Trenton، بند 316.1939) امتناع اول از آزمایش «تنفس یا ادرار» جنحه درجه دو و امتناع دوم جنحه درجه یک (misdemeanor) است. ۳ و ۶ ماه مجازات امتناع نیستند. این قانون را «رضایت ضمنی» می‌نامند: با رانندگی در فلوریدا پیشاپیش به آزمایش رضایت داده‌اید."}, {"t": "dui", "s": ["S2"], "sg": null, "q": ["What is the only thing that actually removes alcohol from your body and sobers you up?", "تنها چیزی که واقعاً الکل را از بدن خارج می‌کند و شما را هوشیار می‌کند چیست؟"], "o": [["Time", "گذشت زمان"], ["Black coffee", "قهوه تلخ"], ["A cold shower", "دوش آب سرد"], ["Exercise or fresh air", "ورزش یا هوای تازه"]], "a": 0, "x": "کبد با سرعت ثابتی (تقریباً یک نوشیدنی استاندارد در ساعت) الکل را تجزیه می‌کند و هیچ چیز این سرعت را بالا نمی‌برد. قهوه، دوش سرد، ورزش یا هوای تازه ممکن است احساس هوشیاری بدهند، اما میزان الکل خون و اختلال در قضاوت را کم نمی‌کنند. تنها راه، گذشت زمان است."}, {"t": "dui", "s": ["S2", "316.1936"], "sg": null, "q": ["In a private passenger car on a public road, an open container of alcohol within reach of the occupants is:", "در یک خودروی شخصی در جاده عمومی، ظرف باز نوشیدنی الکلی در دسترس سرنشینان:"], "o": [["Illegal for both the driver and passengers", "هم برای راننده و هم برای سرنشینان غیرقانونی است"], ["Legal for passengers aged 21 or older", "برای سرنشینان ۲۱ سال به بالا قانونی است"], ["Legal if the driver has not been drinking", "اگر راننده ننوشیده باشد قانونی است"], ["Legal if it is kept in the back seat", "اگر روی صندلی عقب باشد قانونی است"]], "a": 0, "x": "قانون «ظرف باز» فلوریدا (بند 316.1936) داشتن ظرف باز الکل را برای راننده «و» سرنشینان ممنوع می‌کند. ظرف باز فقط در صندوق عقبِ قفل‌شده، داشبورد قفل‌شده یا سایر فضاهای قفل‌شده غیرسرنشین مجاز است (استثناها محدودند: سرنشینان وسیله‌ای که راننده آن طبق قرارداد حمل مسافر کار می‌کند و گواهینامه تجاری CDL با مجوز مسافر دارد، سرنشینان اتوبوسی که راننده‌اش CDL با مجوز مسافر دارد، و سرنشینان موتورهوم مستقل با طول بیش از ۲۱ فوت؛ یک تاکسی یا خودروی اینترنتی معمولی، که راننده‌اش معمولاً گواهینامه تجاری با مجوز مسافر ندارد، و خودروی اجاره‌ای شخصی مشمول این استثنا نیستند). صندلی عقب جزو محل سرنشینان است، پس مجاز نیست. سن سرنشین یا ننوشیدن راننده هم استثنا ایجاد نمی‌کند."}, {"t": "license", "s": ["S1"], "sg": null, "q": ["To pass Florida's Class E Knowledge Exam, how many of the 50 questions must you answer correctly?", "برای قبولی در آزمون دانش کلاس E فلوریدا، به چند سؤال از ۵۰ سؤال باید درست پاسخ دهید؟"], "o": [["35", "۳۵"], ["38", "۳۸"], ["40", "۴۰"], ["45", "۴۵"]], "a": 2, "x": "طبق صفحه رسمی FLHSMV، آزمون کلاس E شامل ۵۰ سؤال چندگزینه‌ای است و برای قبولی باید دست‌کم ۴۰ سؤال (۸۰٪) را درست جواب دهید؛ یعنی حداکثر ۱۰ اشتباه مجاز است. ۳۵ و ۳۸ کمتر از حد نصاب‌اند و ۴۵ بیش از حد لازم است."}, {"t": "license", "s": ["S4"], "sg": null, "q": ["During the first three months after a learner's license is issued, the holder may drive:", "در سه ماه اول پس از صدور گواهینامه آموزشی (Learner's License)، دارنده آن چه زمانی می‌تواند رانندگی کند؟"], "o": [["Only during daylight hours", "فقط در ساعات روشنایی روز"], ["Until 10 p.m.", "تا ساعت ۱۰ شب"], ["Until 11 p.m.", "تا ساعت ۱۱ شب"], ["At any time with a licensed adult", "هر زمان، به همراه یک بزرگسال دارای گواهینامه"]], "a": 0, "x": "قوانین گواهینامه مرحله‌ای (GDL): در ۳ ماه اول فقط در ساعات روشنایی روز و همیشه با راننده دارای گواهینامه ۲۱ سال به بالا. پس از ۳ ماه اول، تا ساعت ۱۰ شب مجاز است. «۱۱ شب» مربوط به محدودیت دارنده گواهینامه ۱۶ ساله است. رانندگی «هر زمان» برای دارنده گواهینامه آموزشی هرگز مجاز نیست."}, {"t": "license", "s": ["S4"], "sg": null, "q": ["A learner's license holder must always be accompanied by a licensed driver who is at least what age, sitting in the front passenger seat?", "دارنده گواهینامه آموزشی همیشه باید همراه راننده‌ای دارای گواهینامه باشد که دست‌کم چند سال دارد و روی صندلی جلو، کنار راننده، نشسته است؟"], "o": [["18", "۱۸"], ["19", "۱۹"], ["21", "۲۱"], ["25", "۲۵"]], "a": 2, "x": "قانون فلوریدا: همراه دارنده گواهینامه آموزشی باید راننده‌ای با گواهینامه معتبر و دست‌کم ۲۱ ساله باشد که در صندلی جلو، کنار راننده، بنشیند. ۱۸ و ۱۹ سال کافی نیستند و ۲۵ سال بیش از حد لازم است. این قانون برای بزرگسالانی که گواهینامه آموزشی می‌گیرند هم صدق می‌کند."}, {"t": "license", "s": ["322.19", "https://www.flhsmv.gov/name-and-address-changes/"], "sg": null, "q": ["If you move, Florida law requires you to update the address on your driver license within:", "اگر نقل‌مکان کنید، قانون فلوریدا شما را موظف می‌کند نشانی روی گواهینامه را ظرف چه مدتی به‌روز کنید؟"], "o": [["10 days", "۱۰ روز"], ["30 days", "۳۰ روز"], ["60 days", "۶۰ روز"], ["90 days", "۹۰ روز"]], "a": 1, "x": "طبق بند 322.19، پس از تغییر نشانی (و همچنین تغییر نام قانونی) باید ظرف ۳۰ روز گواهینامه جایگزینِ دارای اطلاعات جدید بگیرید. تغییر نشانی را می‌توان آنلاین از طریق پورتال MyDMV یا حضوری انجام داد؛ اما تغییر نام فقط حضوری در دفتر انجام می‌شود. ۱۰ روز مهلت دیگری است (مثلاً ثبت خودرو برای ساکنان جدید)، و ۶۰ یا ۹۰ روز در این قانون وجود ندارد."}, {"t": "safe", "s": ["S2", "H5.26"], "sg": null, "q": ["In good weather and road conditions, a safe following distance behind the vehicle ahead is at least:", "در هوای خوب و جاده مناسب، فاصله ایمن پشت سر خودروی جلویی دست‌کم چقدر است؟"], "o": [["Three to four seconds", "سه تا چهار ثانیه"], ["One second", "یک ثانیه"], ["Half a second", "نیم ثانیه"], ["One car length, regardless of speed", "یک طول خودرو، صرف‌نظر از سرعت"]], "a": 0, "x": "کتابچه رانندگی فلوریدا (بخش فاصله‌های ایمن) می‌گوید حداقل فاصله دنبال کردن «سه تا چهار ثانیه» است و در هوا یا ترافیک غیرعادی یک ثانیه دیگر اضافه کنید. روش اندازه‌گیری: وقتی عقب خودروی جلویی از یک نقطه ثابت (تابلو یا تیر) رد شد، ثانیه‌ها را بشمارید تا شما به همان نقطه برسید. نیم ثانیه و یک ثانیه برای واکنش کافی نیستند و «یک طول خودرو» غلط است، چون فاصله لازم با افزایش سرعت بیشتر می‌شود."}, {"t": "safe", "s": ["S2", "316.238"], "sg": null, "q": ["You must dim your high-beam headlights when you are within how many feet of an ONCOMING vehicle?", "وقتی به چند فوتی خودروی «روبه‌رو» می‌رسید، باید نور بالا را به نور پایین تغییر دهید؟"], "o": [["200 feet", "۲۰۰ فوت"], ["300 feet", "۳۰۰ فوت"], ["500 feet", "۵۰۰ فوت"], ["1,000 feet", "۱۰۰۰ فوت"]], "a": 2, "x": "در فاصله ۵۰۰ فوتی (حدود ۱۵۰ متر) خودروی روبه‌رو، نور بالا را به نور پایین تغییر دهید تا راننده مقابل خیره نشود. ۳۰۰ فوت مربوط به وقتی است که «پشت سر» خودرویی حرکت می‌کنید. ۲۰۰ و ۱۰۰۰ فوت عدد این قانون نیستند."}, {"t": "safe", "s": ["316.217", "https://www.flhsmv.gov/safety-center/driving-safety/inclement-weather-conditions/driving-severe-weather/"], "sg": null, "q": ["Florida law requires your headlights to be on:", "قانون فلوریدا چه زمانی روشن بودن چراغ‌های جلو را الزامی می‌کند؟"], "o": [["From sunset to sunrise and during rain, smoke, or fog", "از غروب تا طلوع آفتاب و هنگام باران، دود یا مه"], ["Only on unlit roads after midnight", "فقط در جاده‌های بی‌چراغ بعد از نیمه‌شب"], ["Only when visibility is under 100 feet", "فقط وقتی دید کمتر از ۱۰۰ فوت است"], ["Only on interstates at night", "فقط در بزرگراه‌های بین‌ایالتی در شب"]], "a": 0, "x": "چراغ‌ها باید از غروب تا طلوع آفتاب و در هنگام باران، دود یا مه روشن باشند. طبق صفحه رسمی FLHSMV: اگر برف‌پاک‌کن به‌خاطر شرایط جوی روشن است، چراغ‌ها هم باید روشن باشند. گزینه‌های دیگر فقط بخشی از زمان‌های لازم را پوشش می‌دهند. چراغ پارک جایگزین چراغ‌های جلو نیست."}, {"t": "safe", "s": ["S2"], "sg": null, "q": ["Before changing lanes, the best way to check your blind spot is to:", "قبل از تغییر خط، بهترین راه بررسی نقطه کور چیست؟"], "o": [["Turn your head and look over your shoulder", "سر خود را برگردانید و از روی شانه نگاه کنید"], ["Use only the inside rear-view mirror", "فقط از آینه داخلی استفاده کنید"], ["Use only the side mirrors", "فقط از آینه‌های بغل استفاده کنید"], ["Signal and move over slowly; others will make room", "راهنما بزنید و آرام تغییر خط دهید؛ دیگران جا باز می‌کنند"]], "a": 0, "x": "نقطه کور ناحیه‌ای است که در هیچ آینه‌ای دیده نمی‌شود؛ پس آینه‌ها (داخلی یا بغل) به‌تنهایی کافی نیستند. باید علاوه بر آینه‌ها، سر خود را بچرخانید و از روی شانه نگاه کنید. راهنما زدن به شما حق تغییر خط نمی‌دهد و نباید فرض کنید دیگران برایتان جا باز می‌کنند."}, {"t": "safe", "s": ["S2"], "sg": null, "q": ["You miss your exit on an expressway. You should:", "خروجی خود را در بزرگراه رد کرده‌اید. چه باید بکنید؟"], "o": [["Continue to the next exit", "تا خروجی بعدی ادامه دهید"], ["Stop and back up on the shoulder", "بایستید و روی شانه جاده دنده‌عقب بروید"], ["Make a U-turn through the median", "از میانه جاده دور بزنید"], ["Slow down in the travel lane and cut across", "در خط عبور سرعت را کم کنید و ناگهان به خروجی بپیچید"]], "a": 0, "x": "در بزرگراه هرگز دنده‌عقب نروید، از میانه دور نزنید و ناگهان خط عوض نکنید؛ همه این‌ها بسیار خطرناک و غیرقانونی‌اند. راه درست ادامه دادن تا خروجی بعدی و برگشتن از مسیر دیگر است. گذرگاه‌های میانه بزرگراه که تابلوی «فقط خودروهای مجاز» دارند، برای رانندگان عادی ممنوع‌اند."}, {"t": "safe", "s": ["S2"], "sg": null, "q": ["Another driver is following you too closely (tailgating). The safest response is to:", "راننده‌ای خیلی نزدیک پشت سر شما حرکت می‌کند. ایمن‌ترین واکنش چیست؟"], "o": [["Increase the space ahead of you and, when safe, change lanes or let them pass", "فاصله جلوی خود را بیشتر کنید و در صورت امکان خط عوض کنید یا بگذارید سبقت بگیرد"], ["Tap your brakes to warn them", "برای هشدار چند بار ترمز بزنید"], ["Speed up to put distance between you", "سرعت را زیاد کنید تا فاصله ایجاد شود"], ["Stop suddenly so they learn a lesson", "ناگهان ترمز کنید تا درس بگیرد"]], "a": 0, "x": "وقتی کسی نزدیک پشت سرتان است، فاصله «جلوی» خود را بیشتر کنید تا اگر مجبور به ترمز شدید، آرام‌تر ترمز کنید، و در اولین فرصت امن بگذارید رد شود. ترمزهای هشداری یا توقف ناگهانی ممکن است باعث تصادف از پشت شوند. افزایش سرعت هم فقط خطر را بیشتر می‌کند و راننده پشتی معمولاً باز هم نزدیک می‌آید."}, {"t": "safe", "s": ["H5.31", "316.217", "316.2397"], "sg": null, "q": ["When driving in fog, you should use:", "هنگام رانندگی در مه، از کدام چراغ استفاده کنید؟"], "o": [["Low-beam headlights", "نور پایین چراغ‌های جلو"], ["High-beam headlights", "نور بالای چراغ‌های جلو"], ["Parking lights only", "فقط چراغ‌های پارک"], ["Hazard flashers while driving at normal speed", "چراغ فلاشر در حالی که با سرعت عادی رانندگی می‌کنید"]], "a": 0, "x": "در مه از نور پایین استفاده کنید و سرعت را کم کنید. نور بالا به ذرات مه برخورد و به چشم شما بازمی‌تابد و دید را بدتر می‌کند. چراغ پارک به‌تنهایی کافی نیست؛ قانون در مه روشن بودن چراغ‌های جلو را الزامی می‌کند. طبق بند 316.2397، استفاده از فلاشر هنگام حرکت فقط در دید بسیار کم و در جاده‌هایی با حداکثر سرعت ۵۵ مایل در ساعت یا بیشتر مجاز است (خودروهای کاروان تشییع هم طبق بند 316.1974 می‌توانند فلاشر بزنند)؛ اما گزینه «فلاشر با سرعت عادی» غلط است، چون رانندگی با سرعت عادی در مه ایمن نیست و باید سرعت را کم کنید."}, {"t": "safe", "s": ["S2"], "sg": null, "q": ["Roads are usually the MOST slippery:", "جاده‌ها معمولاً چه زمانی «از همه لغزنده‌تر» هستند؟"], "o": [["During the first few minutes of rain, when water mixes with oil on the road", "در چند دقیقه اول باران، وقتی آب با روغن روی جاده مخلوط می‌شود"], ["After it has rained for several hours", "پس از چند ساعت بارندگی"], ["Only on bridges", "فقط روی پل‌ها"], ["Just after the road dries", "درست پس از خشک شدن جاده"]], "a": 0, "x": "در ابتدای باران، آب با روغن و گردوغباری که روی آسفالت جمع شده مخلوط می‌شود و لایه‌ای بسیار لیز می‌سازد. پس از مدتی باران این مواد شسته می‌شوند و جاده کمی کمتر لغزنده می‌شود. پل‌ها هم می‌توانند لغزنده باشند، اما «فقط پل‌ها» نادرست است. جاده خشک لغزنده نیست."}, {"t": "emergency", "s": ["S2"], "sg": null, "q": ["If your vehicle begins to skid, you should:", "اگر خودروی شما شروع به سُر خوردن (لغزش) کند، چه باید بکنید؟"], "o": [["Ease off the gas and steer in the direction you want the vehicle to go", "پا را از روی گاز بردارید و فرمان را به سمتی بچرخانید که می‌خواهید خودرو برود"], ["Slam on the brakes", "ترمز را محکم فشار دهید"], ["Steer hard in the opposite direction", "فرمان را شدیداً به سمت مخالف بچرخانید"], ["Accelerate to regain traction", "گاز بدهید تا چسبندگی برگردد"]], "a": 0, "x": "در لغزش، آرام پا را از گاز بردارید و فرمان را به همان سمتی بچرخانید که می‌خواهید جلوی خودرو برود. ترمز شدید چرخ‌ها را قفل می‌کند و لغزش را بدتر می‌کند. چرخاندن شدید فرمان باعث چرخش خودرو می‌شود. گاز دادن هم کشش لاستیک‌ها را کمتر می‌کند."}, {"t": "emergency", "s": ["H5.32"], "sg": null, "q": ["If a tire blows out while you are driving, you should:", "اگر هنگام رانندگی لاستیک خودرو بترکد، چه باید بکنید؟"], "o": [["Hold the steering wheel firmly, concentrate on steering, and slow down gradually without hard braking", "فرمان را محکم بگیرید، روی کنترل فرمان تمرکز کنید و بدون ترمز شدید، به‌تدریج سرعت را کم کنید"], ["Brake hard immediately", "فوراً ترمز شدید بگیرید"], ["Steer sharply onto the shoulder", "ناگهان به سمت شانه جاده بپیچید"], ["Speed up to keep the car stable", "برای پایدار ماندن خودرو، سرعت را زیاد کنید"]], "a": 0, "x": "کتابچه فلوریدا (بخش موقعیت‌های اضطراری) می‌گوید هنگام ترکیدن لاستیک: «ترمز نکنید، روی کنترل فرمان تمرکز کنید و به‌تدریج سرعت را کم کنید.» خودرو به سمت لاستیک ترکیده کشیده می‌شود؛ فرمان را محکم نگه دارید و مستقیم بروید، سپس با کاهش تدریجی سرعت کنار بکشید. ترمز شدید یا پیچیدن ناگهانی به سمت شانه ممکن است باعث از دست رفتن کنترل و واژگونی شود. گاز دادن برای «پایدار کردن» خودرو روشی نیست که کتابچه توصیه می‌کند؛ کتابچه می‌گوید به‌تدریج سرعت را کم کنید و فقط وقتی خودرو تحت کنترل است، آرام ترمز کنید."}, {"t": "special", "s": ["S5", "316.172"], "sg": null, "q": ["A school bus is stopped with red lights flashing and its stop arm out on a two-lane, two-way road. You must:", "یک اتوبوس مدرسه در جاده دوخطه دوطرفه با چراغ قرمز چشمک‌زن و بازوی ایست باز توقف کرده است. چه باید بکنید؟"], "o": [["Stop, whether you are behind the bus or coming from the opposite direction", "توقف کنید؛ چه پشت اتوبوس باشید چه از جهت مقابل بیایید"], ["Stop only if you are behind the bus", "فقط اگر پشت اتوبوس هستید توقف کنید"], ["Slow to 15 mph and pass carefully", "سرعت را به ۱۵ مایل در ساعت برسانید و با احتیاط رد شوید"], ["Stop only if you see children", "فقط اگر کودکی می‌بینید توقف کنید"]], "a": 0, "x": "در جاده دوطرفه، رانندگان «هر دو جهت» باید توقف کنند و تا وقتی همه کودکان از جاده خارج شده‌اند و بازوی ایست بسته شده، متوقف بمانند. تنها استثنا بزرگراه جداشده با مانع برآمده یا میانه غیرآسفالته دست‌کم ۵ فوتی است. عبور آهسته مجاز نیست و ممکن است کودکی از پشت اتوبوس بیرون بیاید که نمی‌بینید. عبور از اتوبوس متوقف ۴ امتیاز منفی و جریمه سنگین دارد."}, {"t": "special", "s": ["S6", "316.126"], "sg": null, "q": ["On a road with a 55 mph limit, you approach a stopped emergency vehicle, tow truck, or disabled vehicle with flashing lights, and you cannot safely move over a lane. You must slow to:", "در جاده‌ای با حداکثر سرعت ۵۵ مایل در ساعت، به خودروی امدادی، یدک‌کش یا خودروی ازکارافتاده متوقف با چراغ چشمک‌زن نزدیک می‌شوید و نمی‌توانید با خیال راحت یک خط کنار بروید. سرعت را باید به چند مایل در ساعت برسانید؟"], "o": [["35 mph", "۳۵ مایل در ساعت"], ["45 mph", "۴۵ مایل در ساعت"], ["50 mph", "۵۰ مایل در ساعت"], ["25 mph", "۲۵ مایل در ساعت"]], "a": 0, "x": "قانون «Move Over» فلوریدا:
