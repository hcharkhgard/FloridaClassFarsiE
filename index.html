at the next corner", "در تقاطع بعدی باید در جهت فلش بپیچید"], ["The road ahead curves", "جاده در ادامه پیچ دارد"], ["Only one lane is open ahead", "در ادامه فقط یک خط باز است"]], "a": 0, "x": "تابلوی ONE WAY یک تابلوی مقرراتی است و یعنی خیابان «یک‌طرفه» است: همه خودروها فقط در جهت فلش حرکت می‌کنند. اگر وارد آن خیابان می‌شوید باید در همان جهت بروید. این تابلو دستور گردش در تقاطع بعدی نیست. پیچ جاده با لوزی زرد هشدار داده می‌شود و بسته شدن خطوط با تابلوهای هشدار یا نارنجی."}, {"t": "signs", "s": ["H5.23"], "sg": null, "q": ["You see red reflectors facing you on the lane lines. This means:", "روی خطوط جاده، چشم‌گربه‌های (بازتابنده‌های) قرمز رو به شما دیده می‌شوند. این یعنی چه؟"], "o": [["You are on the wrong side of the road", "در سمت اشتباه جاده هستید"], ["A school zone is ahead", "منطقه مدرسه در پیش است"], ["You are in a passing lane", "در خط سبقت هستید"], ["The road is slippery", "جاده لغزنده است"]], "a": 0, "x": "کتابچه فلوریدا (بخش خطوط ترافیک): «اگر بازتابنده‌های قرمز رو به شما روی خطوط جاده می‌بینید، در سمت اشتباه جاده هستید.» بازتابنده‌ها طوری نصب می‌شوند که رانندگان جهت درست، سفید یا زرد ببینند؛ قرمز فقط به کسی نشان داده می‌شود که خلاف جهت حرکت می‌کند. این نشانه ربطی به مدرسه، خط سبقت یا لغزندگی ندارد."}, {"t": "dui", "s": ["316.1939", "S7"], "sg": null, "q": ["Since October 1, 2025, refusing a lawful breath or urine test for the FIRST time after a DUI arrest results in:", "از ۱ اکتبر ۲۰۲۵، «اولین» امتناع از آزمایش قانونی تنفس یا ادرار پس از بازداشت به اتهام DUI چه نتیجه‌ای دارد؟"], "o": [["A warning only", "فقط یک اخطار"], ["A 1-year license suspension, and the refusal is also a second-degree misdemeanor", "تعلیق ۱ ساله گواهینامه، و امتناع همچنین جنحه درجه دو (misdemeanor) است"], ["No penalty, because the test is voluntary", "بدون مجازات، چون آزمایش اختیاری است"], ["A 30-day suspension only", "فقط ۳۰ روز تعلیق"]], "a": 1, "x": "طبق بند 316.1939 (اصلاح‌شده با قانون Trenton، از ۱ اکتبر ۲۰۲۵)، امتناع اول از آزمایش قانونی تنفس یا ادرار جنحه درجه دو است و امتناع دوم یا بیشتر جنحه درجه یک. علاوه بر این، تعلیق اداری گواهینامه همچنان ۱ سال برای امتناع اول و ۱۸ ماه برای امتناع دوم است (FLHSMV). آزمایش پس از بازداشت قانونی «اختیاری» نیست (رضایت ضمنی)، و اخطار یا ۳۰ روز تعلیق نادرست است."}, {"t": "roads", "s": ["316.081"], "sg": null, "q": ["On a two-way road that is wide enough, Florida law requires you to drive:", "در جاده دوطرفه با عرض کافی، قانون فلوریدا شما را ملزم می‌کند در کجای جاده برانید؟"], "o": [["On the right half of the roadway", "در نیمه سمت راست جاده"], ["In the center of the road", "در وسط جاده"], ["On whichever half has less traffic", "در نیمه‌ای که ترافیک کمتری دارد"], ["On the left half when going faster than other traffic", "در نیمه چپ وقتی سریع‌تر از بقیه می‌رانید"]], "a": 0, "x": "بند 316.081 قانون فلوریدا: در جاده‌هایی که عرض کافی دارند، باید در «نیمه راست» جاده رانندگی کنید. استثناها محدودند: سبقت مجاز، دور زدن مانع، جاده سه‌خطه طبق علائم، یا خیابان یک‌طرفه. رانندگی در وسط یا نیمه چپ جاده دوطرفه خطر تصادف رودررو دارد."}, {"t": "roads", "s": ["H5.20", "316.151"], "sg": null, "q": ["On a two-way street, when preparing for a LEFT turn, you should approach the turn from:", "در خیابان دوطرفه، هنگام آماده شدن برای گردش به «چپ»، از کجای جاده باید به محل گردش نزدیک شوید؟"], "o": [["The part of the right half of the road closest to the center line", "بخشی از نیمه راست جاده که به خط وسط نزدیک‌تر است"], ["The lane next to the right curb", "خطی که کنار جدول سمت راست است"], ["The left half of the road", "نیمه چپ جاده"], ["The shoulder", "شانه جاده"]], "a": 0, "x": "کتابچه: برای گردش به چپ در جاده دوطرفه، از بخش نیمه راست جاده که به خط وسط نزدیک‌تر است نزدیک شوید؛ بند 316.151: از چپ‌ترین خط مجاز در جهت حرکت خود به تقاطع نزدیک شوید و طوری بپیچید که در خط قانونی جاده جدید قرار بگیرید. نزدیک شدن از کنار جدول راست باعث قطع کردن مسیر دیگران می‌شود. ورود به نیمه چپ یا شانه جاده غیرقانونی است."}, {"t": "roads", "s": ["H5.20", "316.151"], "sg": null, "q": ["When making a RIGHT turn, you should:", "هنگام گردش به «راست»، چه باید بکنید؟"], "o": [["Turn from the lane next to the right edge of the road into the right lane of the road you enter", "از خط کنار لبه راست جاده بپیچید و وارد خط راست جاده جدید شوید"], ["Swing wide into the left lane before turning", "قبل از پیچیدن، به خط چپ بروید و دور بزنید"], ["Turn into the far-left lane of the new road", "وارد چپ‌ترین خط جاده جدید شوید"], ["Turn from any lane if you signal", "اگر راهنما بزنید، از هر خطی می‌توانید بپیچید"]], "a": 0, "x": "کتابچه: «گردش به راست باید از خط راست به خط راست جاده‌ای که وارد می‌شوید انجام شود» و بند 316.151 می‌گوید نزدیک شدن و گردش به راست باید تا حد امکان نزدیک به جدول یا لبه راست باشد. دور زدن گسترده یا ورود به خط چپ، راه دیگران را قطع می‌کند. راهنما زدن اجازه پیچیدن از خط اشتباه را نمی‌دهد."}, {"t": "roads", "s": ["316.151"], "sg": null, "q": ["When turning LEFT from a one-way street, you should start the turn from:", "هنگام گردش به «چپ» از یک خیابان «یک‌طرفه»، از کدام خط باید گردش را شروع کنید؟"], "o": [["The far-left lane available for your direction of travel", "چپ‌ترین خط مجاز در جهت حرکت شما"], ["The far-right lane", "راست‌ترین خط"], ["The center lane only", "فقط خط وسط"], ["Any lane, as long as you signal", "هر خطی، به شرط راهنما زدن"]], "a": 0, "x": "بند 316.151: برای گردش به چپ باید از «منتهاالیه چپ‌ترین خطی» که قانوناً برای جهت حرکت شما مجاز است به تقاطع نزدیک شوید. در خیابان یک‌طرفه این یعنی خط کنار جدول سمت چپ. گردش از خط راست یا وسط، از جلوی خودروهای دیگر عبور می‌کند و تخلف است، حتی با راهنما."}, {"t": "roads", "s": ["H5.20"], "sg": null, "q": ["You are in the wrong lane to make the turn you want at an intersection. You should:", "در تقاطع، برای گردشی که می‌خواهید در خط اشتباه هستید. چه باید بکنید؟"], "o": [["Go on to the next intersection and turn from the proper lane there", "تا تقاطع بعدی ادامه دهید و از خط درست آنجا بپیچید"], ["Turn from your lane anyway, carefully", "با احتیاط از همان خط بپیچید"], ["Stop and wait for a gap to cut across", "بایستید و منتظر فرصت برای قطع کردن خطوط بمانید"], ["Back up to the correct lane", "دنده‌عقب به خط درست برگردید"]], "a": 0, "x": "کتابچه فلوریدا: اگر در خط مناسب برای گردش نیستید، «تا تقاطع بعدی بروید و از خط درست بپیچید.» پیچیدن از خط اشتباه، توقف در خط برای قطع کردن ترافیک، یا دنده‌عقب رفتن همه خطرناک‌اند و ممکن است باعث تصادف شوند."}, {"t": "roads", "s": ["316.085", "H5.25"], "sg": null, "q": ["When passing on a two-lane, two-way road, you must return to your own lane before you come within how many feet of an oncoming vehicle?", "هنگام سبقت در جاده دوخطه دوطرفه، پیش از رسیدن به چند فوتی خودروی روبه‌رو باید به خط خود برگردید؟"], "o": [["100 feet", "۱۰۰ فوت"], ["200 feet", "۲۰۰ فوت"], ["300 feet", "۳۰۰ فوت"], ["500 feet", "۵۰۰ فوت"]], "a": 1, "x": "بند 316.085: راننده‌ای که برای سبقت از خط مقابل استفاده می‌کند باید «قبل از رسیدن به ۲۰۰ فوتی» هر خودروی روبه‌رو به خط مجاز خود برگردد. اگر نمی‌توانید با این فاصله برگردید، سبقت نگیرید. ۱۰۰ فوت فاصله منع سبقت نزدیک تقاطع و راه‌آهن است؛ ۳۰۰ و ۵۰۰ فوت مربوط به قوانین نور چراغ‌ها هستند."}, {"t": "roads", "s": ["316.087", "H5.25"], "sg": null, "q": ["On a two-lane road, you may NOT drive on the left side to pass when you are within how many feet of an intersection or railroad crossing?", "در جاده دوخطه، در چه فاصله‌ای از تقاطع یا تقاطع راه‌آهن «نمی‌توانید» برای سبقت وارد سمت چپ جاده شوید؟"], "o": [["50 feet", "۵۰ فوت"], ["100 feet", "۱۰۰ فوت"], ["200 feet", "۲۰۰ فوت"], ["500 feet", "۵۰۰ فوت"]], "a": 1, "x": "بند 316.087: سبقت از سمت چپ هنگام نزدیک شدن به ۱۰۰ فوتی یا عبور از تقاطع یا تقاطع راه‌آهن ممنوع است (در جاده‌های ایالتی یا شهرستانی خارج از محدوده شهر، این قاعده فقط برای تقاطع جاده‌ای اعمال می‌شود که با تابلو مشخص شده باشد؛ برای تقاطع راه‌آهن همیشه اعمال می‌شود)؛ همچنین در ۱۰۰ فوتی پل، روگذر یا تونل وقتی دید محدود است، و در سربالایی‌ها و پیچ‌هایی که دید کافی ندارید. ۲۰۰ فوت مربوط به برگشتن به خط قبل از خودروی روبه‌روست."}, {"t": "roads", "s": ["316.084", "H5.25"], "sg": null, "q": ["Passing another vehicle on the RIGHT is allowed only when:", "سبقت از سمت «راست» فقط در چه حالتی مجاز است؟"], "o": [["The vehicle ahead is turning left, or there are two or more lanes moving in your direction, and you stay on the pavement", "خودروی جلو در حال گردش به چپ است یا دو یا چند خط در جهت شما وجود دارد، و روی آسفالت می‌مانید"], ["You can use the paved shoulder", "بتوانید از شانه آسفالته استفاده کنید"], ["The driver ahead is going under the speed limit", "راننده جلو کمتر از حد سرعت می‌راند"], ["You honk first", "اول بوق بزنید"]], "a": 0, "x": "بند 316.084: سبقت از راست فقط وقتی مجاز است که خودروی جلو در حال گردش به چپ باشد، یا جاده دو یا چند خط در همان جهت داشته باشد (یا خیابان یک‌طرفه عریض باشد)، و در شرایط ایمن. خروج از سطح آسفالت یا استفاده از شانه جاده برای سبقت صراحتاً ممنوع است. آهسته بودن راننده جلو یا بوق زدن مجوز سبقت از راست نیست."}, {"t": "roads", "s": ["H5.25"], "sg": null, "q": ["After passing a vehicle, you should return to the right lane when:", "پس از سبقت از یک خودرو، چه زمانی باید به خط راست برگردید؟"], "o": [["You can see the tires of the vehicle you passed in your rear-view mirror", "وقتی لاستیک‌های خودرویی که از آن سبقت گرفتید را در آینه عقب ببینید"], ["As soon as your front bumper is past its front bumper", "به محض اینکه سپر جلوی شما از سپر جلوی آن رد شد"], ["After you count one second", "پس از شمردن یک ثانیه"], ["Only when the other driver flashes the headlights", "فقط وقتی راننده دیگر چراغ بزند"]], "a": 0, "x": "کتابچه فلوریدا (بخش سبقت): «تا وقتی لاستیک‌های خودرویی را که از آن سبقت گرفته‌اید نبینید، به سمت راست جاده برنگردید.» برگشتن زودتر، یعنی بریدن جلوی آن خودرو، باعث تصادف می‌شود. منتظر علامت چراغ راننده دیگر ماندن هم قانون نیست؛ خودتان باید فاصله را بررسی کنید و راهنما بزنید."}, {"t": "row", "s": ["H5.13"], "sg": null, "q": ["According to the Florida Driver Handbook, where do more crashes happen than any other place?", "طبق کتابچه رانندگی فلوریدا، بیشترین تصادف‌ها در کجا رخ می‌دهد؟"], "o": [["At intersections", "در تقاطع‌ها"], ["On interstates", "در بزرگراه‌های بین‌ایالتی"], ["In parking lots", "در پارکینگ‌ها"], ["On bridges", "روی پل‌ها"]], "a": 0, "x": "کتابچه: «تصادف‌ها در تقاطع‌ها بیشتر از هر جای دیگری رخ می‌دهند. هنگام نزدیک شدن به هر تقاطع یا ورودی بسیار مراقب باشید.» به همین دلیل باید قبل از تقاطع به هر دو طرف نگاه کنید و آماده ترمز یا توقف باشید. گزینه‌های دیگر هم می‌توانند خطرناک باشند، اما کتابچه صریحاً می‌گوید تصادف در تقاطع‌ها بیشتر از هر جای دیگری رخ می‌دهد."}, {"t": "row", "s": ["H5.13"], "sg": null, "q": ["When approaching an intersection, you should be driving at your slowest speed:", "هنگام نزدیک شدن به تقاطع، کمترین سرعت شما باید در چه لحظه‌ای باشد؟"], "o": [["Just before entering the intersection, not while crossing it", "درست قبل از ورود به تقاطع، نه هنگام عبور از آن"], ["While you are in the middle of the intersection", "وقتی وسط تقاطع هستید"], ["After you have crossed the intersection", "پس از عبور از تقاطع"], ["Speed does not matter if the light is green", "اگر چراغ سبز است سرعت مهم نیست"]], "a": 0, "x": "کتابچه فلوریدا: «درست قبل از ورود به تقاطع با کمترین سرعت برانید، نه هنگام عبور از آن.» این به شما فرصت می‌دهد خطر را ببینید و بایستید؛ کم کردن سرعت در وسط تقاطع شما را بیشتر در معرض ترافیک عرضی قرار می‌دهد. چراغ سبز ضمانت نمی‌کند که دیگران چراغ قرمز را رد نکنند."}, {"t": "row", "s": ["H5.13"], "sg": null, "q": ["Inside or while approaching an intersection, you should NOT:", "داخل تقاطع یا هنگام نزدیک شدن به آن، چه کاری «نباید» بکنید؟"], "o": [["Pass other vehicles or change lanes", "از خودروهای دیگر سبقت بگیرید یا خط عوض کنید"], ["Look both ways", "به هر دو طرف نگاه کنید"], ["Be ready to brake", "آماده ترمز باشید"], ["Check for pedestrians and bicyclists", "مراقب عابران و دوچرخه‌سواران باشید"]], "a": 0, "x": "کتابچه فلوریدا درباره عبور از تقاطع می‌گوید: «سبقت نگیرید و خط عوض نکنید.» در تقاطع خودروها، عابران و دوچرخه‌ها از جهت‌های مختلف می‌آیند و تغییر ناگهانی مسیر خطر برخورد را زیاد می‌کند. سه گزینه دیگر کارهایی هستند که کتابچه «توصیه» می‌کند."}, {"t": "row", "s": ["H5.16"], "sg": null, "q": ["At an open intersection (no signs or signals), you are entering a state highway from a secondary road. You must:", "در تقاطع باز (بدون تابلو یا چراغ)، از یک جاده فرعی وارد بزرگراه ایالتی می‌شوید. چه باید بکنید؟"], "o": [["Yield the right-of-way to traffic on the state highway", "به ترافیک بزرگراه ایالتی حق تقدم بدهید"], ["Go first if you are on the right", "اگر در سمت راست هستید، اول بروید"], ["Expect highway traffic to stop", "انتظار داشته باشید ترافیک بزرگراه بایستد"], ["Honk and enter", "بوق بزنید و وارد شوید"]], "a": 0, "x": "کتابچه (بخش تقاطع‌های باز) می‌گوید باید حق تقدم بدهید وقتی: خودرویی داخل تقاطع است؛ «از جاده فرعی وارد بزرگراه ایالتی می‌شوید»؛ از جاده خاکی وارد جاده آسفالته می‌شوید؛ یا به چپ می‌پیچید و خودرویی از روبه‌رو می‌آید. قاعده «سمت راست» فقط برای ورود هم‌زمان به تقاطع برابر است."}, {"t": "row", "s": ["H5.16"], "sg": null, "q": ["At an open intersection, you are driving from an UNPAVED road onto a paved road. You must:", "در تقاطع باز، از جاده «خاکی» وارد جاده آسفالته می‌شوید. چه باید بکنید؟"], "o": [["Yield to traffic on the paved road", "به ترافیک جاده آسفالته حق تقدم بدهید"], ["Go first because you were there first", "اول بروید چون زودتر رسیده‌اید"], ["Yield only to trucks", "فقط به کامیون‌ها راه بدهید"], ["Enter at the same speed as paved-road traffic without stopping", "بدون توقف با سرعت ترافیک آسفالت وارد شوید"]], "a": 0, "x": "کتابچه فلوریدا: هنگام ورود از جاده بدون آسفالت به جاده آسفالته باید حق تقدم را به ترافیک جاده آسفالته بدهید. راننده جاده خاکی معمولاً در موقعیت فرعی است و ترافیک اصلی انتظار توقف ندارد. زودتر رسیدن یا نوع وسیله نقلیه این قاعده را تغییر نمی‌دهد."}, {"t": "row", "s": ["H5.14"], "sg": null, "q": ["According to the Florida Driver Handbook, who ‘has’ the right-of-way?", "طبق کتابچه رانندگی فلوریدا، چه کسی حق تقدم «دارد»؟"], "o": [["No one; the law only says who must yield", "هیچ‌کس؛ قانون فقط می‌گوید چه کسی باید حق تقدم بدهد"], ["Whoever is driving the larger vehicle", "هر کس خودروی بزرگ‌تری دارد"], ["Whoever is going faster", "هر کس سریع‌تر می‌رود"], ["Whoever has a green light, in all cases", "در همه حالات، هر کس چراغ سبز دارد"]], "a": 0, "x": "کتابچه: «چه کسی در فلوریدا حق تقدم دارد؟ هیچ‌کس! قانون فقط می‌گوید چه کسی باید حق تقدم را واگذار کند.» همه رانندگان، موتورسواران، دوچرخه‌سواران و عابران موظف‌اند هر کاری برای جلوگیری از تصادف بکنند. حتی با چراغ سبز باید به خودروها و عابرانی که هنوز داخل تقاطع‌اند راه بدهید."}, {"t": "row", "s": ["H5.17"], "sg": null, "q": ["When leaving a roundabout, you should:", "هنگام خروج از میدان (راندَباوت)، چه باید بکنید؟"], "o": [["Use your right turn signal to show you are exiting", "راهنمای راست بزنید تا نشان دهید خارج می‌شوید"], ["Use your left turn signal", "راهنمای چپ بزنید"], ["Stop before exiting", "قبل از خروج بایستید"], ["Exit without signaling; signals are not used in roundabouts", "بدون راهنما خارج شوید؛ در میدان راهنما استفاده نمی‌شود"]], "a": 0, "x": "کتابچه فلوریدا (بخش میدان‌ها): برای نشان دادن قصد خروج از «راهنمای راست» استفاده کنید. همچنین قبل از ورود و هنگام خروج باید به عابران در خط عابر حق تقدم بدهید. توقف بی‌دلیل داخل میدان خطرناک است و راهنمای چپ دیگران را گمراه می‌کند."}, {"t": "special", "s": ["H6.5", "S5"], "sg": null, "q": ["On a divided highway with a raised concrete barrier, a school bus is stopped with its stop arm out. You are traveling in the SAME direction as the bus, behind it. You must:", "در بزرگراه جداشده با مانع بتنی برآمده، اتوبوس مدرسه با بازوی ایست باز توقف کرده است. شما در «همان جهت» اتوبوس و پشت آن هستید. چه باید بکنید؟"], "o": [["Stop and remain stopped until the stop arm is withdrawn", "توقف کنید و تا بسته شدن بازوی ایست متوقف بمانید"], ["Pass slowly on the left", "از سمت چپ آهسته سبقت بگیرید"], ["Continue, because the highway is divided", "ادامه دهید چون بزرگراه جداشده است"], ["Stop, then pass if no children are visible", "بایستید و اگر کودکی دیده نمی‌شود رد شوید"]], "a": 0, "x": "کتابچه: «اگر در همان جهت اتوبوس حرکت می‌کنید، همیشه باید توقف کنید و تا بسته شدن بازوی ایست متوقف بمانید.» استثنای مانع برآمده یا میانه غیرآسفالته ۵ فوتی فقط برای ترافیک «جهت مخالف» است، نه ترافیک پشت اتوبوس. سبقت از اتوبوس متوقف ۴ امتیاز منفی دارد."}, {"t": "special", "s": ["S5"], "sg": null, "q": ["On a highway divided only by a PAVED median (or a center turn lane), a school bus stops with its stop arm out. Who must stop?", "در بزرگراهی که فقط با میانه «آسفالته» (یا خط گردش وسط) جدا شده، اتوبوس مدرسه با بازوی ایست باز توقف می‌کند. چه کسانی باید توقف کنند؟"], "o": [["Drivers moving in both directions", "رانندگان هر دو جهت"], ["Only drivers behind the bus", "فقط رانندگان پشت اتوبوس"], ["Only drivers in the lane next to the bus", "فقط رانندگان خط کنار اتوبوس"], ["No one, if the median is wide", "هیچ‌کس، اگر میانه عریض باشد"]], "a": 0, "x": "صفحه ایمنی اتوبوس مدرسه FLHSMV: «در بزرگراهی که با میانه آسفالته جدا شده، همه رانندگان در هر دو جهت باید برای اتوبوس مدرسه‌ای که علامت ایست دارد توقف کنند» تا جاده از کودکان خالی شود و بازوی ایست جمع شود. خط‌کشی رنگی یا آسفالت مانع محسوب نمی‌شود؛ فقط مانع برآمده یا میانه «غیرآسفالته» دست‌کم ۵ فوتی ترافیک مقابل را معاف می‌کند."}, {"t": "special", "s": ["322.27", "318.18"], "sg": null, "q": ["Illegally passing a stopped school bus (with no one seriously hurt) adds how many points to your driving record?", "سبقت غیرقانونی از اتوبوس مدرسه متوقف (بدون آسیب جدی به کسی) چند امتیاز منفی به سابقه رانندگی اضافه می‌کند؟"], "o": [["2 points", "۲ امتیاز"], ["3 points", "۳ امتیاز"], ["4 points", "۴ امتیاز"], ["6 points", "۶ امتیاز"]], "a": 2, "x": "بند 322.27: عبور از اتوبوس مدرسه متوقف = ۴ امتیاز؛ اگر به آسیب جدی یا مرگ منجر شود = ۶ امتیاز. علاوه بر امتیاز، طبق بند 318.18 جریمه نقدی ۲۰۰ دلار است و اگر از سمتی که کودکان سوار و پیاده می‌شوند عبور کنید ۴۰۰ دلار (به‌علاوه هزینه‌های اضافی). ۳ امتیاز برای بیشتر تخلفات عادی است."}, {"t": "brakes", "s": ["H7.1"], "sg": null, "q": ["Florida's equipment rules say your car must have:", "طبق مقررات تجهیزات فلوریدا، خودروی شما باید چه چیزی داشته باشد؟"], "o": [["Two braking systems, each able to stop the car alone", "دو سیستم ترمز که هر کدام به‌تنهایی بتواند خودرو را متوقف کند"], ["One brake system with anti-lock brakes", "یک سیستم ترمز با ABS"], ["A parking brake only for hills", "ترمز دستی فقط برای سربالایی"], ["Brakes inspected every six months", "بازرسی ترمز هر شش ماه"]], "a": 0, "x": "کتابچه (بخش تجهیزات): «خودروی شما باید دو سیستم ترمز داشته باشد و هر کدام باید به‌تنهایی بتواند خودرو را متوقف کند.» ترمز دستی باید بتواند خودرو را در هر شیبی نگه دارد. ABS الزامی قانونی برای همه خودروها نیست و قانونی برای بازرسی شش‌ماهه در فلوریدا وجود ندارد."}, {"t": "brakes", "s": ["H7.1"], "sg": null, "q": ["According to the Florida Driver Handbook, at 50 mph on dry pavement your vehicle will travel a minimum of about how far before it stops (perception + reaction + braking)?", "طبق کتابچه رانندگی فلوریدا، با سرعت ۵۰ مایل در ساعت روی آسفالت خشک، خودرو حداقل حدود چه مسافتی طی می‌کند تا بایستد (درک + واکنش + ترمز)؟"], "o": [["About 75 feet", "حدود ۷۵ فوت"], ["About 130 feet", "حدود ۱۳۰ فوت"], ["About 268 feet", "حدود ۲۶۸ فوت"], ["About 500 feet", "حدود ۵۰۰ فوت"]], "a": 2, "x": "کتابچه: مسافت کل توقف از سه بخش تشکیل می‌شود: مسافت درک خطر، مسافت واکنش (در ۵۰ مایل در ساعت حدود ۵۵ فوت) و مسافت ترمز (در ۵۰ مایل در ساعت روی آسفالت خشک حدود ۱۵۸ فوت). مجموع: «با سرعت ۵۰ مایل در ساعت، خودروی شما حداقل ۲۶۸ فوت طی می‌کند». ۷۵ و ۱۳۰ فوت بسیار کمتر از واقعیت‌اند."}, {"t": "brakes", "s": ["H7.1"], "sg": null, "q": ["Total stopping distance is made up of:", "مسافت کل توقف از چه اجزایی تشکیل شده است؟"], "o": [["Perception distance + reaction distance + braking distance", "مسافت درک + مسافت واکنش + مسافت ترمز"], ["Braking distance only", "فقط مسافت ترمز"], ["Following distance + braking distance", "فاصله دنبال کردن + مسافت ترمز"], ["Reaction distance only", "فقط مسافت واکنش"]], "a": 0, "x": "کتابچه فلوریدا سه مرحله را توضیح می‌دهد: ۱) مسافت درک: فاصله‌ای که خودرو طی می‌کند تا مغز شما خطر را تشخیص دهد (حدود ۳/۴ تا ۱ ثانیه)؛ ۲) مسافت واکنش: از تشخیص تا فشار دادن پدال ترمز؛ ۳) مسافت ترمز: از فشار ترمز تا توقف کامل. فاصله دنبال کردن جزو مسافت توقف نیست؛ فضایی است که برای آن نگه می‌دارید."}, {"t": "brakes", "s": ["H5.31"], "sg": null, "q": ["After driving through deep water, your brakes may be wet and pull to one side. You should:", "پس از عبور از آب عمیق، ممکن است ترمزها خیس شوند و خودرو به یک طرف کشیده شود. چه باید بکنید؟"], "o": [["Slow down and gently press the brake pedal until the brakes work normally again", "سرعت را کم کنید و به‌آرامی پدال ترمز را فشار دهید تا ترمزها دوباره عادی کار کنند"], ["Drive faster so the wind dries the brakes", "سریع‌تر برانید تا باد ترمزها را خشک کند"], ["Pump the brakes hard at highway speed", "در سرعت بزرگراه ترمز را محکم پمپ کنید"], ["Use only the parking brake until they dry", "تا خشک شدن فقط از ترمز دستی استفاده کنید"]], "a": 0, "x": "کتابچه (بخش دید کم): پس از عبور از آب عمیق «ترمزها اغلب خیس می‌شوند... ممکن است به یک طرف بکشند.» راه‌حل: «سرعت را کم کنید و به‌آرامی پدال ترمز را فشار دهید تا ترمزها دوباره کار کنند.» اصطکاک ملایم ترمز آن‌ها را خشک می‌کند. سرعت بالا با ترمز ضعیف بسیار خطرناک است."}, {"t": "brakes", "s": ["H7.1"], "sg": null, "q": ["Your vehicle's two red stoplights (brake lights) must be visible in the daytime from at least:", "دو چراغ قرمز ترمز خودرو باید در روز دست‌کم از چه فاصله‌ای دیده شوند؟"], "o": [["100 feet", "۱۰۰ فوت"], ["300 feet", "۳۰۰ فوت"], ["500 feet", "۵۰۰ فوت"], ["1,000 feet", "۱۰۰۰ فوت"]], "a": 1, "x": "کتابچه (تجهیزات): «دو چراغ قرمز ترمز... باید در روز از ۳۰۰ فوتی دیده شوند و با فشار پدال ترمز روشن شوند.» ۱۰۰۰ فوت مربوط به چراغ‌های عقب (Taillights) در شب است. چراغ ترمز سوخته یعنی راننده پشت سر متوجه توقف شما نمی‌شود."}, {"t": "parking", "s": ["H5.27"], "sg": null, "q": ["When you park on a hill, you should turn your wheels so that if the car starts to roll, it will:", "هنگام پارک در سراشیبی یا سربالایی، چرخ‌ها را طوری بچرخانید که اگر خودرو شروع به حرکت کرد:"], "o": [["Roll away from traffic or into the curb", "از ترافیک دور شود یا به جدول برخورد کند"], ["Roll into the traffic lane", "به داخل خط عبور برود"], ["Roll straight down the hill", "مستقیم به پایین تپه برود"], ["Stop by itself because of the parking brake", "به‌خاطر ترمز دستی خودش بایستد"]], "a": 0, "x": "کتابچه فلوریدا: «چرخ‌ها را طوری بچرخانید که اگر خودرو خودبه‌خود حرکت کرد، از ترافیک دور شود یا به جدول برود.» یعنی: سراشیبی با جدول ← به سمت جدول؛ سربالایی با جدول ← دور از جدول؛ بدون جدول ← به سمت لبه جاده. ترمز دستی را هم بکشید، اما به آن تنها تکیه نکنید."}, {"t": "parking", "s": ["H5.27"], "sg": null, "q": ["You park a car with a manual transmission facing DOWNHILL. After setting the parking brake, you should leave it in:", "خودروی دنده‌دستی را رو به «سراشیبی» پارک می‌کنید. پس از کشیدن ترمز دستی، آن را در کدام دنده بگذارید؟"], "o": [["Reverse", "دنده عقب"], ["First gear", "دنده یک"], ["Neutral", "خلاص"], ["Fifth gear", "دنده پنج"]], "a": 0, "x": "کتابچه: «دنده دستی را در سراشیبی روی دنده عقب و در سربالایی روی دنده یک بگذارید» (خودروی اتوماتیک را روی P). دنده خلاص هیچ مقاومتی ایجاد نمی‌کند. دنده عقب در سراشیبی با جهت حرکت احتمالی خودرو (به جلو) مخالفت می‌کند."}, {"t": "parking", "s": ["H5.27", "316.2005"], "sg": null, "q": ["After parallel parking on a street, before opening the driver's door you should:", "پس از پارک موازی در خیابان، قبل از باز کردن در سمت راننده چه باید بکنید؟"], "o": [["Check traffic and bicyclists behind you and open the door only when it is safe", "ترافیک و دوچرخه‌سواران پشت سر را بررسی کنید و فقط وقتی امن است در را باز کنید"], ["Open the door quickly so you are out of the way sooner", "در را سریع باز کنید تا زودتر از مسیر کنار بروید"], ["Honk to warn drivers, then open the door", "بوق بزنید تا رانندگان آگاه شوند و بعد در را باز کنید"], ["Open the door right away; drivers behind you must go around it", "فوراً در را باز کنید؛ رانندگان پشت سر باید از کنار آن رد شوند"]], "a": 0, "x": "کتابچه: «همیشه قبل از پیاده شدن از سمت خیابان، ترافیک پشت سر را بررسی کنید» و در بخش دوچرخه: قبل از باز کردن در، دوچرخه‌سوارانی را که از پشت می‌آیند بررسی کنید. بند 316.2005 باز کردن در را تا وقتی امن نیست ممنوع می‌کند و باز گذاشتن در سمت ترافیک بیش از زمان لازم برای سوار و پیاده کردن را نیز ممنوع می‌داند."}, {"t": "parking", "s": ["H5.27", "S12"], "sg": null, "q": ["Which of these is a place where parking is NOT allowed?", "پارک کردن در کدام یک از این مکان‌ها «ممنوع» است؟"], "o": [["On a bridge, overpass, or in a tunnel", "روی پل، روگذر یا داخل تونل"], ["In a marked parking space on a residential street", "در جای پارک خط‌کشی‌شده در خیابان مسکونی"], ["25 feet from a fire hydrant", "۲۵ فوتی شیر آتش‌نشانی"], ["60 feet from a railroad crossing", "۶۰ فوتی تقاطع راه‌آهن"]], "a": 0, "x": "کتابچه و بند 316.1945: پارک «روی پل یا روگذر یا داخل تونل» ممنوع است. ۲۵ فوت از شیر آتش‌نشانی بیشتر از حداقل ۱۵ فوت است و ۶۰ فوت از راه‌آهن بیشتر از حداقل ۵۰ فوت است، پس هر دو مجازند (اگر تابلوی دیگری نباشد). جای پارک خط‌کشی‌شده هم مجاز است."}, {"t": "parking", "s": ["H5.27"], "sg": null, "q": ["On a state highway, you may not park within 30 feet of a rural mailbox during certain daytime hours. Which other place on this list is also a 30-foot no-parking zone?", "در بزرگراه ایالتی، پارک در ۳۰ فوتی صندوق پست روستایی در ساعات مشخصی از روز ممنوع است. کدام مکان دیگر در این فهرست نیز منطقه پارک ممنوع ۳۰ فوتی است؟"], "o": [["The approach to a traffic signal, stop sign, or flashing signal", "مسیر رسیدن به چراغ راهنمایی، تابلوی ایست یا چراغ چشمک‌زن"], ["A fire hydrant", "شیر آتش‌نشانی"], ["A crosswalk at an intersection", "خط عابر پیاده در تقاطع"], ["A railroad crossing", "تقاطع راه‌آهن"]], "a": 0, "x": "فهرست کتابچه: ۱۵ فوت = شیر آتش‌نشانی؛ ۲۰ فوت = تقاطع/خط عابر و ورودی ایستگاه آتش‌نشانی یا آمبولانس؛ ۳۰ فوت = چراغ راهنمایی، تابلوی ایست یا چراغ چشمک‌زن (و صندوق پست روستایی در بزرگراه ایالتی)؛ ۵۰ فوت = راه‌آهن. پس از میان گزینه‌ها فقط چراغ و تابلوی ایست ۳۰ فوت است."}, {"t": "lights", "s": ["H7.1"], "sg": null, "q": ["Low-beam (dimmed) headlights must show objects at least how far ahead?", "نور پایین چراغ‌های جلو باید اشیا را دست‌کم تا چه فاصله‌ای جلوتر نشان دهد؟"], "o": [["50 feet", "۵۰ فوت"], ["150 feet", "۱۵۰ فوت"], ["300 feet", "۳۰۰ فوت"], ["450 feet", "۴۵۰ فوت"]], "a": 1, "x": "کتابچه (تجهیزات): نور پایین «اشیا را تا ۱۵۰ فوت جلوتر نشان می‌دهد» و نور بالا «تا ۴۵۰ فوت». به همین دلیل نور پایین فقط برای سرعت‌های حدود ۲۰ تا ۲۵ مایل در ساعت مؤثر است. ۵۰ فوت فاصله دیده شدن چراغ پلاک است و ۳۰۰ فوت مربوط به چراغ ترمز در روز یا کم کردن نور پشت خودروی دیگر است."}, {"t": "lights", "s": ["H5.29"], "sg": null, "q": ["According to the handbook, low-beam headlights are only effective for speeds up to about:", "طبق کتابچه، نور پایین چراغ‌ها فقط تا حدود چه سرعتی مؤثر است؟"], "o": [["20–25 mph", "۲۰ تا ۲۵ مایل در ساعت"], ["35–40 mph", "۳۵ تا ۴۰ مایل در ساعت"], ["45–50 mph", "۴۵ تا ۵۰ مایل در ساعت"], ["Any speed", "هر سرعتی"]], "a": 0, "x": "کتابچه (رانندگی در شب): «نور پایین فقط برای سرعت‌های تا ۲۰ تا ۲۵ مایل در ساعت مؤثر است» و نور بالا که اشیا را تا ۴۵۰ فوت نشان می‌دهد برای سرعت‌های بالاتر از ۲۵ مایل در ساعت مؤثرتر است. پس وقتی با نور پایین سریع می‌رانید، باید سرعت را کم کنید تا «جلوتر از نور چراغ‌ها» نرانید، و هر زمان قانون اجازه داد از نور بالا استفاده کنید."}, {"t": "lights", "s": ["H5.29"], "sg": null, "q": ["When you leave a brightly lit place (such as a gas station) at night, you should:", "وقتی شب از یک مکان پرنور (مثل پمپ بنزین) خارج می‌شوید، چه باید بکنید؟"], "o": [["Drive slowly until your eyes adjust to the darkness", "آهسته برانید تا چشم‌هایتان به تاریکی عادت کنند"], ["Turn on your high beams immediately regardless of traffic", "بدون توجه به ترافیک فوراً نور بالا را روشن کنید"], ["Wear sunglasses", "عینک آفتابی بزنید"], ["Speed up to reach a lit road sooner", "سرعت را زیاد کنید تا زودتر به جاده روشن برسید"]], "a": 0, "x": "کتابچه: «وقتی از یک مکان پرنور خارج می‌شوید، آهسته برانید تا چشم‌هایتان به تاریکی عادت کنند.» چشم چند لحظه زمان لازم دارد تا در تاریکی خوب ببیند. نور بالا فقط وقتی مجاز است که خودرویی در ۵۰۰ فوتی روبه‌رو یا ۳۰۰ فوتی جلوی شما نباشد. عینک آفتابی در شب دید را کم می‌کند."}, {"t": "lights", "s": ["H6.8"], "sg": null, "q": ["When you follow a large truck at night, you should:", "وقتی شب پشت یک کامیون بزرگ حرکت می‌کنید، چه باید بکنید؟"], "o": [["Always dim your headlights", "همیشه نور چراغ‌ها را پایین بیاورید"], ["Use high beams so the driver knows you are there", "نور بالا بزنید تا راننده بداند آنجا هستید"], ["Turn off your headlights and use parking lights", "چراغ‌ها را خاموش و از چراغ پارک استفاده کنید"], ["Flash your lights to ask the driver to speed up", "چراغ بزنید تا راننده سرعتش را زیاد کند"]], "a": 0, "x": "کتابچه (اشتراک جاده با کامیون): «وقتی شب پشت کامیون حرکت می‌کنید، همیشه نور چراغ‌ها را پایین بیاورید. نور بالای خودروی پشت سر، از آینه‌های بغل بزرگ کامیون منعکس می‌شود و راننده را کور می‌کند.» رانندگی فقط با چراغ پارک به‌جای چراغ جلو غیرقانونی است."}, {"t": "lights", "s": ["H7.1"], "sg": null, "q": ["Your vehicle's two red taillights must be visible from at least:", "دو چراغ قرمز عقب خودرو (Taillights) باید دست‌کم از چه فاصله‌ای دیده شوند؟"], "o": [["200 feet", "۲۰۰ فوت"], ["500 feet", "۵۰۰ فوت"], ["1,000 feet", "۱۰۰۰ فوت"], ["2,000 feet", "۲۰۰۰ فوت"]], "a": 2, "x": "کتابچه (تجهیزات): «دو چراغ قرمز عقب... که از ۱۰۰۰ فوت دیده شوند.» این چراغ‌ها در شب همیشه روشن‌اند تا خودروهای پشت سر شما را ببینند. ۳۰۰ فوت مربوط به دیده شدن چراغ‌های ترمز در روز و ۲۰۰ فوت مربوط به شنیده شدن بوق است."}, {"t": "lights", "s": ["316.2397", "S22"], "sg": null, "q": ["Under current Florida law, you may use your hazard (flashing) lights while DRIVING:", "طبق قانون فعلی فلوریدا، چه زمانی می‌توانید «هنگام رانندگی» چراغ‌های فلاشر (هشدار) را روشن کنید؟"], "o": [["During extremely low visibility on roads with a posted limit of 55 mph or higher", "هنگام دید بسیار کم در جاده‌هایی با حداکثر سرعت ۵۵ مایل در ساعت یا بیشتر"], ["Any time it is raining", "هر وقت باران می‌بارد"], ["When you want to park in a no-parking zone", "وقتی می‌خواهید در منطقه پارک ممنوع پارک کنید"], ["To thank another driver", "برای تشکر از راننده دیگر"]], "a": 0, "x": "بند 316.2397 (اصلاح‌شده در ۲۰۲۴): چراغ‌های چشمک‌زن روی خودرو ممنوع است به‌جز استثناهایی مانند نشان دادن خودروی ازکارافتاده یا «در دوره‌های دید بسیار کم در جاده‌هایی با حداکثر سرعت ۵۵ مایل در ساعت یا بیشتر.» پس باران معمولی دلیل کافی نیست. فلاشر اجازه پارک در محل ممنوع نمی‌دهد و برای تشکر هم نیست. در شرایط عادی، فلاشر برای وقتی است که خودرو متوقف یا ازکارافتاده است. توجه: متن قدیمی کتابچه هنوز می‌گوید فلاشر فقط هنگام توقف کنار جاده استفاده شود؛ قانون ۲۰۲۴ این استثنا را اضافه کرده است."}, {"t": "roads", "s": ["H5.21"], "sg": null, "q": ["Where should you NEVER make a U-turn or a three-point turn?", "در کجا «هرگز» نباید دور بزنید (U-turn) یا دور سه‌مرحله‌ای انجام دهید؟"], "o": [["On a curve, on a hill, or where a sign prohibits it", "در پیچ، روی تپه یا جایی که تابلو ممنوع کرده است"], ["On a quiet residential street with a clear view", "در خیابان مسکونی خلوت با دید کامل"], ["At an intersection where U-turns are not prohibited", "در تقاطعی که دور زدن ممنوع نشده"], ["In an empty parking lot", "در پارکینگ خالی"]], "a": 0, "x": "کتابچه (دور سه‌مرحله‌ای): «هرگز در پیچ، روی تپه یا جایی که تابلو دور زدن را ممنوع کرده، دور سه‌مرحله‌ای یا U-turn انجام ندهید»، چون رانندگان دیگر شما را به‌موقع نمی‌بینند. بند 316.1515 هم دور زدن را فقط وقتی مجاز می‌داند که ایمن باشد، مزاحم ترافیک نشود و تابلویی آن را ممنوع نکرده باشد."}, {"t": "brakes", "s": ["H5.26"], "sg": null, "q": ["You are stopped behind another vehicle on a steep hill. Why should you leave extra space in front of you?", "پشت خودرویی در یک سربالایی تند متوقف شده‌اید. چرا باید فاصله بیشتری جلوی خود بگذارید؟"], "o": [["The vehicle ahead may roll back when it starts moving", "ممکن است خودروی جلو هنگام حرکت به عقب بلغزد"], ["Your brakes work better on hills", "ترمزهای شما در سربالایی بهتر کار می‌کنند"], ["So you can pass it on the hill", "تا بتوانید در سربالایی از آن سبقت بگیرید"], ["There is no reason; stop as close as possible", "دلیلی ندارد؛ تا حد امکان نزدیک بایستید"]], "a": 0, "x": "کتابچه در فهرست موقعیت‌هایی که فاصله بیشتری لازم دارند می‌گوید: «در تپه‌ها یا شیب‌ها که احتمال عقب‌لغزیدن (Rollback) وجود دارد.» خودروی جلو، به‌خصوص دنده‌دستی، ممکن است هنگام حرکت کمی به عقب بیاید. سبقت هنگام نزدیک شدن به قله تپه یا روی آن، جایی که دید شما محدود است، ممنوع است (بند 316.087)."}, {"t": "weather", "s": ["S20", "https://www.lowestpricetrafficschool.com/handbooks/cdl/en/2/6"], "sg": null, "q": ["When temperatures drop near freezing, which part of the road usually ices over FIRST?", "وقتی دما نزدیک به نقطه انجماد می‌رسد، معمولاً کدام قسمت جاده «زودتر» یخ می‌زند؟"], "o": [["Bridges and overpasses", "پل‌ها و روگذرها"], ["Roads in direct sunlight", "جاده‌های زیر نور مستقیم آفتاب"], ["Tunnels", "تونل‌ها"], ["Newly paved roads", "جاده‌های تازه آسفالت‌شده"]], "a": 0, "x": "کتابچه رسمی CDL فلوریدا: «وقتی دما پایین می‌آید، پل‌ها زودتر از جاده یخ می‌زنند» و «جاده را از نظر یخ بررسی کنید، به‌خصوص پل‌ها و روگذرها.» پل‌ها از بالا و پایین در معرض هوای سرد هستند و زودتر از بقیه جاده یخ می‌زنند. در شمال فلوریدا یا هنگام سفر به ایالت‌های دیگر این موضوع مهم است. کتابچه همچنین می‌گوید قسمت‌های سایه‌دار جاده مدت‌ها پس از آب شدن یخ در مناطق باز، یخ‌زده باقی می‌مانند."}, {"t": "weather", "s": ["S20"], "sg": null, "q": ["On a cold, wet road, which clue suggests ice has formed on the road surface?", "در جاده سرد و خیس، کدام نشانه می‌گوید روی سطح جاده یخ بسته است؟"], "o": [["Other vehicles stop throwing up water spray", "دیگر از زیر چرخ خودروهای دیگر آب پاشیده نمی‌شود"], ["The air temperature is rising", "دمای هوا در حال افزایش است"], ["Your tires get louder", "صدای لاستیک‌ها بلندتر می‌شود"], ["Traffic speeds up", "ترافیک سریع‌تر می‌شود"]], "a": 0, "x": "کتابچه CDL فلوریدا: «نبودن پاشش آب از خودروهای دیگر نشان می‌دهد که روی جاده یخ بسته است.» وقتی آب یخ می‌زند دیگر از زیر لاستیک‌ها پاشیده نمی‌شود. افزایش دمای هوا احتمال یخ را کم می‌کند، نه زیاد. یخ نازک و شفاف (یخ سیاه) ممکن است جاده را فقط خیس نشان دهد، پس به ظاهر جاده اعتماد نکنید."}, {"t": "weather", "s": ["S20"], "sg": null, "q": ["On an icy or very slippery road, you should:", "در جاده یخ‌زده یا بسیار لغزنده، چه باید بکنید؟"], "o": [["Drive slowly and smoothly, keep a longer following distance, and brake no harder than necessary", "آهسته و نرم برانید، فاصله بیشتری نگه دارید و بیشتر از حد لازم ترمز نکنید"], ["Drive at the normal speed limit", "با حداکثر سرعت عادی برانید"], ["Brake hard and often to test traction", "برای آزمایش چسبندگی، زیاد و محکم ترمز کنید"], ["Use cruise control to keep a steady speed", "برای سرعت ثابت از کروز کنترل استفاده کنید"]], "a": 0, "x": "کتابچه CDL فلوریدا: «در جاده‌های لغزنده آهسته و نرم برانید. اگر خیلی لغزنده است، اصلاً نباید رانندگی کنید.» «بیشتر از حد لازم ترمز نکنید» و «فاصله دنبال کردن طولانی‌تری نگه دارید». ترمز شدید چرخ‌ها را قفل می‌کند و باعث لغزش می‌شود. حداکثر سرعت برای شرایط ایده‌آل است، نه یخ‌زدگی."}, {"t": "weather", "s": ["H5.31"], "sg": null, "q": ["You see a patch of fog ahead. You should:", "جلوتر، یک تکه مه می‌بینید. چه باید بکنید؟"], "o": [["Slow down before you enter the fog and use the right edge of the road or lane markings as a guide", "قبل از ورود به مه سرعت را کم کنید و از لبه راست جاده یا خط‌کشی‌ها برای راهنمایی استفاده کنید"], ["Keep your speed and slow down only if you see a car", "سرعت را حفظ کنید و فقط اگر ماشینی دیدید کم کنید"], ["Follow the center line closely", "نزدیک خط وسط جاده حرکت کنید"], ["Turn on high beams to see farther", "نور بالا را روشن کنید تا دورتر ببینید"]], "a": 0, "x": "کتابچه (دید کم): «قبل از ورود به تکه مه سرعت را کم کنید و به سرعت‌سنج نگاه کنید» و «از لبه راست جاده یا خط‌کشی‌ها به‌عنوان راهنما استفاده کنید.» از نور پایین استفاده کنید؛ نور بالا در مه بازتاب می‌شود. دنبال کردن خط وسط شما را به ترافیک روبه‌رو نزدیک می‌کند."}, {"t": "dui", "s": ["S7", "316.1939"], "sg": null, "q": ["If you refuse a lawful breath, blood, or urine test in Florida, your refusal:", "اگر در فلوریدا از آزمایش قانونی تنفس، خون یا ادرار امتناع کنید، این امتناع:"], "o": [["Can be used as evidence against you in a DUI criminal case", "می‌تواند در پرونده کیفری DUI به‌عنوان مدرک علیه شما استفاده شود"], ["Cannot be mentioned in court", "نمی‌تواند در دادگاه مطرح شود"], ["Ends the DUI case automatically", "پرونده DUI را به‌طور خودکار پایان می‌دهد"], ["Only matters if you are under 21", "فقط اگر زیر ۲۱ سال باشید اهمیت دارد"]], "a": 0, "x": "صفحه قوانین DUI سایت FLHSMV: «امتناع از آزمایش تنفس، ادرار یا خون در دادرسی کیفری DUI به‌عنوان مدرک پذیرفته می‌شود.» علاوه بر آن، امتناع اول ۱ سال تعلیق اداری گواهینامه دارد و امتناع دوم یا بیشتر ۱۸ ماه؛ و از ۱ اکتبر ۲۰۲۵ طبق بند 316.1939، امتناع اول از آزمایش تنفس یا ادرار جنحه درجه دو و امتناع دوم یا بیشتر جنحه درجه یک است. امتناع پرونده را تمام نمی‌کند و برای همه سنین اعمال می‌شود."}, {"t": "dui", "s": ["S7"], "sg": null, "q": ["A third DUI conviction within 10 years of a prior conviction is:", "سومین محکومیت DUI در کمتر از ۱۰ سال پس از محکومیت قبلی، چه نوع جرمی است؟"], "o": [["A third-degree felony", "جنایت درجه سه (Felony)"], ["A simple traffic ticket", "یک جریمه ساده رانندگی"], ["A civil infraction with no jail", "تخلف مدنی بدون زندان"], ["A warning only", "فقط یک اخطار"]], "a": 0, "x": "FLHSMV: «هر کس برای سومین بار در کمتر از ۱۰ سال از محکومیت قبلی، یا برای چهارمین بار یا بیشتر، به DUI محکوم شود، مرتکب جنایت درجه سه شده است (حداکثر ۵۰۰۰ دلار جریمه و/یا ۵ سال زندان).» همچنین سومین محکومیت در ۱۰ سال حداقل ۱۰ سال لغو گواهینامه دارد. DUI هرگز یک جریمه ساده نیست."}, {"t": "safe", "s": ["316.304", "H7.3"], "sg": null, "q": ["Under Florida law, while driving you may NOT wear:", "طبق قانون فلوریدا، هنگام رانندگی نمی‌توانید از چه چیزی استفاده کنید؟"], "o": [["Headphones or a headset, except a single-ear phone headset or a hearing aid", "هدفون یا هدست، به‌جز هدست تلفن یک‌گوش یا سمعک"], ["Sunglasses during the day", "عینک آفتابی در روز"], ["Prescription glasses", "عینک طبی"], ["A hat", "کلاه"]], "a": 0, "x": "بند 316.304: «هیچ‌کس نباید هنگام رانندگی هدست، هدفون یا دستگاه شنیداری دیگر به‌جز سمعک استفاده کند.» استثناها شامل هدست تلفن همراه «یک‌گوش» است که اجازه شنیدن صداهای اطراف را بدهد. کتابچه هم هدست راننده را جزو تجهیزات غیرمجاز آورده است. شنیدن آژیر و بوق برای ایمنی ضروری است. عینک و کلاه ممنوع نیستند."}, {"t": "row", "s": ["316.0815"], "sg": null, "q": ["A public transit bus in a designated pull-out bay signals that it is re-entering traffic in your direction. You must:", "اتوبوس حمل‌ونقل عمومی در جایگاه توقف مخصوص، راهنما می‌زند که می‌خواهد در جهت شما وارد ترافیک شود. چه باید بکنید؟"], "o": [["Yield the right-of-way to the bus", "به اتوبوس حق تقدم بدهید"], ["Speed up and pass before it pulls out", "سرعت را زیاد کنید و قبل از خروج آن رد شوید"], ["Honk so it waits", "بوق بزنید تا صبر کند"], ["Change lanes without signaling", "بدون راهنما خط عوض کنید"]], "a": 0, "x": "بند 316.0815: «راننده باید به اتوبوس حمل‌ونقل عمومی که در همان جهت حرکت می‌کند و راهنما زده و از جایگاه مخصوص توقف در حال بازگشت به جریان ترافیک است، حق تقدم بدهد.» سرعت گرفتن برای عبور از جلوی اتوبوس یا بوق زدن خلاف این قانون است."}, {"t": "safe", "s": ["H5.30"], "sg": null, "q": ["An animal suddenly runs into the road in front of you. According to the handbook, you should NOT:", "حیوانی ناگهان جلوی شما وارد جاده می‌شود. طبق کتابچه، چه کاری «نباید» بکنید؟"], "o": [["Swerve into oncoming traffic or off the road to avoid it", "برای دوری از آن به ترافیک روبه‌رو یا بیرون از جاده منحرف شوید"], ["Brake firmly while staying in your lane", "در حالی که در خط خود می‌مانید محکم ترمز کنید"], ["Keep control of the vehicle", "کنترل خودرو را حفظ کنید"], ["Report a crash with a large animal to police", "تصادف با حیوان بزرگ را به پلیس گزارش دهید"]], "a": 0, "x": "کتابچه (بخش حیوانات): «برای اجتناب از برخورد با حیوان، به سمت ترافیک روبه‌رو یا بیرون از جاده منحرف نشوید.» انحراف ناگهانی معمولاً خطرناک‌تر از برخورد با حیوان است. کتابچه همچنین می‌گوید در سپیده‌دم و غروب احتیاط کنید و تصادف با حیوان بزرگ (مثل گوزن یا دام) را به پلیس گزارش دهید."}, {"t": "safe", "s": ["H6.2"], "sg": null, "q": ["According to the handbook, where should you expect to find bicyclists?", "طبق کتابچه، کجا باید انتظار دیدن دوچرخه‌سوار را داشته باشید؟"], "o": [["On all types of roads except interstate highways, at all times of day and night", "در همه نوع جاده به‌جز بزرگراه‌های بین‌ایالتی، در همه ساعات شبانه‌روز"], ["Only on roads with bike lanes", "فقط در جاده‌های دارای خط دوچرخه"], ["Only during daylight", "فقط در روز"], ["Only on sidewalks", "فقط روی پیاده‌رو"]], "a": 0, "x": "کتابچه: «انتظار داشته باشید دوچرخه‌سوار را در همه نوع جاده (به‌جز بزرگراه‌های بین‌ایالتی)، در همه تقاطع‌ها و میدان‌ها، در هر آب‌وهوا و در همه ساعات شبانه‌روز ببینید.» دوچرخه در فلوریدا وسیله نقلیه محسوب می‌شود و حق استفاده از جاده را دارد. هنگام سبقت دست‌کم ۳ فوت فاصله بدهید."}], [{"t": "signs", "s": ["H5.23", "H6.2"], "sg": null, "q": ["A bike lane is marked next to your lane. When may you drive a car in it?", "کنار خط شما یک خط دوچرخه خط‌کشی شده است. چه زمانی می‌توانید با خودرو وارد آن شوید؟"], "o": [["Only at an intersection where the bike-lane line is broken (dashed) to prepare for a turn, and only when no bicyclists are in the bike lane", "فقط در تقاطع، جایی که خط دوچرخه با خط‌چین سفید مشخص شده، برای آماده شدن جهت گردش، و فقط وقتی هیچ دوچرخه‌سواری در خط دوچرخه نیست"], ["Any time traffic is heavy", "هر وقت ترافیک سنگین است"], ["To pass a slow car on the right", "برای سبقت از خودروی آهسته از سمت راست"], ["Whenever you use your turn signal", "هر وقت راهنما بزنید"]], "a": 0, "x": "کتابچه (خطوط ترافیک): خودروهای موتوری اجازه ندارند در خط دوچرخه رانندگی کنند، مگر در تقاطع‌هایی که با خط سفید بریده‌بریده (خط‌چین) مشخص شده و فقط وقتی دوچرخه‌سواری در آن نیست. پیش از گردش به راست، راهنما بزنید و به دوچرخه‌سوار داخل خط دوچرخه حق تقدم بدهید. ترافیک سنگین، سبقت یا راهنما زدن دلیل مجاز برای رانندگی در خط دوچرخه نیست."}, {"t": "signs", "s": ["H5.22"], "sg": null, "q": ["Is it legal to use your turn signal to tell the driver behind you that it is safe to pass?", "آیا استفاده از راهنما برای اینکه به راننده پشت سر بگویید «سبقت امن است» قانونی است؟"], "o": [["No, it is against the law", "نه، خلاف قانون است"], ["Yes, it is a courtesy signal", "بله، یک علامت ادب است"], ["Yes, but only on two-lane roads", "بله، اما فقط در جاده‌های دوخطه"], ["Yes, if you also wave", "بله، اگر دست هم تکان دهید"]], "a": 0, "x": "کتابچه (راهنما و علائم اضطراری): «استفاده از راهنما برای اینکه به رانندگان پشت سر بگویید می‌توانند سبقت بگیرند، خلاف قانون است.» راهنما فقط برای اعلام قصد «خودتان» برای گردش یا تغییر خط است. ممکن است راننده پشتی فکر کند شما می‌پیچید، یا شما خطری را که او می‌بیند نبینید."}, {"t": "signs", "s": ["H7.3"], "sg": null, "q": ["Which of these is NOT permitted on a private passenger car in Florida?", "کدام یک از این‌ها روی خودروی شخصی در فلوریدا «مجاز نیست»؟"], "o": [["Red or blue emergency lights, or a siren", "چراغ‌های اضطراری قرمز یا آبی، یا آژیر"], ["A working horn", "بوق سالم"], ["Two red taillights", "دو چراغ قرمز عقب"], ["A rear-view mirror", "آینه عقب"]], "a": 0, "x": "کتابچه (تجهیزات غیرمجاز): «چراغ‌های اضطراری قرمز یا آبی» و «آژیر، زنگ یا سوت» فقط برای خودروهای امدادی و پلیس مجازند. همچنین اگزوز بسیار پرصدا، برچسب روی شیشه جلو (به‌جز موارد قانونی)، تلویزیون قابل‌دید برای راننده و استفاده راننده از هدست یا هدفون غیرمجازند (به‌جز سمعک، و هدست تلفن همراه که فقط روی یک گوش است و صدای اطراف را از گوش دیگر قطع نمی‌کند — بند 316.304). بوق، چراغ عقب و آینه جزو تجهیزات «الزامی» هستند."}, {"t": "signs", "s": ["316.2953", "316.2954"], "sg": null, "q": ["Under Florida law, tint on the front side windows next to the driver may not reflect more than what percentage of visible light?", "طبق قانون فلوریدا، فیلم (تینت) شیشه‌های کناری جلو، کنار راننده، حداکثر چند درصد از نور مرئی را می‌تواند بازتاب دهد؟"], "o": [["25% of the light", "۲۵٪ نور"], ["5% of the light", "۵٪ نور"], ["75% of the light", "۷۵٪ نور"], ["There is no limit", "محدودیتی وجود ندارد"]], "a": 0, "x": "بند 316.2953: فیلم شیشه‌های کناری جلو (کنار راننده) نباید بیش از ۲۵٪ نور مرئی را بازتاب دهد و باید دست‌کم ۲۸٪ نور را عبور دهد. حد ۳۵٪ فقط برای شیشه‌های پشت راننده است (بند 316.2954). شیشه جلو باید شیشه ایمنی باشد و نباید بازتابنده یا مات شود؛ پس «محدودیتی وجود ندارد» نادرست است و ۵٪ و ۷۵٪ عدد قانون نیستند."}, {"t": "roads", "s": ["H5.23", "316.081"], "sg": null, "q": ["On a multi-lane highway, you should drive:", "در بزرگراه چندخطه، در کدام خط باید رانندگی کنید؟"], "o": [["In the right lanes, except when overtaking and passing", "در خطوط راست، به‌جز هنگام سبقت"], ["In the left lane at all times", "همیشه در خط چپ"], ["In any lane at any speed", "در هر خطی با هر سرعتی"], ["On the shoulder when traffic is slow", "وقتی ترافیک کند است، روی شانه جاده"]], "a": 0, "x": "کتابچه (خطوط ترافیک): «اگر جاده چهار خط یا بیشتر با ترافیک دوطرفه دارد، در خطوط راست برانید مگر هنگام سبقت.» بند 316.081 هم می‌گوید خودروهای کندتر از جریان عادی باید در خط راست باشند. رانندگی روی شانه جاده برای عبور از ترافیک ممنوع است."}, {"t": "roads", "s": ["H5.23", "316.0875"], "sg": null, "q": ["On a two-lane, two-way highway, you may drive on the LEFT half of the road:", "در جاده دوخطه دوطرفه، چه زمانی می‌توانید در نیمه «چپ» جاده برانید؟"], "o": [["When it is safe to pass and passing is allowed", "وقتی سبقت امن و مجاز است"], ["Whenever the left half is smoother", "هر وقت نیمه چپ صاف‌تر است"], ["At night when there is no traffic", "شب هنگام که ترافیکی نیست"], ["Whenever the vehicle ahead is slower than you, even in a no-passing zone", "هر وقت خودروی جلویی از شما کندتر است، حتی در منطقه سبقت ممنوع"]], "a": 0, "x": "کتابچه: «در بزرگراه‌های دوخطه، وقتی سبقت امن و مجاز است، اجازه دارید در نیمه چپ جاده برانید.» در غیر این صورت همیشه در نیمه راست بمانید. شب بودن یا صاف‌تر بودن آسفالت دلیل قانونی نیست. در منطقه سبقت ممنوع نباید برای سبقت به نیمه چپ بروید؛ قانون فقط در موارد محدودی اجازه می‌دهد به‌طور ایمن و کوتاه از خط وسط عبور کنید: دور زدن یک مانع، گردش به چپ به داخل/از کوچه یا ورودی، یا سبقت از دوچرخه یا وسیله غیرموتوری (بند 316.0875)."}, {"t": "roads", "s": ["316.081"], "sg": null, "q": ["In which situation may you cross the center line on a two-way road with four or more lanes?", "در جاده دوطرفه با چهار خط یا بیشتر، در چه حالتی می‌توانید از خط وسط عبور کنید؟"], "o": [["When turning left into or out of an alley, private road, or driveway, or when traffic control devices allow it", "هنگام گردش به چپ به داخل یا از کوچه، راه خصوصی یا ورودی، یا وقتی علائم راهنمایی اجازه دهند"], ["To pass a slower vehicle", "برای سبقت از خودروی کندتر"], ["When the right lanes are crowded", "وقتی خطوط راست شلوغ است"], ["Any time you signal", "هر وقت راهنما بزنید"]], "a": 0, "x": "بند 316.081 (۴): در جاده‌های دوطرفه با چهار خط یا بیشتر، خودرو نباید به سمت چپ خط وسط برود، مگر وقتی علائم راهنمایی اجازه دهند، وقتی مانعی در جاده عبور از سمت چپ را ناگزیر کند (با دادن حق تقدم به ترافیک روبه‌رو)، یا برای گردش به چپ به کوچه، راه خصوصی یا ورودی. در این جاده‌ها سبقت از خط مخالف ممنوع است؛ از خطوط هم‌جهت برای سبقت استفاده کنید."}, {"t": "roads", "s": ["316.081"], "sg": null, "q": ["You are driving in the far-left lane of a multi-lane highway and a faster vehicle comes up behind you. Florida law says you should:", "در چپ‌ترین خط بزرگراه چندخطه هستید و خودروی سریع‌تری از پشت نزدیک می‌شود. قانون فلوریدا چه می‌گوید؟"], "o": [["Move out of the left lane when safe, unless you are passing or preparing to turn left", "وقتی امن شد از خط چپ خارج شوید، مگر در حال سبقت یا آماده گردش به چپ باشید"], ["Stay in the left lane; you are within the speed limit", "در خط چپ بمانید؛ شما در حد مجاز سرعت هستید"], ["Brake to slow the faster driver", "ترمز کنید تا راننده سریع را آهسته کنید"], ["Speed up above the limit", "سرعت را بالاتر از حد مجاز ببرید"]], "a": 0, "x": "بند 316.081 (۳): راننده نباید به رانندگی در منتهاالیه چپ‌ترین خط ادامه دهد اگر می‌داند یا باید بداند که خودروی سریع‌تری در همان خط از پشت در حال رسیدن به اوست؛ مگر در حال سبقت یا آماده شدن برای گردش به چپ باشد. این تخلف رانندگی است، حتی اگر در حد مجاز سرعت باشید. ترمز زدن برای «تنبیه» خطرناک است."}, {"t": "roads", "s": ["H5.28"], "sg": null, "q": ["On an expressway, most exits are:", "در بزرگراه (اکسپرس‌وی)، بیشتر خروجی‌ها کجا هستند؟"], "o": [["From the right lane; get into the exit lane early and signal", "از خط راست؛ زودتر وارد خط خروجی شوید و راهنما بزنید"], ["From the left lane", "از خط چپ"], ["From the median", "از میانه"], ["Unmarked, so you must guess", "بدون علامت، پس باید حدس بزنید"]], "a": 0, "x": "کتابچه (رانندگی در بزرگراه): «وارد خط خروجی شوید؛ تابلوها می‌گویند کدام خط. بیشتر خروجی‌های بزرگراه از خط راست هستند.» قصد خود را با راهنما اعلام کنید و به حد سرعت رمپ خروجی توجه کنید (معمولاً کمتر از بزرگراه). پیچیدن لحظه آخر به خروجی خطرناک است."}, {"t": "roads", "s": ["H5.28"], "sg": null, "q": ["Which of these is NOT allowed on an expressway?", "کدام یک از این کارها در بزرگراه «مجاز نیست»؟"], "o": [["Stopping on the pavement (except in an emergency) or backing up on a ramp", "توقف روی سطح جاده (به‌جز اضطرار) یا دنده‌عقب رفتن روی رمپ"], ["Driving in the right lane", "رانندگی در خط راست"], ["Passing on the left", "سبقت از سمت چپ"], ["Taking a break at a rest area", "استراحت در استراحتگاه"]], "a": 0, "x": "کتابچه: «هرگز روی سطح بزرگراه توقف نکنید مگر در اضطرار، روی رمپ دنده‌عقب نروید، از میانه عبور نکنید» و فاصله ایمن نگه دارید. رانندگی در خط راست، سبقت از چپ و استراحت در استراحتگاه همگی کارهای درست و توصیه‌شده‌اند."}, {"t": "roads", "s": ["316.1515"], "sg": null, "q": ["In Florida, a U-turn is legal only if:", "در فلوریدا، دور زدن (U-turn) فقط در چه صورتی قانونی است؟"], "o": [["It can be made safely, without interfering with other traffic, and no sign prohibits it", "بتوان آن را ایمن و بدون مزاحمت برای ترافیک انجام داد و تابلویی آن را ممنوع نکرده باشد"], ["You are at a green light", "چراغ شما سبز باشد"], ["You use your hazard lights", "فلاشر را روشن کنید"], ["It is after dark", "بعد از تاریکی هوا باشد"]], "a": 0, "x": "بند 316.1515: «راننده نباید خودرو را برای حرکت در جهت مخالف برگرداند، مگر اینکه این حرکت ایمن و بدون مزاحمت برای ترافیک دیگر باشد و تابلوی راهنمایی آن را ممنوع نکرده باشد.» تخلف از آن تخلف رانندگی است. چراغ سبز یا فلاشر آن را قانونی نمی‌کند. کتابچه همچنین می‌گوید در پیچ یا روی تپه هرگز دور نزنید."}, {"t": "row", "s": ["H5.15"], "sg": null, "q": ["At a four-way stop, which vehicle should move forward first?", "در ایست چهارطرفه، کدام خودرو باید اول حرکت کند؟"], "o": [["The first vehicle to come to a complete stop", "اولین خودرویی که توقف کامل کرده است"], ["The vehicle going the fastest", "سریع‌ترین خودرو"], ["The vehicle on the left", "خودروی سمت چپ"], ["The vehicle turning right, always", "همیشه خودرویی که به راست می‌پیچد"]], "a": 0, "x": "کتابچه (تابلوهای ایست): «در ایست چهارطرفه، اولین خودرویی که توقف می‌کند باید اول حرکت کند. اگر دو خودرو هم‌زمان برسند، راننده سمت چپ به راننده سمت راست راه می‌دهد.» پس «سمت چپ» نادرست است (او باید راه بدهد). جهت گردش به‌تنهایی حق اول بودن نمی‌دهد."}, {"t": "row", "s": ["H5.15"], "sg": null, "q": ["After you make a complete stop at a stop sign, you must:", "پس از توقف کامل در تابلوی ایست، چه باید بکنید؟"], "o": [["Yield the right-of-way to all other traffic and pedestrians before going", "قبل از حرکت، به همه ترافیک و عابران حق تقدم بدهید"], ["Go immediately; stopping gives you the right-of-way", "فوراً حرکت کنید؛ توقف به شما حق تقدم می‌دهد"], ["Wait exactly 3 seconds, then go", "دقیقاً ۳ ثانیه صبر کنید و بعد بروید"], ["Honk and go", "بوق بزنید و بروید"]], "a": 0, "x": "کتابچه: «پس از توقف کامل، باید در تابلوی ایست به همه ترافیک و عابران حق تقدم بدهید.» توقف به‌تنهایی به شما حق تقدم نمی‌دهد؛ باید صبر کنید تا راه باز و امن شود. هیچ قانونی درباره «۳ ثانیه» وجود ندارد."}, {"t": "row", "s": ["H5.17"], "sg": null, "q": ["In a multi-lane roundabout, which lane should you use to turn LEFT?", "در میدان چندخطه، برای گردش به «چپ» از کدام خط استفاده کنید؟"], "o": [["The left lane", "خط چپ"], ["The right lane", "خط راست"], ["Any lane", "هر خطی"], ["The shoulder", "شانه جاده"]], "a": 0, "x": "کتابچه (میدان‌ها): «برای گردش به چپ در خط چپ و برای گردش به راست در خط راست بمانید؛ برای مستقیم رفتن همه خطوط مجازند، مگر اینکه تابلو یا خط‌کشی روی آسفالت چیز دیگری بگوید.» ورود به میدان همیشه با دادن حق تقدم به ترافیک داخل میدان و حرکت در جهت خلاف عقربه‌های ساعت است."}, {"t": "row", "s": ["H5.17"], "sg": null, "q": ["Before entering and when exiting a roundabout, you must yield to:", "قبل از ورود و هنگام خروج از میدان، به چه کسانی باید حق تقدم بدهید؟"], "o": [["Pedestrians in the crosswalks", "عابران پیاده در خط عابر"], ["No one", "هیچ‌کس"], ["Only other cars", "فقط خودروهای دیگر"], ["Only bicyclists in the roundabout", "فقط دوچرخه‌سواران داخل میدان"]], "a": 0, "x": "کتابچه: «رانندگان باید قبل از ورود یا هنگام خروج از میدان به عابران در خط عابر حق تقدم بدهند.» همچنین به ترافیکی که داخل میدان است راه بدهید. دوچرخه‌سواران می‌توانند از کل خط در میدان استفاده کنند یا از پیاده‌رو بروند."}, {"t": "row", "s": ["H6.1"], "sg": null, "q": ["A pedestrian using a wheelchair, walker, or other mobility aid is crossing. You must:", "عابری با ویلچر، واکر یا وسیله کمکی دیگر در حال عبور است. چه باید بکنید؟"], "o": [["Yield the right-of-way", "حق تقدم را به او بدهید"], ["Yield only in a school zone", "فقط در منطقه مدرسه حق تقدم بدهید"], ["Drive around the person carefully", "با احتیاط از کنار او رد شوید"], ["Honk to help them hurry", "بوق بزنید تا عجله کند"]], "a": 0, "x": "کتابچه (عابران): «رانندگان باید به افراد دارای محدودیت حرکتی و عابرانی که از سگ راهنما یا حیوان خدماتی کمک می‌گیرند حق تقدم بدهند.» فرد با ویلچر یا واکر نیز فردی دارای محدودیت حرکتی است. همچنین «همیشه» به افراد نابینا راه بدهید. مسئولیت اجتناب از برخورد با عابران با رانندگان است. بوق زدن یا دور زدن از کنار عابر خطرناک است."}, {"t": "row", "s": ["H6.8"], "sg": null, "q": ["A large truck ahead of you is making a right turn and has swung wide to the left. You should:", "کامیون بزرگی جلوی شما در حال گردش به راست است و برای این کار به سمت چپ باز کرده است. چه باید بکنید؟"], "o": [["Stay back; never try to squeeze between the truck and the curb", "عقب بمانید؛ هرگز سعی نکنید بین کامیون و جدول وارد شوید"], ["Pass it on the right while it turns", "در حین گردش، از سمت راست از آن رد شوید"], ["Honk and go around it on the left", "بوق بزنید و از سمت چپ دورش بزنید"], ["Follow very closely so you can turn with it", "خیلی نزدیک دنبالش کنید تا با آن بپیچید"]], "a": 0, "x": "کتابچه (اشتراک جاده با کامیون): رانندگان کامیون و اتوبوس گاهی برای گردش به راست باید به چپ باز کنند و «نمی‌توانند خودروها، موتورها یا دوچرخه‌هایی را که مستقیم پشت یا کنارشان هستند ببینند.» هرگز بین کامیون و جدول وارد نشوید؛ این کار احتمال تصادف را زیاد می‌کند. نزدیک دنبال کردن هم شما را در نقطه کور عقب قرار می‌دهد."}, {"t": "special", "s": ["316.159"], "sg": null, "q": ["Florida law requires which vehicles to stop 15 to 50 feet from the nearest rail at a railroad crossing, even when no train is visible?", "قانون فلوریدا کدام وسایل نقلیه را ملزم می‌کند در تقاطع راه‌آهن، در فاصله ۱۵ تا ۵۰ فوتی نزدیک‌ترین ریل توقف کنند، حتی وقتی قطاری دیده نمی‌شود؟"], "o": [["School buses carrying children, passenger vehicles for hire (not taxis), and vehicles carrying explosives or flammable liquids", "اتوبوس مدرسه حامل دانش‌آموز، وسایل مسافربری کرایه‌ای (به‌جز تاکسی) و خودروهای حامل مواد منفجره یا مایعات قابل اشتعال"], ["All passenger cars", "همه خودروهای سواری"], ["Only motorcycles", "فقط موتورسیکلت‌ها"], ["Only taxis", "فقط تاکسی‌ها"]], "a": 0, "x": "بند 316.159: راننده هر خودروی مسافربری کرایه‌ای (به‌جز تاکسی)، هر اتوبوس مدرسه حامل دانش‌آموز و هر خودروی حامل مواد منفجره یا مایعات قابل اشتعال باید در فاصله ۱۵ تا ۵۰ فوتی نزدیک‌ترین ریل توقف کند، گوش کند و نگاه کند، و هنگام عبور از روی ریل دنده عوض نکند. اگر پشت چنین خودرویی هستید، آماده توقف آن باشید و فاصله بیشتری بگذارید. اگر پلیس، چراغ یا تابلو اجازه عبور بدهد توقف لازم نیست، اما اتوبوس مدرسه حامل دانش‌آموز فقط با اجازه پلیس از توقف معاف است."}, {"t": "special", "s": ["322.27", "318.18"], "sg": null, "q": ["Illegally passing a stopped school bus in a way that causes serious bodily injury or death adds how many points?", "عبور غیرقانونی از اتوبوس مدرسه متوقف که به آسیب جسمی جدی یا مرگ منجر شود، چند امتیاز منفی دارد؟"], "o": [["3 points", "۳ امتیاز"], ["4 points", "۴ امتیاز"], ["6 points", "۶ امتیاز"], ["12 points", "۱۲ امتیاز"]], "a": 2, "x": "بند 322.27: عبور غیرقانونی از اتوبوس مدرسه متوقف ۴ امتیاز دارد؛ اگر به آسیب جدی یا مرگ منجر شود ۶ امتیاز. در این حالت طبق بند 318.18 جریمه ۱۵۰۰ دلار نیز اعمال می‌شود. ۱۲ امتیاز در جدول وجود ندارد؛ ۱۲ امتیاز در ۱۲ ماه آستانه تعلیق است."}, {"t": "brakes", "s": ["H7.1"], "sg": null, "q": ["According to the handbook, how far does a car travel at 50 mph during the average driver's REACTION time (the time it takes to move your foot to the brake after deciding to stop)?", "طبق کتابچه، خودرو با سرعت ۵۰ مایل در ساعت در طول «زمان واکنش» متوسط راننده (زمانی که پس از تصمیم به توقف طول می‌کشد تا پا را روی ترمز بگذارید) چه مسافتی طی می‌کند؟"], "o": [["About 55 feet", "حدود ۵۵ فوت"], ["About 5 feet", "حدود ۵ فوت"], ["About 150 feet", "حدود ۱۵۰ فوت"], ["About 400 feet", "حدود ۴۰۰ فوت"]], "a": 0, "x": "کتابچه: زمان واکنش متوسط حدود ۳/۴ تا ۱ ثانیه است و در ۵۰ مایل در ساعت خودرو در این مدت «حدود ۵۵ فوت» پیش می‌رود، پیش از اینکه حتی ترمز شروع به کار کند. سپس مسافت ترمز روی آسفالت خشک در ۵۰ مایل در ساعت حدود ۱۵۸ فوت است. به همین دلیل حواس‌پرتی حتی یک ثانیه‌ای خطرناک است."}, {"t": "brakes", "s": ["H7.1"], "sg": null, "q": ["At 50 mph on dry pavement, the BRAKING distance alone (after the brakes are applied) is about:", "با سرعت ۵۰ مایل در ساعت روی آسفالت خشک، «مسافت ترمز» به‌تنهایی (پس از فشار دادن ترمز) حدود چقدر است؟"], "o": [["58 feet", "۵۸ فوت"], ["158 feet", "۱۵۸ فوت"], ["268 feet", "۲۶۸ فوت"], ["450 feet", "۴۵۰ فوت"]], "a": 1, "x": "کتابچه: در ۵۰ مایل در ساعت روی آسفالت خشک، مسافت ترمز حدود ۱۵۸ فوت است. ۲۶۸ فوت «کل» مسافت توقف است (درک + واکنش + ترمز). ۴۵۰ فوت برد نور بالای چراغ‌هاست. روی جاده خیس مسافت ترمز بسیار بیشتر می‌شود."}, {"t": "emergency", "s": ["H5.32"], "sg": null, "q": ["Your gas pedal sticks down while driving. According to the handbook, one of the right steps is to:", "هنگام رانندگی پدال گاز گیر کرده است. طبق کتابچه، یکی از اقدامات درست چیست؟"], "o": [["Shift into neutral (after trying to tap or pry up the pedal)", "دنده را خلاص کنید (پس از تلاش برای ضربه زدن یا بالا کشیدن پدال)"], ["Press the gas pedal harder to free it", "پدال گاز را محکم‌تر فشار دهید تا آزاد شود"], ["Shift into Park", "دنده را روی P بگذارید"], ["Open the door and jump out", "در را باز کنید و بیرون بپرید"]], "a": 0, "x": "کتابچه (موقعیت‌های اضطراری) برای پدال گاز گیرکرده: «با پا به پدال ضربه بزنید. سعی کنید با نوک کفش پدال را بالا بکشید. دنده را خلاص کنید. سوئیچ را خاموش کنید (کلید را به حالت قفل نچرخانید، وگرنه فرمان قفل می‌شود). ترمز کنید.» فشار بیشتر روی گاز فقط سرعت را بالا می‌برد، و زدن دنده P در حال حرکت یا پریدن از خودرو جزو دستورالعمل کتابچه نیست و بسیار خطرناک است."}, {"t": "brakes", "s": ["H5.5"], "sg": null, "q": ["The safest way to back up your vehicle is to:", "ایمن‌ترین روش دنده‌عقب رفتن چیست؟"], "o": [["Check behind the car before getting in, turn and look through the rear window, and back slowly", "قبل از سوار شدن پشت خودرو را بررسی کنید، برگردید و از شیشه عقب نگاه کنید و آهسته عقب بروید"], ["Use only your mirrors and back quickly", "فقط از آینه‌ها استفاده کنید و سریع عقب بروید"], ["Use only the backup camera", "فقط از دوربین دنده‌عقب استفاده کنید"], ["Honk and back up at normal speed", "بوق بزنید و با سرعت عادی عقب بروید"]], "a": 0, "x": "کتابچه (دنده‌عقب): «قبل از سوار شدن پشت خودرو را بررسی کنید؛ کودکان یا اشیای کوچک از صندلی راننده دیده نمی‌شوند. دست راست را روی پشتی صندلی بگذارید و برگردید تا مستقیم از شیشه عقب ببینید. به آینه‌ها تکیه نکنید. آهسته عقب بروید؛ کنترل فرمان در دنده‌عقب سخت‌تر است.» در آزمون عملی هم باید ۵۰ فوت آهسته و با نگاه به عقب دنده‌عقب بروید."}, {"t": "parking", "s": ["H5.27"], "sg": null, "q": ["When you park straight in (angle or perpendicular space), your car should be:", "وقتی مستقیم (در جای پارک عمود یا مورب) پارک می‌کنید، خودرو باید چگونه باشد؟"], "o": [["Centered in the space, with no part sticking out into the traffic lane", "در وسط جای پارک، بدون اینکه بخشی از آن وارد خط عبور شود"], ["Touching the line on the driver's side", "چسبیده به خط سمت راننده"], ["Partly in the next space to leave room to open doors", "بخشی از آن در جای کناری تا درها راحت باز شوند"], ["Parked with the rear bumper in the aisle", "با سپر عقب داخل راهرو"]], "a": 0, "x": "کتابچه: «وقتی درست پارک کرده‌اید، خودرو باید در وسط جای پارک باشد و هیچ بخشی از آن وارد خط عبور نشده باشد.» اشغال جای کناری یا بیرون ماندن سپر در راهرو باعث مزاحمت و تصادف می‌شود. پارک مستقیم جزو آزمون عملی رانندگی فلوریدا است."}, {"t": "parking", "s": ["H5.27", "S12"], "sg": null, "q": ["‘Double parking’, stopping on the street side of a car that is already parked at the curb, is:", "«پارک دوبل»، یعنی توقف در سمت خیابانِ خودرویی که کنار جدول پارک شده، چه حکمی دارد؟"], "o": [["Not allowed", "مجاز نیست"], ["Allowed for up to 5 minutes", "تا ۵ دقیقه مجاز است"], ["Allowed with hazard lights on", "با فلاشر روشن مجاز است"], ["Allowed at night", "در شب مجاز است"]], "a": 0, "x": "کتابچه و بند 316.1945: پارک یا توقف «در سمت خیابانِ هر خودرویی که کنار جدول یا لبه جاده ایستاده» ممنوع است. روشن کردن فلاشر یا کوتاه بودن زمان آن را قانونی نمی‌کند، چون یک خط ترافیک را می‌بندد و دیگران را مجبور به تغییر خط ناگهانی می‌کند."}, {"t": "parking", "s": ["H5.27", "S12"], "sg": null, "q": ["Which of these is a place where you may NOT park?", "پارک کردن در کدام یک از این مکان‌ها «ممنوع» است؟"], "o": [["In a bicycle lane or on a sidewalk", "در خط دوچرخه یا روی پیاده‌رو"], ["In a legal space 40 feet from a stop sign", "در جای مجاز در ۴۰ فوتی تابلوی ایست"], ["In your own driveway", "در ورودی خانه خودتان"], ["In a marked space in a parking lot", "در جای خط‌کشی‌شده پارکینگ"]], "a": 0, "x": "کتابچه و بند 316.1945: پارک روی خط عابر، «پیاده‌رو» و در «خط دوچرخه» ممنوع است؛ همچنین جلوی ورودی‌ها و کنار جدول زردرنگ. ۴۰ فوت از تابلوی ایست بیشتر از حداقل ۳۰ فوت است، پس مجاز است. پارک در ورودی خانه خودتان (بدون بستن پیاده‌رو) و جای خط‌کشی‌شده پارکینگ مجاز است."}, {"t": "parking", "s": ["316.2005"], "sg": null, "q": ["Florida law says you may not leave a car door open on the side next to moving traffic:", "قانون فلوریدا می‌گوید درِ خودرو را در سمت ترافیک در حال حرکت نباید باز بگذارید:"], "o": [["Longer than necessary to load or unload passengers", "بیشتر از زمان لازم برای سوار یا پیاده کردن مسافران"], ["For more than 10 minutes", "بیش از ۱۰ دقیقه"], ["At night only", "فقط در شب"], ["Unless your hazard lights are on", "مگر اینکه فلاشر روشن باشد"]], "a": 0, "x": "بند 316.2005: هیچ‌کس نباید در خودرو را باز کند مگر وقتی به‌طور معقول ایمن باشد و مزاحم ترافیک نشود، «و نباید در سمت ترافیک در حال حرکت را بیشتر از زمان لازم برای سوار یا پیاده کردن مسافر باز بگذارد.» محدودیت زمانی مشخص (مثل ۱۰ دقیقه) یا استثنای فلاشر وجود ندارد."}, {"t": "lights", "s": ["H7.1", "H5.29"], "sg": null, "q": ["High-beam headlights must show objects at least how far ahead?", "نور بالای چراغ‌های جلو باید اشیا را دست‌کم تا چه فاصله‌ای جلوتر نشان دهد؟"], "o": [["150 feet", "۱۵۰ فوت"], ["300 feet", "۳۰۰ فوت"], ["450 feet", "۴۵۰ فوت"], ["1,000 feet", "۱۰۰۰ فوت"]], "a": 2, "x": "کتابچه: «چراغ‌های بالا (High-beam) که اشیا را تا ۴۵۰ فوت جلوتر نشان دهند» و نور پایین تا ۱۵۰ فوت. نور بالا برای سرعت‌های بیش از ۲۵ مایل در ساعت مؤثرتر است، اما باید در ۵۰۰ فوتی خودروی روبه‌رو و ۳۰۰ فوتی خودروی جلو آن را به نور پایین تغییر دهید. ۱۰۰۰ فوت فاصله دیده شدن چراغ‌های عقب است."}, {"t": "lights", "s": ["H7.1"], "sg": null, "q": ["Your rear license plate must be lit by a white light that makes it readable from:", "پلاک عقب خودرو باید با چراغ سفیدی روشن شود که آن را از چه فاصله‌ای قابل‌خواندن کند؟"], "o": [["50 feet", "۵۰ فوت"], ["150 feet", "۱۵۰ فوت"], ["300 feet", "۳۰۰ فوت"], ["1,000 feet", "۱۰۰۰ فوت"]], "a": 0, "x": "کتابچه (تجهیزات): «یک چراغ سفید که پلاک را از ۵۰ فوتی قابل‌دیدن کند.» اعداد دیگر مربوط به چراغ‌های دیگرند: ۱۵۰ فوت برد نور پایین، ۳۰۰ فوت دیده شدن چراغ ترمز در روز و ۱۰۰۰ فوت دیده شدن چراغ‌های عقب."}, {"t": "lights", "s": ["H7.2"], "sg": null, "q": ["Your vehicle's horn must be able to be heard from at least:", "بوق خودروی شما باید دست‌کم از چه فاصله‌ای شنیده شود؟"], "o": [["50 feet", "۵۰ فوت"], ["100 feet", "۱۰۰ فوت"], ["200 feet", "۲۰۰ فوت"], ["500 feet", "۵۰۰ فوت"]], "a": 2, "x": "کتابچه (سایر تجهیزات): «خودروی شما باید بوقی داشته باشد که از ۲۰۰ فوتی شنیده شود.» آینه عقب هم باید دید دست‌کم ۲۰۰ فوت پشت خودرو را بدهد. بوق فقط برای هشدار ایمنی است، نه برای ابراز خشم."}, {"t": "lights", "s": ["H7.2"], "sg": null, "q": ["According to Florida equipment standards, your tires should have visible tread of at least:", "طبق استانداردهای تجهیزات فلوریدا، آج لاستیک‌ها باید دست‌کم چقدر باشد؟"], "o": [["2/32 of an inch", "۲/۳۲ اینچ"], ["1/32 of an inch", "۱/۳۲ اینچ"], ["1/4 of an inch", "۱/۴ اینچ"], ["Any tread is fine", "هر مقدار آجی کافی است"]], "a": 0, "x": "کتابچه: «لاستیک‌ها باید آج قابل‌دید دست‌کم ۲/۳۲ اینچ در سطح داشته باشند و هیچ نقطه فرسوده‌ای که لایه داخلی را نشان دهد نداشته باشند.» آج کافی برای جلوگیری از هیدروپلنینگ (سُر خوردن روی آب) در باران‌های فلوریدا حیاتی است. ۱/۳۲ کمتر از حد است."}, {"t": "lights", "s": ["H7.2"], "sg": null, "q": ["Your vehicle must have at least one rear-view mirror that shows the road behind you for at least:", "خودروی شما باید دست‌کم یک آینه عقب داشته باشد که جاده پشت سر را تا چه فاصله‌ای نشان دهد؟"], "o": [["50 feet", "۵۰ فوت"], ["200 feet", "۲۰۰ فوت"], ["500 feet", "۵۰۰ فوت"], ["1,000 feet", "۱۰۰۰ فوت"]], "a": 1, "x": "کتابچه: «خودروی شما باید دست‌کم یک آینه عقب داشته باشد که دید بزرگراه را تا دست‌کم ۲۰۰ فوت پشت سر بدهد.» اگر شیشه عقب مات یا مسدود باشد، آینه در هر دو طرف الزامی است. آینه‌ها را قبل از حرکت تنظیم کنید تا لازم نباشد برای دیدن آن‌ها به جلو یا عقب خم شوید."}, {"t": "lights", "s": ["H6.2"], "sg": null, "q": ["At night, you see a bicyclist approaching you. You should:", "شب هنگام، دوچرخه‌سواری را می‌بینید که به سمت شما می‌آید. چه باید بکنید؟"], "o": [["Avoid using your high-beam headlights", "از نور بالا استفاده نکنید"], ["Flash your high beams to warn the cyclist", "برای هشدار به دوچرخه‌سوار نور بالا بزنید"], ["Turn off your headlights", "چراغ‌ها را خاموش کنید"], ["Speed up to pass quickly", "سرعت را زیاد کنید تا سریع رد شوید"]], "a": 0, "x": "کتابچه (دوچرخه‌ها): «شب هنگام، وقتی دوچرخه‌سواری را می‌بینید که نزدیک می‌شود، از نور بالا استفاده نکنید.» نور بالا دوچرخه‌سوار را کور می‌کند و ممکن است تعادلش را از دست بدهد. دوچرخه‌ها نیز از غروب تا طلوع باید چراغ جلو و عقب داشته باشند."}, {"t": "parking", "s": ["H5.27"], "sg": null, "q": ["You park a car with a manual transmission facing UPHILL. After setting the parking brake, leave it in:", "خودروی دنده‌دستی را رو به «سربالایی» پارک می‌کنید. پس از کشیدن ترمز دستی، آن را در کدام دنده بگذارید؟"], "o": [["First gear", "دنده یک"], ["Reverse", "دنده عقب"], ["Neutral", "خلاص"], ["Third gear", "دنده سه"]], "a": 0, "x": "کتابچه: «دنده دستی را در سراشیبی روی دنده عقب و در سربالایی روی دنده یک بگذارید.» در سربالایی، خودرو تمایل دارد به عقب برود و دنده یک در برابر این حرکت مقاومت می‌کند. دنده خلاص هیچ مقاومتی ندارد. در خودروی اتوماتیک دنده را روی P بگذارید و ترمز دستی را بکشید."}, {"t": "safe", "s": ["H6.3"], "sg": null, "q": ["When following a motorcycle, the handbook recommends a buffer of at least:", "هنگام حرکت پشت موتورسیکلت، کتابچه دست‌کم چه فاصله‌ای را توصیه می‌کند؟"], "o": [["Four seconds, more in bad weather", "چهار ثانیه، و در هوای بد بیشتر"], ["One second", "یک ثانیه"], ["Half a car length", "نصف طول خودرو"], ["The same as a large truck, 300 feet", "مانند کامیون بزرگ، ۳۰۰ فوت"]], "a": 0, "x": "کتابچه (آگاهی از موتورسیکلت): «بین خود و موتورسوار دست‌کم چهار ثانیه فاصله بگذارید؛ در هوای بد بیشتر.» موتورسیکلت‌ها می‌توانند خیلی سریع‌تر از خودرو بایستند و در جاده خیس یا یخ‌زده ترمز و مانور آن‌ها دشوارتر است. هرگز خط را با موتورسیکلت شریک نشوید."}, {"t": "special", "s": ["S6", "316.126"], "sg": null, "q": ["On a street with a posted speed limit of 20 mph, you approach a stopped tow truck with flashing lights and cannot move over a lane. You must slow to:", "در خیابانی با حداکثر سرعت ۲۰ مایل در ساعت، به یدک‌کش متوقفی با چراغ چشمک‌زن نزدیک می‌شوید و نمی‌توانید یک خط کنار بروید. سرعت را باید به چند مایل در ساعت برسانید؟"], "o": [["15 mph", "۱۵ مایل در ساعت"], ["10 mph", "۱۰ مایل در ساعت"], ["5 mph", "۵ مایل در ساعت"], ["No change is needed", "تغییری لازم نیست"]], "a": 2, "x": "صفحه رسمی Move Over سایت FLHSMV: اگر نمی‌توانید یک خط کنار بروید، سرعت را به ۲۰ مایل در ساعت کمتر از حد مجاز برسانید؛ و «وقتی حداکثر سرعت ۲۰ مایل در ساعت یا کمتر است، سرعت را به ۵ مایل در ساعت کاهش دهید.» ۱۰ و ۱۵ مایل در ساعت کاهش کافی نیستند و «تغییری لازم نیست» خلاف قانون است. این قانون شامل خودروهای امدادی، یدک‌کش، خدمات و هر خودروی ازکارافتاده با فلاشر است."}, {"t": "weather", "s": ["H5.31"], "sg": null, "q": ["When it starts to rain, the handbook says you should plan for a stopping distance of at least:", "وقتی باران شروع می‌شود، کتابچه می‌گوید برای دست‌کم چه مسافت توقفی برنامه‌ریزی کنید؟"], "o": [["Two times the normal stopping distance", "دو برابر مسافت توقف عادی"], ["The same as on a dry road", "همانند جاده خشک"], ["Half the normal distance, since you drive slower", "نصف مسافت عادی، چون آهسته‌تر می‌رانید"], ["Ten times the normal distance", "ده برابر مسافت عادی"]], "a": 0, "x": "کتابچه (دید کم): «اولین قطره‌های باران یعنی خطر. جاده‌ها درست پس از شروع باران از همه لغزنده‌ترند» و باید برای «دست‌کم دو برابر مسافت توقف عادی» برنامه‌ریزی کنید. روی جاده خیس لاستیک‌ها چسبندگی کمتری دارند، پس مسافت توقف کمتر نمی‌شود."}, {"t": "weather", "s": ["H5.31"], "sg": null, "q": ["What helps prevent hydroplaning (tires riding on a layer of water)?", "چه چیزی به جلوگیری از هیدروپلنینگ (سُر خوردن لاستیک روی لایه آب) کمک می‌کند؟"], "o": [["Keeping proper tire pressure and good tread, and slowing down in rain", "حفظ باد مناسب و آج خوب لاستیک‌ها و کم کردن سرعت در باران"], ["Driving faster so the tires skim over the water", "سریع‌تر راندن تا لاستیک‌ها از روی آب رد شوند"], ["Letting some air out of the tires", "خالی کردن مقداری از باد لاستیک‌ها"], ["Driving on tires with worn tread", "رانندگی با لاستیک‌های آج‌رفته"]], "a": 0, "x": "کتابچه: وقتی لاستیک‌ها با جاده تماس ندارند «به‌راحتی کنترل را از دست می‌دهید و سُر می‌خورید»؛ «باد مناسب و آج کافی» لاستیک‌ها از این اثر اسکی روی آب جلوگیری می‌کند. هرچه سریع‌تر برانید، خطر هیدروپلنینگ بیشتر است. باد کم لاستیک خطر را زیاد می‌کند. لاستیک آج‌رفته خطر هیدروپلنینگ را بیشتر می‌کند."}, {"t": "safe", "s": ["H5.30"], "sg": null, "q": ["According to the handbook, when is the risk of hitting animals like deer greatest?", "طبق کتابچه، خطر برخورد با حیواناتی مانند گوزن چه زمانی بیشتر است؟"], "o": [["October to December, especially at dawn and dusk", "اکتبر تا دسامبر، به‌ویژه در سپیده‌دم و هنگام غروب"], ["June to August at noon", "ژوئن تا اوت هنگام ظهر"], ["Only on rainy days", "فقط در روزهای بارانی"], ["Only on interstates", "فقط در بزرگراه‌های بین‌ایالتی"]], "a": 0, "x": "کتابچه (حیوانات): «خطر برخورد با حیوانات در ماه‌های اکتبر، نوامبر و دسامبر به‌دلیل فصل جفت‌گیری بیشترین است» و «در سپیده‌دم و غروب احتیاط کنید.» کنار جاده را برای بازتاب نور چراغ در چشم حیوانات بررسی کنید و در جاده‌هایی با تابلوی عبور گوزن هوشیار باشید."}, {"t": "crash", "s": ["316.066", "H4.10"], "sg": null, "q": ["You have a crash that damages property, and no police officer makes a report. When must you send a written crash report to FLHSMV?", "تصادفی دارید که به اموال خسارت زده و هیچ مأمور پلیسی گزارشی تهیه نکرده است. گزارش کتبی تصادف را تا چه زمانی باید به FLHSMV بفرستید؟"], "o": [["Within 10 days", "ظرف ۱۰ روز"], ["Within 24 hours", "ظرف ۲۴ ساعت"], ["Within 30 days", "ظرف ۳۰ روز"], ["Never; it is optional", "هرگز؛ اختیاری است"]], "a": 0, "x": "بند 316.066 و کتابچه: اگر تصادف به خودرو یا اموال خسارت زده و گزارش پلیس لازم نبوده یا تهیه نشده، راننده باید «ظرف ۱۰ روز پس از تصادف» گزارش کتبی به اداره (FLHSMV) بدهد. کتابچه این را برای خسارت بیش از ۵۰۰ دلار ذکر می‌کند. اگر پلیس گزارش را تهیه کند، تکلیف شما انجام شده است."}, {"t": "crash", "s": ["H4.10"], "sg": null, "q": ["After a crash, what information must you be ready to give the other people involved?", "پس از تصادف، چه اطلاعاتی را باید آماده باشید به افراد دیگر درگیر بدهید؟"], "o": [["Your name, address, vehicle registration number, and show your driver license", "نام، نشانی، شماره ثبت خودرو و نشان دادن گواهینامه"], ["Only your phone number", "فقط شماره تلفن"], ["Nothing until your lawyer arrives", "هیچ چیز تا وکیلتان برسد"], ["Only your insurance company's name", "فقط نام شرکت بیمه"]], "a": 0, "x": "کتابچه (تصادفات): «باید آماده باشید نام، نشانی و شماره ثبت خودروی خود را بدهید و گواهینامه‌تان را به دیگران درگیر در تصادف نشان دهید.» همچنین باید در صحنه بمانید، به پلیس یا گشت بزرگراه اطلاع دهید و در صورت وجود مصدوم کمک کنید. ترک صحنه بدون ارائه اطلاعات تخلف جدی است."}, {"t": "crash", "s": ["H5.33"], "sg": null, "q": ["You stop to help at a crash. An injured motorcyclist complains of neck pain. You should:", "برای کمک در صحنه تصادف توقف کرده‌اید. موتورسوار مجروحی از درد گردن شکایت دارد. چه باید بکنید؟"], "o": [["Not move the person and not remove the helmet; send for help", "فرد را جابه‌جا نکنید و کلاه ایمنی را برندارید؛ کمک بخواهید"], ["Remove the helmet so they can breathe easily", "کلاه را بردارید تا راحت نفس بکشد"], ["Help the person stand up and walk", "به او کمک کنید بایستد و راه برود"], ["Give the person water to drink", "به او آب بدهید"]], "a": 0, "x": "کتابچه (کمک‌های اولیه): «فرد مجروحی را که نمی‌تواند حرکت کند یا از درد کمر یا گردن شکایت دارد جابه‌جا نکنید. کلاه ایمنی موتورسوار یا دوچرخه‌سوار مجروح را برندارید.» همچنین «چیزی برای نوشیدن به او ندهید.» کسی را برای کمک بفرستید (۹۱۱)، خونریزی را با فشار مستقیم کنترل کنید و مصدوم را آرام نگه دارید."}, {"t": "crash", "s": ["H4.11"], "sg": null, "q": ["Who is responsible for trash thrown from a vehicle?", "چه کسی مسئول زباله‌ای است که از خودرو بیرون ریخته می‌شود؟"], "o": [["The driver", "راننده"], ["Only the passenger who threw it", "فقط سرنشینی که آن را پرتاب کرده"], ["No one, if it is biodegradable", "هیچ‌کس، اگر زیست‌تخریب‌پذیر باشد"], ["The vehicle owner's insurance", "بیمه مالک خودرو"]], "a": 0, "x": "کتابچه (زباله‌ریزی): «رانندگان مسئول هر زباله‌ای هستند که از خودروی آن‌ها ریخته می‌شود.» از زیرسیگاری و کیسه زباله استفاده کنید و آن‌ها را فقط در سطل زباله خالی کنید. ریختن زباله در جاده‌ها جریمه نقدی و حتی زندان دارد و دادگاه ممکن است شما را به جمع‌آوری زباله کنار جاده ملزم کند."}, {"t": "crash", "s": ["H4.7"], "sg": null, "q": ["Which of these is a serious violation of Florida's driver license law?", "کدام یک از این موارد تخلف جدی از قانون گواهینامه فلوریدا است؟"], "o": [["Letting an unlicensed person drive your car", "اجازه دادن به فرد بدون گواهینامه برای رانندگی با خودروی شما"], ["Renewing your license online", "تمدید آنلاین گواهینامه"], ["Carrying your license in your wallet", "نگه داشتن گواهینامه در کیف پول"], ["Updating your address within 30 days", "به‌روزرسانی نشانی ظرف ۳۰ روز"]], "a": 0, "x": "کتابچه (سایر تخلفات جدی): از جمله «اجازه دادن به فرد بدون گواهینامه برای استفاده از خودروی شما»، تغییر دادن گواهینامه، اجازه استفاده دیگری از گواهینامه شما، درخواست جعلی، داشتن بیش از یک گواهینامه یا کارت شناسایی، اطلاعات نادرست به پلیس یا در گزارش تصادف و گزارش ندادن تصادف. سه گزینه دیگر کارهای درست و قانونی‌اند."}, {"t": "dui", "s": ["S7"], "sg": null, "q": ["Under Florida law, DUI manslaughter (causing a death while driving under the influence) is:", "طبق قانون فلوریدا، «قتل غیرعمد ناشی از رانندگی تحت تأثیر» (DUI Manslaughter) چه نوع جرمی است؟"], "o": [["A second-degree felony (up to 15 years in prison)", "جنایت درجه دو (تا ۱۵ سال زندان)"], ["A misdemeanor with up to 6 months in jail", "جنحه با حداکثر ۶ ماه زندان"], ["A noncriminal traffic infraction", "تخلف رانندگی غیرکیفری"], ["A license suspension only", "فقط تعلیق گواهینامه"]], "a": 0, "x": "FLHSMV: «قتل غیرعمد ناشی از رانندگی تحت تأثیر (DUI Manslaughter): جنایت درجه دو (حداکثر ۱۰٬۰۰۰ دلار جریمه و/یا ۱۵ سال زندان).» اگر راننده بداند تصادف رخ داده و صحنه را ترک کند و کمک نکند، جنایت درجه یک (تا ۳۰ سال) است. ۶ ماه حداکثر زندان برای «اولین» DUI ساده است."}, {"t": "dui", "s": ["S7", "322.28"], "sg": null, "q": ["For a second DUI conviction within 5 years of a prior conviction, the minimum license revocation is:", "برای دومین محکومیت DUI در کمتر از ۵ سال پس از محکومیت قبلی، حداقل لغو گواهینامه چقدر است؟"], "o": [["180 days", "۱۸۰ روز"], ["1 year", "۱ سال"], ["5 years", "۵ سال"], ["10 years", "۱۰ سال"]], "a": 2, "x": "FLHSMV: اولین محکومیت (بدون آسیب) = حداقل ۱۸۰ روز تا ۱ سال؛ «دومین محکومیت در کمتر از ۵ سال = حداقل ۵ سال لغو»؛ سومین محکومیت برای تخلفی که ظرف ۱۰ سال پس از محکومیت قبلی رخ داده = حداقل ۱۰ سال."}, {"t": "dui", "s": ["S7", "H8.1"], "sg": null, "q": ["A driver under 21 whose license is suspended for a breath alcohol level of at least 0.02 but less than 0.05 must complete which course before hardship reinstatement?", "راننده زیر ۲۱ سال که گواهینامه‌اش به‌خاطر الکل تنفس دست‌کم ۰.۰۲ اما کمتر از ۰.۰۵ تعلیق شده، پیش از دریافت گواهینامه محدودِ Hardship (برای ضرورت کار یا تحصیل) باید چه دوره‌ای بگذراند؟"], "o": [["A Traffic Law and Substance Abuse Education (TLSAE) course", "دوره آموزش قوانین ترافیک و سوءمصرف مواد (TLSAE)"], ["A motorcycle safety course", "دوره ایمنی موتورسیکلت"], ["A CDL course", "دوره CDL"], ["No course is required", "هیچ دوره‌ای لازم نیست"]], "a": 0, "x": "FLHSMV: «تعلیق برای افراد زیر ۲۱ سال که با الکل تنفس ۰.۰۲ یا بیشتر رانندگی کرده‌اند: باید پیش از بازگشت گواهینامه Hardship دوره TLSAE را بگذرانند.» اگر میزان ۰.۰۵ یا بیشتر باشد، به‌جای آن گذراندن برنامه DUI لازم است و تعلیق تا تکمیل ارزیابی و دوره سوءمصرف مواد ادامه دارد. کتابچه (بخش ۸.۱) هم همین را می‌گوید."}, {"t": "crash", "s": ["322.27"], "sg": null, "q": ["Accumulating 18 points within 18 months results in a license suspension of:", "جمع کردن ۱۸ امتیاز منفی ظرف ۱۸ ماه، چه مدت تعلیق گواهینامه در پی دارد؟"], "o": [["Up to 30 days", "حداکثر ۳۰ روز"], ["Up to 3 months", "حداکثر ۳ ماه"], ["Up to 1 year", "حداکثر ۱ سال"], ["Permanent revocation", "لغو دائمی"]], "a": 1, "x": "بند 322.27: ۱۲ امتیاز در ۱۲ ماه = تعلیق تا ۳۰ روز؛ «۱۸ امتیاز در ۱۸ ماه = تعلیق تا ۳ ماه»؛ ۲۴ امتیاز در ۳۶ ماه = تعلیق تا ۱ سال. لغو دائمی بخشی از سیستم امتیاز نیست."}, {"t": "crash", "s": ["322.27"], "sg": null, "q": ["Running a red light (a traffic signal violation ticket written by a police officer) adds how many points?", "رد کردن چراغ قرمز (جریمه تخلف از چراغ راهنمایی که مأمور پلیس صادر کرده) چند امتیاز منفی دارد؟"], "o": [["2 points", "۲ امتیاز"], ["3 points", "۳ امتیاز"], ["4 points", "۴ امتیاز"], ["6 points", "۶ امتیاز"]], "a": 2, "x": "بند 322.27: «تخلف از چراغ راهنمایی = ۴ امتیاز.» بیشتر تخلفات حرکتی دیگر ۳ امتیاز دارند و تخلف حرکتی منجر به تصادف ۴ امتیاز. جریمه دوربین چراغ قرمز امتیاز منفی ندارد."}, {"t": "crash", "s": ["322.27"], "sg": null, "q": ["Leaving the scene of a crash that caused property damage of more than $50 adds how many points?", "ترک صحنه تصادفی که بیش از ۵۰ دلار خسارت مالی داشته، چند امتیاز منفی دارد؟"], "o": [["3 points", "۳ امتیاز"], ["4 points", "۴ امتیاز"], ["6 points", "۶ امتیاز"], ["No points", "بدون امتیاز"]], "a": 2, "x": "بند 322.27: «ترک صحنه تصادف با خسارت مالی بیش از ۵۰ دلار = ۶ امتیاز.» این یکی از بالاترین امتیازهای جدول است، همراه با «سرعت غیرمجاز منجر به تصادف» (۶ امتیاز). همیشه در صحنه بمانید یا اطلاعات خود را برای مالک خودروی پارک‌شده بگذارید."}], [{"t": "parking", "s": ["H5.27"], "q": ["You park facing UPHILL on a road with NO curb. Which way should you turn your front wheels?", "در جاده‌ای بدون جدول، خودرو را رو به سربالایی پارک می‌کنید. چرخ‌های جلو را به کدام سمت بچرخانید؟"], "o": [["Toward the center of the road (to the left)", "به سمت وسط جاده (به چپ)"], ["Straight ahead", "مستقیم"], ["Toward the edge of the road (to the right), so the car would roll away from traffic", "به سمت لبه جاده (به راست)، تا اگر خودرو حرکت کرد از ترافیک دور شود"], ["It does not matter if the parking brake is set", "اگر ترمز دستی کشیده شده باشد فرقی نمی‌کند"]], "a": 2, "x": "قاعده کتابچه (بخش ۵.۲۷) این است که چرخ‌ها را طوری بچرخانید که اگر خودرو راه افتاد، «از ترافیک دور شود یا به جدول بخورد». وقتی جدول نیست، تنها راه دور شدن از ترافیک چرخاندن چرخ‌ها به سمت لبه راست جاده است. چرخاندن به سمت وسط جاده خودرو را مستقیم به داخل ترافیک می‌فرستد. چرخ‌های مستقیم هیچ مانعی در برابر غلتیدن ایجاد نمی‌کنند. ترمز دستی لازم است، اما کتابچه چرخاندن درست چرخ‌ها را هم جداگانه می‌خواهد.", "sg": null}, {"t": "signals", "s": ["H9.6"], "q": ["A solid white line separates two lanes of traffic moving in the same direction. What does it mean?", "یک خط سفید ممتد دو خط عبورِ هم‌جهت را از هم جدا می‌کند. معنای آن چیست؟"], "o": [["You may cross it any
